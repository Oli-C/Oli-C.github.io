name: worker bundle

# Keeps SURFING/tools/surf-worker.js (the file pasted into the Cloudflare
# worker) in step with its sources: spots.js, score.js and tools/worker/*.
# Rebuilds on any change to them and commits the bundle if it moved. The
# deployed worker still has to be updated by hand (paste → Deploy); its
# GET /health shows the build it's running, to compare with the file.

on:
  push:
    branches: [master]
    paths:
      - 'SURFING/spots.js'
      - 'SURFING/score.js'
      - 'SURFING/tools/worker/**'
      - 'SURFING/tools/build-worker.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the worker bundle
        run: node SURFING/tools/build-worker.mjs
      - name: Commit if changed
        run: |
          git config user.name "surf-skill bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SURFING/tools/surf-worker.js
          if git diff --cached --quiet; then
            echo "bundle current"
          else
            git commit -m "worker: rebuild surf-worker.js [skip ci]"
            git push
          fi
