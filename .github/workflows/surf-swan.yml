name: surf swan

# How much of an offshore swell reaches each spot, from SWAN over the real
# seabed (SURFING/tools/swan.py): an area a job, every period and direction;
# and fine grids nested in their areas for the spots that matter most, at
# three offshore heights. Then merged into SURFING/swan.js (anything not
# rerun is kept), which score.js reads. By hand only; the seabed doesn't
# change. `quick` runs one case each and commits nothing.

on:
  workflow_dispatch:
    inputs:
      areas:
        description: 'Areas (JSON list; [] for none)'
        default: '[]'
      fine:
        description: 'Fine grids (JSON list; [] for none)'
        default: '["caparica","cascais","nazare","peniche"]'
      quick:
        description: 'One case each, to test (commits nothing)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: surf-swan
  cancel-in-progress: false

env:
  SWAN_URL: https://swanmodel.sourceforge.io/download/zip/SWAN-41.51-Linux.tar.gz

jobs:
  area:
    if: ${{ inputs.areas != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJSON(inputs.areas) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: |
          pip install numpy tifffile
          sudo apt-get install -y -qq libgfortran5 libgomp1 > /dev/null
          curl -sL "$SWAN_URL" | tar xz -C "$RUNNER_TEMP"
          echo "SWAN_EXE=$RUNNER_TEMP/SWAN-41.51-Linux/bin/swan.exe" >> "$GITHUB_ENV"
      - name: Bathymetry and the spots' points
        run: python SURFING/tools/swan.py prep ${{ matrix.area }}
      - name: Run SWAN
        run: python SURFING/tools/swan.py run ${{ matrix.area }} ${{ inputs.quick && '--quick' || '' }} --jobs $(nproc)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swan-${{ matrix.area }}
          path: |
            SURFING/tools/swan-work/${{ matrix.area }}/result.json
            SURFING/tools/swan-work/${{ matrix.area }}/meta.json
          if-no-files-found: warn

  fine:
    if: ${{ inputs.fine != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        fine: ${{ fromJSON(inputs.fine) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: |
          pip install numpy tifffile
          sudo apt-get install -y -qq libgfortran5 libgomp1 > /dev/null
          curl -sL "$SWAN_URL" | tar xz -C "$RUNNER_TEMP"
          echo "SWAN_EXE=$RUNNER_TEMP/SWAN-41.51-Linux/bin/swan.exe" >> "$GITHUB_ENV"
      - name: Run SWAN (its area for the edges, then the fine grid)
        run: python SURFING/tools/swan.py fine ${{ matrix.fine }} ${{ inputs.quick && '--quick' || '' }} --jobs $(nproc)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fine-${{ matrix.fine }}
          path: |
            SURFING/tools/swan-work/fine-${{ matrix.fine }}/result.json
            SURFING/tools/swan-work/fine-${{ matrix.fine }}/meta.json
          if-no-files-found: warn

  merge:
    needs: [area, fine]
    if: ${{ always() && !inputs.quick }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Merge
        run: |
          pip install numpy
          for d in artifacts/swan-*; do [ -d "$d" ] || continue; a="${d#artifacts/swan-}"; mkdir -p "SURFING/tools/swan-work/$a"; cp "$d"/result.json "$d"/meta.json "SURFING/tools/swan-work/$a/" 2>/dev/null || true; done
          for d in artifacts/fine-*; do [ -d "$d" ] || continue; a="${d#artifacts/}"; mkdir -p "SURFING/tools/swan-work/$a"; cp "$d"/result.json "$d"/meta.json "SURFING/tools/swan-work/$a/" 2>/dev/null || true; done
          python SURFING/tools/swan.py merge
      - name: Commit
        run: |
          git config user.name "surf-swan bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SURFING/swan.js
          if git diff --cached --quiet; then echo "no change"; else git commit -m "swan: what reaches each spot [skip ci]" && git pull --rebase && git push; fi
