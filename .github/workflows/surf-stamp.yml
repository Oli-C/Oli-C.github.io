name: surf stamp

# Keeps the surf pages' version stamps (?v=<hash>) in step with their own
# scripts and stylesheets (SURFING/tools/stamp.mjs), so a browser never
# mixes a cached old file with new ones. Commits the restamped pages if
# anything moved.

on:
  push:
    branches: [master]
    paths:
      - 'SURFING/*.js'
      - 'SURFING/*.css'
      - 'SURFING/*.html'
      - 'tally.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: surf-stamp
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stamp
        run: node SURFING/tools/stamp.mjs
      - name: Commit if changed
        run: |
          git config user.name "surf-stamp bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SURFING
          if git diff --cached --quiet; then echo "stamps current"; else git commit -m "surf: version stamps [skip ci]" && git pull --rebase && git push; fi
