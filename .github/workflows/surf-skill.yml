name: surf skill

# Verifies the forecast models against IPMA stations and IH buoys and
# publishes SURFING/data/skill.json, which both surf pages read to weight
# the models. Runs every three hours; safe to trigger by hand.

# Started on time by the surf worker's hourly cron (SURFING/tools/worker/
# dispatch.js); GitHub's own schedules were often skipped.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: surf-skill
  cancel-in-progress: false

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify models against measurements, pool feedback
        env:
          FEEDBACK_URL: ${{ secrets.FEEDBACK_URL }}
          FEEDBACK_KEY: ${{ secrets.FEEDBACK_KEY }}
        run: node SURFING/tools/skill.mjs
      - name: Commit if changed
        run: |
          git config user.name "surf-skill bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SURFING/data/skill.json SURFING/data/feedback.json SURFING/data/sessions.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "skill: model skill, feedback and sessions [skip ci]"
            # Someone else may have pushed meanwhile (the site, another bot): rebase and retry.
            for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep $((i * 10)); done; exit 1
          fi
