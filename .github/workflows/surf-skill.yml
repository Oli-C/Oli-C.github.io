name: surf skill

# Verifies the forecast models against IPMA stations and IH buoys and
# publishes SURFING/data/skill.json, which both surf pages read to weight
# the models. Runs every three hours; safe to trigger by hand.

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: surf-skill
  cancel-in-progress: false

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify models against measurements
        run: node SURFING/tools/skill.mjs
      - name: Commit if changed
        run: |
          git config user.name "surf-skill bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SURFING/data/skill.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "skill: model skill from stations and buoys [skip ci]"
            git push
          fi
