<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>allfield · chameleon archive</title>
<meta name="description" content="A 3D archive of Chameleon events — 48 posters, the people who played, and a thank-you to everyone who made it real.">
<link rel="icon" type="image/jpeg" href="../assets/favicon.jpg">
<meta name="theme-color" content="#05070c">
<!-- Content Security Policy: same-origin everything. 'unsafe-inline' on
     script-src lets dev servers (Live Server, etc.) inject hot-reload hooks
     without breaking; production has no such injection. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' ws: wss:;">

<!-- Preload only the assets where the credentials-mode + as= combo reliably
     matches the eventual fetch. plaque.webp and the HDRI are fetched via
     Three.js loaders whose internals don't always line up with link
     preload's matching rules, so they're loaded eagerly by the bundle
     instead — preloading them just causes double-fetches. -->
<link rel="preload" href="app.bundle.min.js" as="script" crossorigin>
<link rel="preload" href="fonts/anek-latin.woff2" as="font" type="font/woff2" crossorigin>

<!-- Link preview (Open Graph / Twitter card) — uses the event photo -->
<meta property="og:title"       content="allfield · chameleon archive">
<meta property="og:description" content="A 3D archive of Chameleon events — 48 posters, the people who played, and a thank-you to everyone who made it real.">
<meta property="og:type"        content="website">
<meta property="og:url"         content="https://oli-c.github.io/CHAMELEON/">
<meta property="og:image"       content="https://oli-c.github.io/CHAMELEON/photos/event-og.jpg">
<meta property="og:image:width"  content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card"        content="summary_large_image">
<meta name="twitter:title"       content="allfield · chameleon archive">
<meta name="twitter:description" content="A 3D archive of Chameleon events.">
<meta name="twitter:image"       content="https://oli-c.github.io/CHAMELEON/photos/event-og.jpg">
<style>
  /* Self-hosted Anek Kannada variable font (latin + latin-ext subsets only —
     site doesn't render any Kannada/Vietnamese glyphs). Eliminates the
     cross-origin font-src violations. */
  @font-face {
    font-family: 'Anek Kannada';
    font-style: normal;
    font-weight: 400 700;
    font-stretch: 125%;
    font-display: swap;
    src: url('fonts/anek-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: 'Anek Kannada';
    font-style: normal;
    font-weight: 400 700;
    font-stretch: 125%;
    font-display: swap;
    src: url('fonts/anek-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #05070c;
    --bg-2:      #0d1018;
    --fg:        #aab0b8;     /* HUD text — muted grey, not screaming white */
    --fg-muted:  #6e747c;
    --fg-subtle: #4a4d54;
    --border:    rgba(230, 231, 234, 0.08);
    --border-2:  rgba(230, 231, 234, 0.18);
    --accent:    #d85a2b;
    --ease:      cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: 'Anek Kannada', system-ui, sans-serif;
    font-stretch: 125%;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  #app { position: fixed; inset: 0; }
  canvas {
    display: block; width: 100%; height: 100%;
    cursor: default;
    transition: filter 0.4s var(--ease);
  }
  canvas.hover-poster { cursor: pointer; }
  canvas.dragging     { cursor: grabbing; }

  /* --- Loading splash --- */
  #loading {
    position: fixed; inset: 0; z-index: 30;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px;
    transition: opacity 0.7s var(--ease);
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #loading .label {
    font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--fg-muted);
  }
  #loading .bar {
    width: min(220px, 50vw); height: 2px;
    background: var(--border); overflow: hidden; border-radius: 2px;
  }
  #loading .bar > i {
    display: block; height: 100%; width: 0;
    background: var(--accent);
    transition: width 0.25s var(--ease);
  }

  /* --- HUD --- */
  .hud { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
  .hud > * { pointer-events: auto; }

  .back {
    position: fixed;
    top: calc(16px + env(safe-area-inset-top));
    left: calc(16px + env(safe-area-inset-left));
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 10px;
    color: var(--fg);
    text-decoration: none;
    font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
    background: transparent;
    border: none;
    opacity: 0.8;
    transition: opacity 0.2s var(--ease), color 0.2s var(--ease);
  }
  .back:hover { opacity: 1; color: #ffffff; }

  /* Left / right navigation arrows — just chevrons, no chrome */
  .nav-arrow {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 50px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    margin: 0;
    color: var(--fg);
    background: transparent;
    border: none;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s var(--ease), color 0.2s var(--ease);
  }
  .nav-arrow.show { opacity: 0.7; pointer-events: auto; }
  .nav-arrow:hover { opacity: 1; color: #ffffff; }
  .nav-arrow:active { transform: translateY(-50%) scale(0.92); }
  .nav-prev { left:  calc(8px + env(safe-area-inset-left)); }
  .nav-next { right: calc(8px + env(safe-area-inset-right)); }

  .prompt {
    position: fixed;
    left: 50%;
    bottom: calc(28px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    padding: 14px 22px;
    max-width: min(560px, calc(100vw - 48px));
    background: transparent;
    border: none;
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: #969ba2;
    opacity: 0;
    transition: opacity 0.6s var(--ease), transform 0.6s var(--ease);
    text-align: center;
    line-height: 1.7;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
  }
  .prompt.show { opacity: 0.85; }
  .prompt.hide { opacity: 0; transform: translate(-50%, 8px); pointer-events: none; }
  .prompt .sep { color: var(--fg-subtle); margin: 0 10px; }
  .prompt kbd {
    font-family: inherit;
    font-weight: 500;
    color: #c4c8ce;
    margin-right: 6px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
  }
  @media (max-width: 560px) {
    .prompt {
      font-size: 11px;
      padding: 12px 18px;
      bottom: calc(22px + env(safe-area-inset-bottom));
      letter-spacing: 0.08em;
      line-height: 1.7;
    }
    .prompt .sep { display: block; height: 0; margin: 0; overflow: hidden; visibility: hidden; }
  }

  /* --- Poster info card --- */
  .card {
    position: fixed;
    left: 50%;
    bottom: calc(96px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: min(460px, calc(100vw - 48px));
    padding: 13px 22px;
    box-sizing: border-box;
    background: #0b0b0d;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    opacity: 0;
    transition: opacity 0.32s var(--ease);
    cursor: pointer;
    text-align: center;
  }
  .card.show { opacity: 1; }
  .card-body { display: flex; flex-direction: column; align-items: center; }
  .card .index {
    font-size: 9px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #6e747c;
    margin-bottom: 6px;
  }
  .card .artist {
    font-size: 16px;
    font-weight: 600;
    color: #e8ebef;
    line-height: 1.18;
    letter-spacing: 0.005em;
  }
  .card .subtitle {
    font-size: 11px;
    font-style: italic;
    color: #9aa0a8;
    margin-top: 5px;
  }
  .card .support {
    font-size: 10.5px;
    font-style: italic;
    color: #8a8f97;
    margin-top: 6px;
    line-height: 1.35;
  }
  .card .divider {
    display: block;
    width: 24px;
    height: 1px;
    margin: 9px 0 8px;
    background: rgba(255, 255, 255, 0.18);
  }
  .card .meta {
    font-size: 9.5px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #8a8f97;
  }
  .card .venue {
    font-size: 9.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #6e747c;
    margin-top: 4px;
  }
  .card .meta:empty { display: none; }
  .card .badge {
    position: absolute;
    top: 9px;
    right: 11px;
    font-size: 8.5px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #c4c8ce;
    padding: 3px 7px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.03);
  }
  @media (max-width: 560px) {
    .card {
      bottom: calc(72px + env(safe-area-inset-bottom));
      width: calc(100vw - 32px);
      padding: 9px 16px 10px;
      border-radius: 9px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
    }
    .card .index    { font-size: 8px; letter-spacing: 0.24em; margin-bottom: 5px; }
    .card .artist   { font-size: 13px; line-height: 1.15; }
    .card .subtitle { font-size: 10px; margin-top: 3px; }
    .card .support  { font-size: 9px; margin-top: 4px; line-height: 1.3; }
    .card .divider  { width: 20px; margin: 7px 0 6px; }
    .card .meta     { font-size: 8.5px; letter-spacing: 0.2em; }
    .card .venue    { font-size: 8.5px; letter-spacing: 0.14em; margin-top: 3px; }
    .card .badge    { font-size: 6.5px; letter-spacing: 0.16em; padding: 2px 5px; top: 6px; right: 7px; }
  }
</style>
</head>
<body>

<div id="app"></div>

<div id="loading">
  <div class="label">loading gallery</div>
  <div class="bar"><i id="loadbar"></i></div>
</div>

<div class="hud">
  <a class="back" href="../">
    <span aria-hidden="true">←</span><span>back</span>
  </a>
  <button class="nav-arrow nav-prev" id="navPrev" aria-label="Previous painting">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 5 8 12 15 19"/></svg>
  </button>
  <button class="nav-arrow nav-next" id="navNext" aria-label="Next painting">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 5 16 12 9 19"/></svg>
  </button>
  <div class="prompt" id="prompt"></div>
  <div class="card" id="card">
    <div class="card-body" id="cardBody"></div>
  </div>
</div>

<script type="module" src="app.bundle.min.js"></script>

</body>
</html>
