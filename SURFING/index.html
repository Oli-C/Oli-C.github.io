<!DOCTYPE html>
<html lang="en" data-theme="charcoal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>allfield · surf cams</title>
<meta name="description" content="Live surf webcams, scored out of 10 against what each spot likes.">
<link rel="icon" type="image/jpeg" href="../assets/favicon.jpg">
<meta name="theme-color" content="#101820">
<link rel="preload" href="../assets/fonts/anek-kannada-latin.woff2" as="font" type="font/woff2" crossorigin>
<script>
  // Stamp the theme before first paint, same as the home page, so light-mode
  // visitors don't see the charcoal ground flash.
  document.documentElement.setAttribute('data-theme',
    matchMedia('(prefers-color-scheme: dark)').matches ? 'charcoal' : 'light');
</script>
<!-- Player + map styles. hls.js loads at once (the tiles need it); Plyr and
     Leaflet are fetched the first time a cam is opened or the map is shown. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  /* Anek Kannada, self-hosted — latin + latin-ext only, shared with the home page. */
  @font-face {
    font-family: 'Anek Kannada';
    font-style: normal;
    font-weight: 400 700;
    font-stretch: 125%;
    font-display: swap;
    src: url('../assets/fonts/anek-kannada-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: 'Anek Kannada';
    font-style: normal;
    font-weight: 400 700;
    font-stretch: 125%;
    font-display: swap;
    src: url('../assets/fonts/anek-kannada-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Palette mirrors style.css — "low light" Pantone scheme. */
  :root {
    --accent:  #ff8200;
    --sea:     #15616d;
    --live:    #e5484d;
    /* Score colours: flat-or-dark / poor / fair / good / epic */
    --lvl-0:   #5c6166;
    --lvl-1:   #8b2f45;
    --lvl-2:   #e3a23a;
    --lvl-3:   #9eb05c;
    --lvl-4:   #ff8200;
    --radius-sm: 4px;
    --radius:    10px;
    --radius-lg: 14px;
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    --controls-h: 150px; /* measured at runtime */
  }
  [data-theme="charcoal"] {
    --bg:       #101820;
    --bg-2:     #373a36;
    --bg-3:     #1a232c;
    --fg:       #d6d2c4;
    --fg-muted: #968c83;
    --accent-ink: var(--accent);
    --border:   rgba(214, 210, 196, 0.12);
    --border-2: rgba(214, 210, 196, 0.22);
    --border-3: rgba(214, 210, 196, 0.38);
    --shade:    rgba(5, 9, 13, 0.82);
  }
  [data-theme="light"] {
    --accent:   #ff6900;
    --lvl-4:    #ff6900;
    --bg:       #d7d2cb;
    --bg-2:     #bfb8af;
    --bg-3:     #eae6e0;
    --fg:       #101820;
    --fg-muted: #6e6259;
    --accent-ink: color-mix(in srgb, var(--accent) 58%, var(--fg));
    --border:   rgba(16, 24, 32, 0.12);
    --border-2: rgba(16, 24, 32, 0.22);
    --border-3: rgba(16, 24, 32, 0.40);
    --shade:    rgba(16, 24, 32, 0.72);
  }

  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Anek Kannada', system-ui, sans-serif;
    font-stretch: 125%;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    letter-spacing: -0.005em;
  }
  body.locked { overflow: hidden; }

  .page {
    max-width: 1800px;
    margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 64px max(16px, env(safe-area-inset-left));
  }

  /* ---------- Header ---------- */
  .top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }
  .back {
    color: var(--fg-muted);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 0.04em;
  }
  .back:hover, .back:focus-visible { color: var(--accent-ink); }
  h1 {
    font-size: clamp(34px, 7vw, 52px);
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.03em;
  }
  h1 span { color: var(--accent-ink); }
  .lede {
    color: var(--fg-muted);
    font-size: 15px;
    margin-top: 6px;
  }

  /* "Best right now" — the three top-scoring cams, one tap away. */
  .best {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 14px;
  }
  .best[hidden] { display: none; }
  .best-label {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-muted);
    margin-right: 4px;
  }
  .best-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font: inherit;
    font-size: 14px;
    color: var(--fg);
    background: var(--bg-3);
    border: 1px solid var(--border-2);
    border-radius: 999px;
    padding: 4px 12px 4px 4px;
    cursor: pointer;
    transition: border-color .2s var(--ease), transform .2s var(--ease);
  }
  .best-chip:hover, .best-chip:focus-visible { border-color: var(--accent); transform: translateY(-1px); outline: none; }
  /* Today's tide, coast-wide, right by the title. */
  .tide-now {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 14px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .tide-now[hidden] { display: none; }
  .tide-now .k { font-weight: 400; }
  .tide-now span + span::before { content: "·"; color: var(--fg-muted); margin-right: 10px; font-weight: 400; }
  .tide-now .k + span::before { content: none; }
  /* Wide: title left, tide + best-right-now fill the right of the header. */
  @media (min-width: 1100px) {
    .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
    .aside { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
    .tide-now { margin-top: 0; justify-content: flex-end; }
    .best { margin-top: 0; justify-content: flex-end; }
  }

  /* ---------- Search + filters (sticky) ---------- */
  /* Compact: two short rows on phones, one row on wide screens. */
  .controls {
    position: sticky;
    top: 0;
    z-index: 5;
    margin: 12px -16px 14px;
    padding: 8px 16px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .r2 { margin-top: 6px; }
  .search { position: relative; flex: 1; min-width: 0; }
  .search svg {
    position: absolute;
    left: 11px;
    top: 50%;
    width: 15px;
    height: 15px;
    transform: translateY(-50%);
    color: var(--fg-muted);
    pointer-events: none;
  }
  .search input {
    width: 100%;
    font: inherit;
    font-size: 14px;
    color: var(--fg);
    background: var(--bg-3);
    border: 1px solid var(--border-2);
    border-radius: 8px;
    padding: 7px 10px 5px 32px;
    outline: none;
    transition: border-color .2s var(--ease);
  }
  .search input::placeholder { color: var(--fg-muted); }
  .search input:focus { border-color: var(--accent); }

  .seg {
    flex: none;
    display: inline-flex;
    border: 1px solid var(--border-2);
    border-radius: 8px;
    padding: 2px;
    background: var(--bg-3);
  }
  .seg button {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font: inherit;
    font-size: 12px;
    letter-spacing: 0.03em;
    color: var(--fg-muted);
    background: transparent;
    border: 0;
    border-radius: 6px;
    padding: 5px 9px 3px;
    cursor: pointer;
    transition: color .2s var(--ease), background .2s var(--ease);
  }
  .seg button[aria-pressed="true"] {
    color: #101820;
    background: var(--accent);
  }
  .seg svg { width: 13px; height: 13px; }

  .chips {
    flex: 1;
    min-width: 0;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    font: inherit;
    font-size: 12px;
    letter-spacing: 0.03em;
    color: var(--fg-muted);
    background: transparent;
    border: 1px solid var(--border-2);
    border-radius: 999px;
    padding: 4px 10px 2px;
    cursor: pointer;
    transition: color .2s var(--ease), border-color .2s var(--ease), background .2s var(--ease);
  }
  .chip:hover { color: var(--fg); border-color: var(--border-3); }
  .chip[aria-pressed="true"] {
    color: var(--fg);
    background: var(--bg-2);
    border-color: var(--border-3);
  }
  /* Data saver: tiles stay on their snapshot; only the cam you open streams. */
  .switch {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: inherit;
    font-size: 11px;
    letter-spacing: 0.03em;
    color: var(--fg-muted);
    background: transparent;
    border: 0;
    padding: 2px 0;
    cursor: pointer;
    white-space: nowrap;
  }
  .switch i {
    position: relative;
    width: 26px;
    height: 16px;
    border-radius: 999px;
    background: var(--bg-2);
    border: 1px solid var(--border-2);
    transition: background .2s var(--ease);
  }
  .switch i::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--fg-muted);
    transition: transform .2s var(--ease), background .2s var(--ease);
  }
  .switch[aria-checked="true"] { color: var(--fg); }
  .switch[aria-checked="true"] i { background: var(--accent); border-color: var(--accent); }
  .switch[aria-checked="true"] i::after { background: #101820; transform: translateX(10px); }

  /* Wide: search · areas · view · saver on one line */
  @media (min-width: 1100px) {
    .controls { display: flex; align-items: center; gap: 10px; }
    .row { display: contents; }
    .search { flex: 0 1 340px; order: 1; }
    .chips { order: 2; }
    .seg { order: 3; }
    .switch { order: 4; }
  }
  /* Phones: 16px input stops iOS zooming on focus */
  @media (max-width: 640px) {
    .search input { font-size: 16px; padding: 8px 10px 6px 32px; }
  }

  /* ---------- Score badge (shared by tiles, pins, popups, viewer) ---------- */
  .lvl-0 { --pin: var(--lvl-0); --ink: #fff; }
  .lvl-1 { --pin: var(--lvl-1); --ink: #fff; }
  .lvl-2 { --pin: var(--lvl-2); --ink: #101820; }
  .lvl-3 { --pin: var(--lvl-3); --ink: #101820; }
  .lvl-4 { --pin: var(--lvl-4); --ink: #101820; }
  .lvl-x { --pin: var(--bg-2); --ink: var(--fg-muted); }
  .score {
    display: inline-flex;
    align-items: baseline;
    gap: 5px;
    color: var(--ink);
    background: var(--pin);
    border-radius: 8px;
    padding: 4px 8px 2px;
    white-space: nowrap;
    line-height: 1;
  }
  .score b { font-size: 15px; font-weight: 700; }
  .score small { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  .score.lg b { font-size: 26px; }
  .score.lg small { font-size: 12px; }

  /* Four-bar "today" strip — mini on tiles, full-size in the viewer. */
  .mini {
    display: inline-flex;
    gap: 2px;
    align-items: flex-end;
    height: 14px;
    flex: none;
  }
  .mini i {
    display: block;
    width: 5px;
    min-height: 2px;
    border-radius: 1px;
    background: var(--pin, var(--bg-2));
  }
  .mini i.past { opacity: .35; }
  .mini i.now { outline: 1px solid #fff; outline-offset: 1px; }

  /* ---------- Layout: cams + map ---------- */
  .layout {
    display: grid;
    gap: 16px;
    align-items: start;
  }
  .layout[data-view="split"] { grid-template-columns: minmax(0, 1fr) minmax(340px, 38%); }
  .layout[data-view="grid"] .map-pane { display: none; }
  .layout[data-view="map"] .list { display: none; }
  .map-pane {
    position: sticky;
    top: calc(var(--controls-h) + 12px);
  }
  #map {
    height: calc(100vh - var(--controls-h) - 44px);
    min-height: 380px;
    border: 1px solid var(--border-2);
    border-radius: var(--radius-lg);
    background: var(--bg-3);
    overflow: hidden;
    z-index: 0;
  }
  .layout[data-view="map"] .map-pane { position: static; }
  .layout[data-view="map"] #map { height: clamp(420px, 72vh, 860px); }
  @media (max-width: 999px) {
    .layout[data-view="split"] { grid-template-columns: 1fr; }
    .layout[data-view="split"] .map-pane { display: none; }
    #seg-split { display: none; }
  }

  /* ---------- Areas and tiles ---------- */
  .area { margin-bottom: 24px; }
  .area[hidden] { display: none; }
  .area-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .area-head h2 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .area-head h2 small {
    font-size: 13px;
    font-weight: 400;
    color: var(--fg-muted);
    margin-left: 8px;
    letter-spacing: 0;
  }
  .area-sum {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 2px 14px;
    color: var(--fg-muted);
    font-size: 13px;
    text-align: right;
  }
  .area-sum b { color: var(--fg); font-weight: 600; }
  .tide-sum { color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
  /* Tiles are the preview; everything else sits on top of the picture.
     Beside the map they stay modest; in Cams mode they fill the width. */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 12px;
  }
  .layout[data-view="grid"] .cards {
    grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
    gap: 14px;
  }
  @media (max-width: 640px) {
    .cards, .layout[data-view="grid"] .cards { grid-template-columns: 1fr; gap: 12px; }
  }

  .cam {
    position: relative;
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    font: inherit;
    color: #fff;
    background:
      radial-gradient(120% 90% at 20% 110%, color-mix(in srgb, var(--sea) 70%, transparent), transparent 60%),
      linear-gradient(160deg, var(--bg-2), var(--bg));
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    cursor: pointer;
    transition: transform .25s var(--ease), border-color .25s var(--ease), box-shadow .25s var(--ease);
  }
  .cam:hover, .cam:focus-visible {
    transform: translateY(-2px);
    border-color: var(--border-3);
    outline: none;
  }
  .cam:focus-visible { border-color: var(--accent); }
  .cam.flash { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }

  /* Snapshot underneath, live video on top once it's actually playing. */
  .cam img, .cam video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity .4s var(--ease);
  }
  .cam img.ready, .cam video.ready { opacity: 1; }
  .cam .score {
    position: absolute;
    z-index: 2;
    right: 8px;
    top: 8px;
    padding: 3px 6px 2px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }
  .cam .score b { font-size: 12px; }
  .cam .score small { font-size: 9px; }
  .live {
    position: absolute;
    z-index: 2;
    left: 8px;
    top: 8px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #fff;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    padding: 3px 7px 2px;
    border-radius: 999px;
  }
  .live i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--fg-muted);
  }
  /* The dot only goes red once the tile is really streaming. */
  .cam.streaming .live i { background: var(--live); animation: pulse 2s infinite; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(229, 72, 77, .6); }
    70%  { box-shadow: 0 0 0 6px rgba(229, 72, 77, 0); }
    100% { box-shadow: 0 0 0 0 rgba(229, 72, 77, 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .live i, .pin.lvl-4::after { animation: none; }
    .cam, .cam img, .cam video { transition: none; }
  }

  /* Small text overlay along the bottom of the picture */
  /* Kept to a thin strip so the picture stays the point. */
  .overlay {
    position: absolute;
    z-index: 1;
    left: 0; right: 0; bottom: 0;
    padding: 14px 8px 6px;
    text-align: left;
    background: linear-gradient(to top, rgba(0,0,0,0.72), rgba(0,0,0,0));
  }
  .overlay .name {
    font-size: 12px;
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
  .overlay .sub {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 6px;
    margin-top: 1px;
  }
  .overlay .where, .overlay .cond-line {
    font-size: 10px;
    letter-spacing: 0.02em;
    color: rgba(255,255,255,0.75);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .overlay .cond-line b { color: #fff; font-weight: 600; }
  .overlay .sub .mini-slot { flex: none; }
  .overlay .mini { height: 10px; }
  .overlay .mini i { width: 4px; }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  .tag {
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--fg-muted);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 3px 7px 1px;
  }

  .empty {
    display: none;
    text-align: center;
    color: var(--fg-muted);
    padding: 60px 16px;
  }
  .empty.show { display: block; }

  /* ---------- Map ---------- */
  .legend {
    position: absolute;
    z-index: 1;
    left: 12px;
    bottom: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--fg);
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 7px 10px 5px;
    pointer-events: none;
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 9px; height: 9px; border-radius: 50%; background: var(--pin); }
  .map-hint {
    color: var(--fg-muted);
    font-size: 12px;
    margin-top: 8px;
    letter-spacing: 0.02em;
  }

  /* OSM's street tiles are light; in the charcoal theme we invert them.
     Satellite imagery is left alone. */
  [data-theme="charcoal"] .osm-tiles {
    filter: invert(1) hue-rotate(180deg) brightness(0.82) contrast(0.9) saturate(0.55);
  }

  /* Pins: a divIcon carrying the score, coloured by level. */
  .pin-wrap { background: none; border: 0; }
  .pin {
    position: relative;
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
    padding-top: 1px;
    color: var(--ink);
    background: var(--pin);
    border: 2px solid #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.45);
    transition: transform .2s var(--ease);
  }
  .pin.lvl-x { border-style: dashed; border-color: var(--fg-muted); }
  .pin.lvl-4::after {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    animation: pulse-pin 2s infinite;
  }
  @keyframes pulse-pin {
    0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--lvl-4) 60%, transparent); }
    70%  { box-shadow: 0 0 0 10px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  .leaflet-marker-icon:hover .pin, .leaflet-marker-icon.hot .pin { transform: scale(1.18); }
  .leaflet-marker-icon.hot { z-index: 1000 !important; }

  /* Leaflet chrome in our palette */
  .leaflet-container { font-family: inherit; background: var(--bg-3); }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
    background: var(--bg-3);
    color: var(--fg);
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .leaflet-popup-content-wrapper { border-radius: var(--radius); border: 1px solid var(--border-2); }
  .leaflet-popup-content { margin: 12px 14px; font-size: 14px; line-height: 1.35; }
  .leaflet-bar a {
    background: var(--bg-3);
    color: var(--fg);
    border-bottom-color: var(--border-2);
  }
  .leaflet-bar a:hover { background: var(--bg-2); color: var(--fg); }
  .leaflet-control-layers {
    background: var(--bg-3);
    color: var(--fg);
    border: 1px solid var(--border-2);
    border-radius: var(--radius);
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
  }
  .leaflet-control-layers-expanded { padding: 6px 10px 4px; font-size: 12px; letter-spacing: 0.03em; }
  .leaflet-control-layers label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .leaflet-control-layers input { accent-color: var(--accent); }
  .leaflet-control-attribution {
    background: color-mix(in srgb, var(--bg) 80%, transparent);
    color: var(--fg-muted);
    font-size: 10px;
  }
  .leaflet-control-attribution a { color: var(--fg); }
  .leaflet-tooltip {
    background: var(--bg-3);
    color: var(--fg);
    border: 1px solid var(--border-2);
    border-radius: var(--radius-sm);
    font-size: 12px;
    padding: 3px 7px 1px;
  }
  .leaflet-tooltip-top::before { border-top-color: var(--border-2); }

  .pop-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .pop-name { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .pop-where { color: var(--fg-muted); font-size: 13px; }
  .pop-cond { margin-top: 8px; font-size: 13px; color: var(--fg-muted); }
  .pop-cond b { color: var(--fg); font-weight: 600; }
  .pop-cond .mini i.now { outline-color: var(--fg); }
  .pop-sum { margin-top: 4px; font-size: 12px; color: var(--fg-muted); }
  .pop-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pop-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #101820;
    background: var(--accent);
    border: 0;
    border-radius: 999px;
    padding: 8px 14px 6px;
    cursor: pointer;
  }
  .pop-btn svg { width: 12px; height: 12px; }

  /* Secondary pill button (Directions) */
  .nav {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: inherit;
    font-size: 13px;
    letter-spacing: 0.03em;
    color: var(--fg);
    text-decoration: none;
    background: transparent;
    border: 1px solid var(--border-2);
    border-radius: 999px;
    padding: 8px 13px 6px;
    cursor: pointer;
    transition: border-color .2s var(--ease), color .2s var(--ease);
  }
  .nav:hover, .nav:focus-visible { border-color: var(--accent); color: var(--accent-ink); outline: none; }
  .nav svg { width: 13px; height: 13px; }

  /* "Open in…" chooser for directions */
  .go {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: grid;
    place-items: end center;
    padding: 16px;
    background: var(--shade);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s var(--ease);
  }
  .go.open { opacity: 1; pointer-events: auto; }
  .go-card {
    width: min(420px, 100%);
    background: var(--bg);
    border: 1px solid var(--border-2);
    border-radius: var(--radius-lg);
    padding: 16px 16px calc(14px + env(safe-area-inset-bottom));
    transform: translateY(16px);
    transition: transform .25s var(--ease);
  }
  .go.open .go-card { transform: none; }
  .go-title { font-size: 16px; font-weight: 600; }
  .go-sub { color: var(--fg-muted); font-size: 13px; margin-top: 2px; }
  .go-list { display: grid; gap: 8px; margin-top: 14px; }
  .go-opt {
    display: flex;
    align-items: center;
    gap: 12px;
    font: inherit;
    font-size: 15px;
    color: var(--fg);
    text-decoration: none;
    background: var(--bg-3);
    border: 1px solid var(--border-2);
    border-radius: var(--radius);
    padding: 12px 14px 10px;
    transition: border-color .2s var(--ease);
  }
  .go-opt:hover, .go-opt:focus-visible { border-color: var(--accent); outline: none; }
  .go-opt i {
    width: 10px; height: 10px; border-radius: 50%; flex: none;
  }
  .go-opt small { margin-left: auto; color: var(--fg-muted); font-size: 12px; }
  .go-cancel {
    width: 100%;
    margin-top: 10px;
    font: inherit;
    font-size: 14px;
    color: var(--fg-muted);
    background: transparent;
    border: 0;
    padding: 10px;
    cursor: pointer;
  }
  .go-cancel:hover { color: var(--fg); }
  @media (min-width: 641px) { .go { place-items: center; } }

  /* ---------- Viewer ---------- */
  .viewer {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--shade);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s var(--ease);
  }
  .viewer.open { opacity: 1; pointer-events: auto; }
  .sheet {
    width: min(1100px, 100%);
    max-height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    border: 1px solid var(--border-2);
    border-radius: var(--radius-lg);
    overflow: hidden auto;
    transform: translateY(12px);
    transition: transform .3s var(--ease);
  }
  .viewer.open .sheet { transform: none; }
  /* The header (and its close button) stays put while the sheet scrolls. */
  .sheet-head {
    position: sticky;
    top: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 12px 12px 18px;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .sheet-title { flex: 1; min-width: 0; }
  .sheet-title .name {
    font-size: 19px;
    font-weight: 600;
    line-height: 1.15;
    letter-spacing: -0.015em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sheet-title .where { font-size: 14px; color: var(--fg-muted); margin-top: 2px; }
  .icon-btn {
    flex: none;
    display: inline-grid;
    place-items: center;
    width: 40px;
    height: 40px;
    color: var(--fg);
    background: var(--bg-3);
    border: 1px solid var(--border-2);
    border-radius: 50%;
    cursor: pointer;
    text-decoration: none;
    transition: border-color .2s var(--ease), color .2s var(--ease);
  }
  .icon-btn:hover, .icon-btn:focus-visible { border-color: var(--accent); color: var(--accent-ink); outline: none; }
  #v-close { background: var(--accent); color: #101820; border-color: var(--accent); }
  #v-close:hover, #v-close:focus-visible { color: #101820; filter: brightness(1.08); }

  .frame {
    position: relative;
    flex: none;
    background: #000;
  }
  .frame.video { aspect-ratio: 16 / 9; }
  .frame.page  { height: min(70vh, 900px); }
  .frame iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
  .frame-msg {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    text-align: center;
    color: #d6d2c4;
    font-size: 15px;
  }
  /* Plyr in our palette. Plyr is given ratio 16:9 so it fills .frame.video exactly. */
  .plyr {
    --plyr-color-main: var(--accent);
    --plyr-video-background: #000;
    --plyr-font-family: inherit;
    --plyr-control-radius: 6px;
  }

  .panel { padding: 14px 18px; border-top: 1px solid var(--border); }
  .panel[hidden] { display: none; }
  .k {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-muted);
  }

  /* Score breakdown: one row per factor */
  .scorecard {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 14px 20px;
    align-items: start;
  }
  .score-total { display: flex; flex-direction: column; gap: 6px; }
  .score-cap { font-size: 12px; color: var(--fg-muted); max-width: 150px; }
  .factors { display: grid; gap: 8px; }
  .factor {
    display: grid;
    grid-template-columns: 76px 1fr 44px;
    gap: 4px 10px;
    align-items: center;
  }
  .factor .k { padding-top: 2px; }
  .f-bar {
    height: 6px;
    border-radius: 3px;
    background: var(--bg-2);
    overflow: hidden;
  }
  .f-bar i { display: block; height: 100%; background: var(--pin, var(--accent)); border-radius: 3px; }
  .f-pts { font-size: 13px; font-weight: 600; text-align: right; white-space: nowrap; }
  .f-detail {
    grid-column: 2 / -1;
    font-size: 12px;
    color: var(--fg-muted);
    line-height: 1.3;
  }
  .f-detail b { color: var(--fg); font-weight: 600; }

  /* Today: four bars, dawn → evening */
  .today-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .today-bars {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 10px;
  }
  .tbar {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .tbar .col {
    position: relative;
    width: 100%;
    height: 64px;
    border-radius: 6px;
    background: var(--bg-3);
    overflow: hidden;
  }
  .tbar .col i {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: var(--pin, var(--bg-2));
    border-radius: 6px 6px 0 0;
    min-height: 3px;
  }
  .tbar b { font-size: 14px; }
  .tbar span { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-muted); white-space: nowrap; }
  .tbar.past { opacity: .45; }
  .tbar.now .col { outline: 2px solid var(--fg); outline-offset: 1px; }
  .today-sum { margin-top: 12px; font-size: 14px; line-height: 1.45; }

  /* "Right now": water, air, light, tide, suit */
  .now-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px 16px;
    margin-top: 8px;
  }
  .now-row .v { display: block; font-size: 16px; font-weight: 600; margin-top: 2px; white-space: nowrap; }
  .now-row .v small { font-size: 12px; font-weight: 400; color: var(--fg-muted); }

  .local-row {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    margin-top: 6px;
    font-size: 14px;
    color: var(--fg-muted);
  }
  .local-row b { color: var(--fg); font-weight: 600; }
  .local-notes {
    margin-top: 8px;
    font-size: 14px;
    line-height: 1.45;
  }
  .panel .tags { margin-top: 10px; }

  .sheet-foot {
    padding: 10px 18px 12px;
    color: var(--fg-muted);
    font-size: 13px;
    letter-spacing: 0.02em;
  }
  .sheet-foot a { color: var(--accent-ink); }

  /* Phones: the viewer becomes a full-screen sheet */
  @media (max-width: 640px) {
    .viewer { padding: 0; place-items: stretch; }
    .sheet {
      width: 100%;
      height: 100%;
      border-radius: 0;
      border: 0;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .sheet-head { padding-top: max(12px, env(safe-area-inset-top)); }
    .frame.page { flex: 1; height: auto; min-height: 60vh; }
    .scorecard { grid-template-columns: 1fr; }
    .seg button span { display: none; }
    .seg button { padding: 8px 10px 6px; }
    .tbar span { font-size: 10px; }
  }
</style>
</head>
<body>

<main class="page">
  <header>
    <div class="top">
      <a class="back" href="../">← allfield</a>
    </div>
    <div class="head">
      <h1>surf cams<span>.</span></h1>
      <div class="aside">
        <div class="tide-now" id="tide-now" hidden></div>
        <div class="best" id="best" hidden></div>
      </div>
    </div>
  </header>

  <div class="controls" id="controls">
    <div class="row">
      <label class="search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="Search spots, towns, areas…" autocomplete="off" aria-label="Search cams">
      </label>
      <div class="seg" role="group" aria-label="View">
        <button type="button" id="seg-grid" data-view="grid" aria-pressed="false" title="Cams only">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span>Cams</span>
        </button>
        <button type="button" id="seg-split" data-view="split" aria-pressed="false" title="Cams beside the map">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>
          <span>Split</span>
        </button>
        <button type="button" id="seg-map" data-view="map" aria-pressed="false" title="Map only">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>
          <span>Map</span>
        </button>
      </div>
    </div>
    <div class="row r2">
      <div class="chips" id="chips" role="group" aria-label="Filter by area"></div>
      <button class="switch" id="saver" type="button" role="switch" aria-checked="false" title="Don’t auto-play the tiles; only stream the cam you open">
        <i aria-hidden="true"></i>Data saver
      </button>
    </div>
  </div>

  <div class="layout" id="layout" data-view="split">
    <div class="list" id="grid"></div>
    <aside class="map-pane" id="map-wrap">
      <div style="position: relative">
        <div id="map" role="region" aria-label="Map of surf cams"></div>
        <div class="legend" aria-hidden="true">
          <span class="lvl-0"><i></i>Flat</span>
          <span class="lvl-1"><i></i>Poor</span>
          <span class="lvl-2"><i></i>Fair</span>
          <span class="lvl-3"><i></i>Good</span>
          <span class="lvl-4"><i></i>Epic</span>
        </div>
      </div>
      <p class="map-hint" id="map-hint">Pins show each spot’s score. Tap one for details, directions and the cam.</p>
    </aside>
  </div>
  <p class="empty" id="empty">No cams match that. Try another spot or clear the filter.</p>
</main>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="v-name" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-title">
        <div class="name" id="v-name"></div>
        <div class="where" id="v-where"></div>
      </div>
      <a class="icon-btn" id="v-open" target="_blank" rel="noopener noreferrer" aria-label="Open on source site" title="Open on source site">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
      </a>
      <button class="icon-btn" id="v-close" type="button" aria-label="Close" title="Close (Esc)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="frame" id="v-frame"></div>
    <div class="panel scorecard" id="v-score" hidden></div>
    <div class="panel" id="v-now" hidden></div>
    <div class="panel" id="v-today" hidden></div>
    <div class="panel" id="v-local"></div>
    <div class="sheet-foot" id="v-foot"></div>
  </div>
</div>

<!-- Directions: one button everywhere, then pick the app -->
<div class="go" id="go" role="dialog" aria-modal="true" aria-labelledby="go-title" hidden>
  <div class="go-card">
    <div class="go-title" id="go-title">Directions</div>
    <div class="go-sub" id="go-sub"></div>
    <div class="go-list" id="go-list"></div>
    <button class="go-cancel" id="go-cancel" type="button">Cancel</button>
  </div>
</div>

<script>
  /* ---------------------------------------------------------------------------
     CAMS — add a new webcam by appending an entry.

       id      url-safe slug, used for deep links (surfing/#guincho-norte)
       name    spot name shown on the card
       town    nearest town / area
       area    the group it's listed under and the filter chip it sits in
       zone    finer locality shown on the card (e.g. "Baleal")
       country
       tags    extra search words (break type, orientation, nicknames…)
       lat/lng the camera's beach — where the pin goes and where directions
               lead. Checked against OpenStreetMap where it names the beach.
       faces   compass bearing the beach looks out to sea (270 = west). Used
               to spot onshore wind and to fetch conditions from a point just
               offshore rather than on the sand.
       best    local knowledge, used by the score:
                 swell   [from, to] compass window the spot likes swell from
                 size    [min, max] metres of swell it works in
                 period  seconds — the period it starts to get good at
                 exposure 0–1: how much of a swell from OUTSIDE the window
                           still reaches the beach (open beach ~0.85,
                           tucked-away south-facer ~0.45). Default 0.85.
                 gain    multiplier on swell height at the beach (Nazaré's
                           canyon: 1.4). Default 1.
                 wind    [from, to] compass window of offshore wind
                 tide    { range: [lo, hi] of the tide the spot likes, where
                           0 = today's low water and 1 = high water;
                           dir: 'rising' | 'falling' | null; text: shown }
                 notes   a sentence or two for the viewer
       type    'hls'   — a raw HLS stream (.m3u8) played in our own player
                         (Plyr; Safari plays HLS natively, other browsers load
                         hls.js), shown 16:9. Tiles in the grid also play it.
               'video' — a player-only embed (YouTube live, official cam embed),
                         shown 16:9
               'page'  — a full web page in a frame (no player-only embed
                         available), shown tall
       embed   the .m3u8 URL for 'hls', otherwise the URL loaded in the iframe
       poster  optional still shown before an 'hls' stream starts
       fallback optional page URL framed instead if an 'hls' stream won't play
       link    the cam's own page, for the "open on source" button
       source  who runs / hosts the cam
       thumb   optional preview image (also the tile's backdrop until it plays)

     Areas are listed in the order they first appear here, so keep the array
     roughly north → south.
  --------------------------------------------------------------------------- */

  // Shared local knowledge for the Caparica jetty beaches.
  const CAPARICA = {
    swell: [240, 320], size: [0.6, 2.0], period: 9, exposure: 0.8, wind: [30, 120], tide: { range: [0, 1], dir: 'rising', text: 'all tides, best on the push' },
    notes: 'Jetty-sheltered beach breaks with gentle banks, the surf-school stretch south of Lisbon. Takes most W/NW swell and works on every tide, best as it rises; above ~2 m it starts to wall up. E/NE wind cleans it; the summer nortada blows it side-on.',
  };

  const CAMS = [
    {
      id:      'nazare-norte',
      name:    'Praia do Norte',
      town:    'Nazaré', area: 'Nazaré', zone: 'Praia do Norte',
      country: 'Portugal',
      tags:    ['beach break', 'big wave', 'canyon', 'heavy'],
      lat: 39.6080, lng: -9.0850, faces: 290,   // the beach north of the fort / lighthouse
      best: {
        swell: [260, 330], size: [0.6, 2.5], period: 9, exposure: 0.9, gain: 1.4, wind: [60, 150], tide: { range: [0.2, 0.8], dir: null, text: 'mid' },
        notes: 'The big-wave beach, the Nazaré Canyon focuses any W–NW swell into something far heavier than the numbers suggest. For paddling it’s a powerful, shifty beach break that’s best small (under ~2 m), mid tide, with an E/SE wind; above that it’s tow-in country and the rips are serious. Experienced surfers only. Praia da Vila, round the headland, is the gentler option.',
      },
      type:    'hls',
      embed:   'https://deliverys5.quanteec.com/contents/encodings/live/528309e0-caee-4b99-3933-3530-6d61-63-b69a-caa00a3177f6d/master.m3u8',
