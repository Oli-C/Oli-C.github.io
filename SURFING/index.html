  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const haystack = (c) => norm([c.name, c.town, c.area, c.zone, c.country, c.source, ...(c.tags || [])].join(' '));
  const matches = (c) => {
    const terms = norm(q.value.trim()).split(/\s+/).filter(Boolean);
    const hay = haystack(c);
    return (area === 'All' || c.area === area) && terms.every((t) => hay.includes(t));
  };
  const byId = (id) => CAMS.find((x) => x.id === id);
  const cards = () => [...grid.querySelectorAll('.cam')];
  // 'split' only exists on wide screens; narrower ones fall back to the grid.
  const effectiveView = () => (view === 'split' && !wide.matches ? 'grid' : view);

  // Scripts are fetched once, the first time they're needed.
  const loaded = {};
  const loadScript = (url) => loaded[url] || (loaded[url] = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = url;
    s.onload = resolve;
    s.onerror = () => { delete loaded[url]; reject(new Error('Failed to load ' + url)); };
    document.head.appendChild(s);
  }));

  // Bust snapshot caches once a minute so thumbnails stay roughly current
  // without hammering the cam hosts.
  const stamp = Math.floor(Date.now() / 60000);
  const thumbUrl = (u) => u + (u.includes('?') ? '&' : '?') + 't=' + stamp;

  /* ---------- Conditions + score ---------- */

  // Smallest angle between two bearings, 0–180.
  const angleDiff = (a, b) => Math.abs(((a - b + 540) % 360) - 180);
  // Compass windows are [from, to] clockwise and may wrap through north.
  const inWindow = (d, [a, b]) => (a <= b ? d >= a && d <= b : d >= a || d <= b);
  const distToWindow = (d, w) => (inWindow(d, w) ? 0 : Math.min(angleDiff(d, w[0]), angleDiff(d, w[1])));
  const COMPASS = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
  const dirName = (d) => COMPASS[Math.round((((d % 360) + 360) % 360) / 45) % 8];
  const windowText = ([a, b]) => (dirName(a) === dirName(b) ? dirName(a) : `${dirName(a)}–${dirName(b)}`);
  const fmt = (n) => (Number.isInteger(n) ? String(n) : n.toFixed(1));
  // Linear ramp: y0 at x0, y1 at x1, clamped outside.
  const lerp = (x, x0, y0, x1, y1) => y0 + (y1 - y0) * Math.min(1, Math.max(0, (x - x0) / (x1 - x0)));

  const tideWord = (tn) => (tn < 0.33 ? 'low' : tn < 0.66 ? 'mid' : 'high');
  // Wetsuit by water temperature — a rule of thumb, not gospel.
  const suit = (t) => (t >= 22 ? 'boardies' : t >= 19 ? '2 mm spring' : t >= 16 ? '3/2 mm' : t >= 13 ? '4/3 mm' : '5/4 mm + boots');

  // Wind direction is where it blows FROM. Offshore = inside the spot's
  // window (give or take 15°); onshore = roughly from the sea; the rest is
  // cross-shore, which is what a nortada does to the west-facing beaches.
  function windRel(c, k) {
    const off = distToWindow(k.wd, c.best.wind) <= 15;
    const on = !off && angleDiff(k.wd, c.faces) < 45;
    return off ? 'offshore' : on ? 'onshore' : 'cross-shore';
  }

  /* Score out of 10, judged against the spot's own `best` block.

     First the offshore swell is turned into what actually arrives at the
     beach: swell from inside the spot's window arrives whole; swell from
     further round the compass fades towards the spot's `exposure` floor
     (long-period swell wraps better, so it fades less), and any `gain`
     (Nazaré's canyon) is applied. Everything below works on that height.

     Three things add up to a raw 10:
       Size       4 pts  ramps up to full marks 40% of the way into the
                         spot's size range, holds to the top, then falls off
       Period     3 pts  ramps from 2 s under the spot's "gets good" period
                         to 5 s over it — long-period groundswell is what
                         separates good from epic
       Direction  3 pts  full marks inside the swell window, nothing 45° out

     Then multipliers, because these are what ruin an otherwise good day:
       Wind       ×1.0 glassy or light offshore … ×0.1 strong onshore,
                  less again if it's gusty
       Sea state  wind chop riding on the swell: ×1.0 clean groundswell
                  … ×0.5 when the chop is as big as the swell
       Tide       where today's tide sits (0 = low water, 1 = high) against
                  the range the spot likes: ×1.0 inside, ×0.85 just outside,
                  ×0.65 well outside; ×0.9 more if it's running the wrong way

     Caps: under 0.4 m is Flat (0); swell far outside the size range can't
     score above 3 (too big) or 4 (too small); after dark it's 0 ("Dark").
     Blind to the banks — a nudge to open the cam, not a forecast. */
  function score(c, k) {
    if (!k || k.h == null || k.ws == null) return null;
    const b = c.best, p = k.p || 0, P = b.period;
    const [lo, hi] = b.size;
    const f = [];

    // How much of the offshore swell reaches this beach: whole when it's
    // coming at the beach (within 45° of the way it faces), fading to the
    // spot's exposure floor once it has to bend 110° round a headland.
    const dd = k.d != null ? distToWindow(k.d, b.swell) : 0;
    const bend = k.d != null ? angleDiff(k.d, c.faces) : 0;
    const floor = b.exposure == null ? 0.85 : b.exposure;
    let arrive = lerp(bend, 45, 1, 110, floor);
    if (bend > 45 && p >= 12) arrive = Math.min(1, arrive * 1.15);   // long period wraps in
    arrive *= b.gain || 1;
    const h = k.h * arrive;
    const hNow = Math.abs(arrive - 1) < 0.05 ? `${h.toFixed(1)} m` : `${h.toFixed(1)} m at the beach (${k.h.toFixed(1)} m offshore)`;

    const sweet = lo + 0.4 * (hi - lo);
    const size = h <= sweet ? lerp(h, lo * 0.5, 0, sweet, 4) : h <= hi ? 4 : lerp(h, hi, 4, hi * 1.4, 0);
    f.push({ label: 'Size', pts: size, max: 4, now: hNow, likes: `${lo}–${hi} m` });

    const per = lerp(p, P - 2, 0, P + 5, 3);
    f.push({ label: 'Period', pts: per, max: 3, now: `${Math.round(p)} s`, likes: `${P} s and up` });

    // Angle still matters once the swell is in: straight into the window
    // lines up the banks; well outside it tends to bend in as closeouts.
    const dir = k.d != null ? lerp(dd, 0, 3, 60, 0) : 2;
    f.push({ label: 'Direction', pts: dir, max: 3, now: k.d != null ? `from ${dirName(k.d)}` : 'unknown', likes: windowText(b.swell) });

    const rel = windRel(c, k), ws = k.ws;
    let wind;
    if (ws < 8)             wind = 1;                                                   // glassy
    else if (rel === 'offshore') wind = ws < 20 ? 1 : ws < 30 ? 0.9 : ws < 40 ? 0.75 : 0.6;
    else if (rel === 'onshore')  wind = ws < 10 ? 0.6 : ws < 18 ? 0.4 : ws < 28 ? 0.2 : 0.1;
    else                         wind = ws < 12 ? 0.85 : ws < 20 ? 0.6 : ws < 30 ? 0.4 : 0.2;
    const gusty = k.wg != null && k.wg > 25 && k.wg > ws * 1.5;
    if (gusty) wind *= 0.85;
    f.push({ label: 'Wind', mult: wind, now: `${Math.round(ws)} km/h ${dirName(k.wd)}, ${rel}${gusty ? `, gusting ${Math.round(k.wg)}` : ''}`, likes: `${windowText(b.wind)} offshore` });

    // Chop is sampled offshore; an offshore wind grooms it out by the beach,
    // so it counts half as much then.
    let sea = 1;
    if (k.wwh != null && h > 0) {
      const r = (k.wwh / h) * (rel === 'offshore' ? 0.5 : 1);
      sea = r > 1 ? 0.5 : r > 0.6 ? 0.7 : r > 0.35 ? 0.85 : 1;
      f.push({ label: 'Sea state', mult: sea, now: `${k.wwh.toFixed(1)} m wind chop on ${h.toFixed(1)} m swell`, likes: 'clean groundswell' });
    }

    let tide = 1;
    if (k.tn != null && b.tide && b.tide.range) {
      const [tlo, thi] = b.tide.range;
      const out = k.tn < tlo ? tlo - k.tn : k.tn > thi ? k.tn - thi : 0;
      tide = out === 0 ? 1 : out <= 0.15 ? 0.85 : 0.65;
      if (b.tide.dir && k.tdir && b.tide.dir !== k.tdir) tide *= 0.9;
      f.push({ label: 'Tide', mult: tide, now: `${tideWord(k.tn)}${k.tdir ? ` and ${k.tdir}` : ''}`, likes: b.tide.text });
    }

    let total = (size + per + dir) * wind * sea * tide, cap = '', dark = false;
    if (k.day === 0) { total = 0; cap = 'After dark'; dark = true; }
    else if (h < 0.4) { total = 0; cap = 'Under 0.4 m, flat'; }
    else if (h > hi * 1.4) { total = Math.min(total, 3); cap = `Capped: ${h.toFixed(1)} m is too big for this spot`; }
    else if (h < lo * 0.7) { total = Math.min(total, 4); cap = `Capped: ${h.toFixed(1)} m is too small for this spot`; }
    total = Math.round(total * 2) / 2;
    const level = total === 0 ? 0 : total <= 3.5 ? 1 : total <= 6 ? 2 : total <= 8 ? 3 : 4;
    return { total, level, label: dark ? 'Dark' : LEVELS[level], wind: rel, factors: f, cap };
  }

  const scoreOf = (c) => score(c, conditions[c.id] && conditions[c.id].now);
  const badge = (c, lg) => {
    const r = scoreOf(c);
    return r
      ? `<span class="score lvl-${r.level}${lg ? ' lg' : ''}"><b>${fmt(r.total)}</b><small>${r.label}</small></span>`
      : `<span class="score lvl-x${lg ? ' lg' : ''}"><b>–</b><small>no data</small></span>`;
  };
  const condText = (c) => {
    const k = conditions[c.id] && conditions[c.id].now, r = scoreOf(c);
    if (!r) return '';
    return `<b>${k.h.toFixed(1)} m</b> · <b>${Math.round(k.p)} s</b> · <b>${Math.round(k.ws)} km/h</b> ${r.wind}`;
  };

  /* ---------- Today: four bars + a summary ---------- */

  const hourOf = (t) => parseInt(t.slice(11, 13), 10);
  const levelOf = (total) => (total === 0 ? 0 : total <= 3.5 ? 1 : total <= 6 ? 2 : total <= 8 ? 3 : 4);

  // Average score per block of the day, daylight hours only.
  function dayBars(c) {
    const hs = conditions[c.id] && conditions[c.id].hours;
    if (!hs || !hs.length) return null;
    const nowH = new Date().getHours();
    return BUCKETS.map((b) => {
      const rows = hs.filter((k) => k.day !== 0 && hourOf(k.t) >= b.from && hourOf(k.t) < b.to);
      const totals = rows.map((k) => score(c, k)).filter(Boolean).map((r) => r.total);
      const avg = totals.length ? Math.round((totals.reduce((a, x) => a + x, 0) / totals.length) * 2) / 2 : null;
      return { ...b, score: avg, level: avg == null ? null : levelOf(avg), past: nowH >= b.to, now: nowH >= b.from && nowH < b.to };
    });
  }

  const miniBars = (c) => {
    const bars = dayBars(c);
    if (!bars) return '';
    return `<span class="mini" aria-hidden="true" title="Today, dawn to evening">${bars.map((b) =>
      `<i class="${b.level == null ? 'lvl-x' : 'lvl-' + b.level}${b.past ? ' past' : ''}${b.now ? ' now' : ''}" style="height:${b.score == null ? 2 : Math.max(2, b.score * 10)}%"></i>`
    ).join('')}</span>`;
  };

  // A sentence or two on how the day goes: size trend, wind, best window.
  function daySummary(c) {
    const hs = conditions[c.id] && conditions[c.id].hours;
    if (!hs) return '';
    const day = hs.filter((k) => k.day !== 0 && hourOf(k.t) >= 6 && hourOf(k.t) < 19);
    if (day.length < 2) return 'No daylight hours left to call.';
    const first = day[0], last = day[day.length - 1];
    const dh = last.h - first.h;
    const sizeTxt = Math.abs(dh) < 0.25
      ? `Holding around ${((first.h + last.h) / 2).toFixed(1)} m at ${Math.round((first.p + last.p) / 2)} s`
      : dh > 0 ? `Building from ${first.h.toFixed(1)} m to ${last.h.toFixed(1)} m` : `Easing from ${first.h.toFixed(1)} m to ${last.h.toFixed(1)} m`;
    const rels = day.map((k) => windRel(c, k));
    const half = Math.floor(rels.length / 2);
    const mode = (arr) => arr.sort((a, b) => arr.filter((v) => v === a).length - arr.filter((v) => v === b).length).pop();
    const am = mode(rels.slice(0, half)), pm = mode(rels.slice(half));
    const speeds = day.map((k) => k.ws);
    const windTxt = am === pm
      ? `${am} wind all day, ${Math.round(Math.min(...speeds))}–${Math.round(Math.max(...speeds))} km/h`
      : `${am} early, turning ${pm} later and up to ${Math.round(Math.max(...speeds))} km/h`;
    const bars = (dayBars(c) || []).filter((b) => b.score != null);
    const best = bars.slice().sort((a, b) => b.score - a.score)[0];
    const bestTxt = best ? (best.past ? `Best was ${best.label.toLowerCase()} (${fmt(best.score)}).` : `Best window: ${best.label.toLowerCase()} (${fmt(best.score)}).`) : '';
    return `${sizeTxt}; ${windTxt}. ${bestTxt}`.trim();
  }

  /* ---------- Fetching ---------- */

  // Open-Meteo's marine model is coastal-coarse; a point on the sand can land
  // in a cell with no sea data, so sample ~6 km out in the direction the
  // beach faces.
  const offshore = (c) => {
    const rad = c.faces * Math.PI / 180;
    const lat = c.lat + 0.06 * Math.cos(rad);
    const lng = c.lng + 0.06 * Math.sin(rad) / Math.cos(c.lat * Math.PI / 180);
    return [lat.toFixed(4), lng.toFixed(4)];
  };

  const MARINE = ['swell_wave_height', 'swell_wave_period', 'swell_wave_direction', 'wave_height', 'wave_period', 'wave_direction', 'wind_wave_height', 'sea_level_height_msl', 'sea_surface_temperature'];
  const WIND = ['wind_speed_10m', 'wind_direction_10m', 'wind_gusts_10m', 'is_day', 'temperature_2m'];

  // Open-Meteo answers with an object for one location, an array for several.
  const asList = (r) => (Array.isArray(r) ? r : [r]);
  const row = (hourly, i) => Object.fromEntries(Object.keys(hourly).map((k) => [k, hourly[k][i]]));
  const toK = (m, w) => {
    const h = m.swell_wave_height ?? m.wave_height;
    if (h == null || w.wind_speed_10m == null) return null;
    return {
      h, p: m.swell_wave_period ?? m.wave_period, d: m.swell_wave_direction ?? m.wave_direction, wwh: m.wind_wave_height,
      ws: w.wind_speed_10m, wd: w.wind_direction_10m, wg: w.wind_gusts_10m, day: w.is_day == null ? 1 : w.is_day,
      tide: m.sea_level_height_msl, sst: m.sea_surface_temperature, air: w.temperature_2m,
    };
  };
  // Tide state from the day's sea-level curve: tn is 0 at today's low water
  // and 1 at high; tdir is which way it's running right now.
  function addTide(hours, k, idx) {
    const levels = hours.map((x) => x.tide).filter((v) => v != null);
    if (levels.length < 3 || k.tide == null) return;
    const min = Math.min(...levels), max = Math.max(...levels);
    if (max - min < 0.2) return;
    k.tn = Math.min(1, Math.max(0, (k.tide - min) / (max - min)));
    const prev = hours[Math.max(0, idx - 1)], next = hours[Math.min(hours.length - 1, idx + 1)];
    if (prev && next && prev.tide != null && next.tide != null) k.tdir = next.tide > prev.tide ? 'rising' : 'falling';
  }
  // Today's highs and lows from the hourly curve, refined by fitting a
  // parabola through each peak so the time is good to ~10 minutes.
  function tideEvents(hours) {
    const out = [];
    for (let i = 1; i < hours.length - 1; i++) {
      const a = hours[i - 1].tide, b = hours[i].tide, c = hours[i + 1].tide;
      if (a == null || b == null || c == null) continue;
      const high = b > a && b >= c, low = b < a && b <= c;
      if (!high && !low) continue;
      const den = a - 2 * b + c;
      const off = den ? 0.5 * (a - c) / den : 0; // vertex offset in hours, -0.5…0.5
      // Hourly values stand for the whole hour, so their centre is at :30.
      // Checked against the Cascais tide table: lands within ~5 minutes.
      const mins = Math.round((hourOf(hours[i].t) + 0.5 + off) * 60);
      const hh = Math.floor(mins / 60), mm = mins % 60;
      out.push({ kind: high ? 'High' : 'Low', mins, t: `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}` });
    }
    return out;
  }
  // "High 14:51 · Low 21:10": what's still to come today, or the whole day once it's over.
  function tideTimes(cnd) {
    if (!cnd || !cnd.tides || !cnd.tides.length) return '';
    const nowMins = new Date().getHours() * 60 + new Date().getMinutes();
    const ahead = cnd.tides.filter((e) => e.mins >= nowMins);
    return (ahead.length ? ahead : cnd.tides).map((e) => `${e.kind} ${e.t}`).join(' · ');
  }
  // Prefer `current`; fall back to the hourly row nearest to now.
  function pick(loc) {
    if (!loc) return null;
    if (loc.current) return { ...loc.current };
    if (!loc.hourly || !loc.hourly.time) return null;
    const now = Date.now();
    let best = 0, bestD = Infinity;
    loc.hourly.time.forEach((t, i) => { const d = Math.abs(new Date(t) - now); if (d < bestD) { bestD = d; best = i; } });
    return row(loc.hourly, best);
  }

  async function loadConditions() {
    const ids = CAMS.map((c) => c.id).join();
    const today = new Date().toDateString();
    try {
      const cached = JSON.parse(localStorage.getItem('surf-cond') || 'null');
      if (cached && cached.v === COND_VER && cached.ids === ids && cached.day === today && Date.now() - cached.t < COND_TTL) {
        conditions = cached.data;
        condNote = cached.note;
        return;
      }
    } catch {}

    const pts = CAMS.map(offshore);
    const lat = pts.map((p) => p[0]).join(','), lng = pts.map((p) => p[1]).join(',');
    const marineUrl = `https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lng}&current=${MARINE.join()}&hourly=${MARINE.join()}&forecast_days=1&timezone=auto`;
    const windUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=${WIND.join()}&hourly=${WIND.join()}&daily=sunrise,sunset&forecast_days=1&timezone=auto`;

    try {
      const [marine, wind] = await Promise.all([
        fetch(marineUrl).then((r) => r.json()),
        fetch(windUrl).then((r) => r.json()),
      ]);
      if (marine.error || wind.error) throw new Error(marine.reason || wind.reason);
      const M = asList(marine), W = asList(wind);
      const next = {};
      let when = '';
      CAMS.forEach((c, i) => {
        const m = M[i], w = W[i];
        if (!m || !w) return;
        const cur = pick(m), curW = pick(w);
        const now = cur && curW ? toK(cur, curW) : null;
        if (!now) return;
        const hours = [];
        const n = Math.min(m.hourly && m.hourly.time ? m.hourly.time.length : 0, w.hourly && w.hourly.time ? w.hourly.time.length : 0);
        for (let j = 0; j < n; j++) {
          const k = toK(row(m.hourly, j), row(w.hourly, j));
          if (k) hours.push({ t: m.hourly.time[j], ...k });
        }
        hours.forEach((k, j) => addTide(hours, k, j));
        // "Now" sits between two hourly rows; use the nearer one for tide direction.
        const nowMs = new Date(cur.time || Date.now()).getTime();
        let near = 0, nearD = Infinity;
        hours.forEach((k, j) => { const d = Math.abs(new Date(k.t) - nowMs); if (d < nearD) { nearD = d; near = j; } });
        addTide(hours, now, near);
        const sun = w.daily && w.daily.sunrise ? { rise: (w.daily.sunrise[0] || '').slice(11, 16), set: (w.daily.sunset[0] || '').slice(11, 16) } : null;
        next[c.id] = { now, hours, sun, tides: tideEvents(hours), t: cur.time };
        when = when || (cur.time || '').slice(11, 16);
      });
      conditions = next;
      condNote = when ? `Scores from Open-Meteo swell, wind and tide at ${when} local, judged against each spot’s usual best.` : 'Conditions unavailable right now';
      try { localStorage.setItem('surf-cond', JSON.stringify({ v: COND_VER, ids, day: today, t: Date.now(), data: conditions, note: condNote })); } catch {}
    } catch (e) {
      conditions = {};
      condNote = 'Conditions unavailable right now';
    }
  }

  /* ---------- Directions: one button, then choose the app ---------- */

  const PIN_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-5.3-6-10a6 6 0 0 1 12 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg>';
  const goButton = (c) => `<button class="nav" type="button" data-go="${esc(c.id)}">${PIN_SVG}Directions</button>`;

  function openGo(c) {
    const ll = `${c.lat},${c.lng}`;
    clearTimeout(goTimer);
    $('go-sub').textContent = `${c.name} · ${c.town}`;
    $('go-list').innerHTML = [
      ['Google Maps', `https://www.google.com/maps/dir/?api=1&destination=${ll}`, '#4285f4'],
      ['Apple Maps', `https://maps.apple.com/?daddr=${ll}&dirflg=d`, '#8e8e93'],
      ['Waze', `https://waze.com/ul?ll=${ll}&navigate=yes`, '#33ccff'],
    ].map(([name, url, dot]) =>
      `<a class="go-opt" href="${url}" target="_blank" rel="noopener noreferrer"><i style="background:${dot}"></i>${name}<small>Open</small></a>`
    ).join('');
    go.hidden = false;
    requestAnimationFrame(() => go.classList.add('open'));
    $('go-list').querySelector('a').focus();
  }
  function closeGo() {
    if (go.hidden) return;
    go.classList.remove('open');
    goTimer = setTimeout(() => { go.hidden = true; }, 200);
  }

  /* ---------- Grid, grouped by area ---------- */

  // Home areas first; anything else follows in the order it appears in CAMS.
  const AREA_ORDER = ['Cascais', 'Caparica'];
  const AREAS = [...new Set(CAMS.map((c) => c.area))]
    .sort((a, b) => (AREA_ORDER.includes(a) ? AREA_ORDER.indexOf(a) : 99) - (AREA_ORDER.includes(b) ? AREA_ORDER.indexOf(b) : 99));

  function renderChips() {
    chips.innerHTML = ['All', ...AREAS].map((r) =>
      `<button class="chip" type="button" data-area="${esc(r)}" aria-pressed="${r === area}">${esc(r)}</button>`
    ).join('');
  }

  // The tile is the preview; name, place and conditions overlay the bottom.
  const cardHtml = (c) => `
    <button class="cam" type="button" data-id="${esc(c.id)}" aria-label="Watch ${esc(c.name)}, ${esc(c.town)}">
      ${c.thumb ? `<img src="${esc(thumbUrl(c.thumb))}" alt="" loading="lazy" decoding="async" onload="this.classList.add('ready')" onerror="this.remove()">` : ''}
      ${c.type === 'hls' ? `<video muted playsinline preload="none"${c.poster ? ` poster="${esc(c.poster)}"` : ''} aria-hidden="true"></video>` : ''}
      <span class="live"><i></i>Live</span>
      <span class="score-slot">${badge(c)}</span>
      <div class="overlay">
        <div class="name">${esc(c.name)}</div>
        <div class="sub">
          <span class="where">${esc(c.zone && c.zone !== c.town ? `${c.zone} · ${c.town}` : c.town)}</span>
          <span class="cond-line">${condText(c)}</span>
          <span class="mini-slot">${miniBars(c)}</span>
        </div>
      </div>
    </button>`;

  // Built once; conditions are patched in later so the tiles keep streaming.
  function renderGrid() {
    grid.innerHTML = AREAS.map((a) => {
      const list = CAMS.filter((c) => c.area === a);
      return `
      <section class="area" data-area="${esc(a)}">
        <div class="area-head">
          <h2>${esc(a)}<small>${list.length} cam${list.length === 1 ? '' : 's'}</small></h2>
          <div class="area-sum"></div>
        </div>
        <div class="cards">${list.map(cardHtml).join('')}</div>
      </section>`;
    }).join('');
  }

  function patchConditions() {
    for (const el of cards()) {
      const c = byId(el.dataset.id);
      el.querySelector('.score-slot').innerHTML = badge(c);
      el.querySelector('.cond-line').innerHTML = condText(c);
      el.querySelector('.mini-slot').innerHTML = miniBars(c);
    }
    for (const sec of grid.querySelectorAll('.area')) {
      const best = CAMS.filter((c) => c.area === sec.dataset.area)
        .map((c) => ({ c, r: scoreOf(c) })).filter((x) => x.r)
        .sort((x, y) => y.r.total - x.r.total)[0];
      // Tide times are the same along an area's coast, so one cam's will do.
      const withTide = CAMS.find((c) => c.area === sec.dataset.area && tideTimes(conditions[c.id]));
      const tide = withTide ? tideTimes(conditions[withTide.id]) : '';
      sec.querySelector('.area-sum').innerHTML =
        (tide ? `<span class="tide-sum">${esc(tide)}</span>` : '') +
        (best ? `<span>Best now: <b>${esc(best.c.name)}</b> · ${fmt(best.r.total)}/10</span>` : '');
    }
    // One coast-wide tide line in the header (times differ by minutes at most).
    const tideCam = CAMS.find((c) => conditions[c.id] && conditions[c.id].tides && conditions[c.id].tides.length);
    const tideEl = $('tide-now');
    if (tideCam) {
      const cnd = conditions[tideCam.id];
      const nowMins = new Date().getHours() * 60 + new Date().getMinutes();
      const ahead = cnd.tides.filter((e) => e.mins >= nowMins);
      const list = ahead.length ? ahead : cnd.tides;
      tideEl.hidden = false;
      tideEl.innerHTML = `<span class="k">${ahead.length ? 'Tide' : 'Tide today'}</span>` + list.map((e) => `<span>${e.kind} ${e.t}</span>`).join('');
    } else {
      tideEl.hidden = true;
    }
    const top = CAMS.map((c) => ({ c, r: scoreOf(c) })).filter((x) => x.r && x.r.total > 0)
      .sort((x, y) => y.r.total - x.r.total).slice(0, 3);
    const bestEl = $('best');
    bestEl.hidden = !top.length;
    bestEl.innerHTML = top.length
      ? `<span class="best-label">Best right now</span>` + top.map(({ c }) =>
          `<button class="best-chip" type="button" data-open="${esc(c.id)}">${badge(c)}<span>${esc(c.name)}</span></button>`).join('')
      : '';
  }

  function applyFilter() {
    let shown = 0;
    for (const sec of grid.querySelectorAll('.area')) {
      let n = 0;
      for (const el of sec.querySelectorAll('.cam')) {
        const ok = matches(byId(el.dataset.id));
        el.hidden = !ok;
        if (ok) n++;
      }
      sec.hidden = n === 0;
      shown += n;
    }
    empty.classList.toggle('show', shown === 0 && effectiveView() !== 'map');
    if (map) syncMarkers(true);
    syncTiles();
  }

  /* ---------- Live tiles ---------- */

  // Every HLS card streams while it's on screen (muted, lowest rendition).
  // Off-screen, hidden-tab, data-saver and over-budget tiles fall back to
  // their snapshot.
  function startTile(c) {
    const t = tiles[c.id];
    if (!t || t.active || t.dead) return;
    const video = t.video;
    t.active = true;
    video.muted = true;
    const card = video.closest('.cam');
    const onPlaying = () => { video.classList.add('ready'); card.classList.add('streaming'); };
    video.addEventListener('playing', onPlaying);
    t.cleanup = () => video.removeEventListener('playing', onPlaying);
    const fail = () => { stopTile(c.id); t.dead = true; };

    if (nativeHls) {
      video.addEventListener('error', fail, { once: true });
      video.src = c.embed;
      video.play().catch(() => {});
      return;
    }
    if (!window.Hls || !Hls.isSupported()) { t.active = false; return; }
    t.hls = new Hls(TILE_HLS);
    t.hls.on(Hls.Events.ERROR, (_, data) => {
      if (!data.fatal) return;
      if (data.type === Hls.ErrorTypes.MEDIA_ERROR && t.hls) return t.hls.recoverMediaError();
      fail();
    });
    t.hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
    t.hls.loadSource(c.embed);
    t.hls.attachMedia(video);
  }

  function stopTile(id) {
    const t = tiles[id];
    if (!t || !t.active) return;
    if (t.hls) { try { t.hls.destroy(); } catch {} t.hls = null; }
    if (t.cleanup) { t.cleanup(); t.cleanup = null; }
    t.video.pause();
    t.video.removeAttribute('src');
    t.video.load();
    t.video.classList.remove('ready');
    t.video.closest('.cam').classList.remove('streaming');
    t.active = false;
  }

  // Reconcile every tile with what should be playing right now.
  function syncTiles() {
    let budget = MAX_TILES;
    const listShown = effectiveView() !== 'map';
    for (const c of CAMS) {
      const t = tiles[c.id];
      if (!t) continue;
      const want = !dataSaver && listShown && t.visible && !t.hold && !document.hidden && matches(c) && budget > 0;
      if (want) { budget--; startTile(c); } else stopTile(c.id);
    }
  }

  function setupTiles() {
    const io = new IntersectionObserver((entries) => {
      for (const e of entries) {
        const t = tiles[e.target.dataset.id];
        if (t) t.visible = e.isIntersecting;
      }
      syncTiles();
    }, { rootMargin: '200px 0px' });
    for (const el of cards()) {
      const video = el.querySelector('video');
      if (!video) continue;
      tiles[el.dataset.id] = { video, hls: null, visible: false, active: false, hold: false, dead: false };
      io.observe(el);
    }
    document.addEventListener('visibilitychange', syncTiles);
  }

  /* ---------- Map ---------- */

  const pinIcon = (c) => {
    const r = scoreOf(c);
    return L.divIcon({
      className: 'pin-wrap',
      html: `<span class="pin ${r ? 'lvl-' + r.level : 'lvl-x'}">${r ? fmt(r.total) : '·'}</span>`,
      iconSize: [30, 30],
      iconAnchor: [15, 15],
      popupAnchor: [0, -16],
      tooltipAnchor: [0, -16],
    });
  };

  const popupHtml = (c) => {
    const cond = condText(c);
    const sum = daySummary(c);
    return `
      <div class="pop-head">
        <div>
          <div class="pop-name">${esc(c.name)}</div>
          <div class="pop-where">${esc(c.zone || c.town)} · ${esc(c.area)}</div>
        </div>
        ${badge(c)}
      </div>
      ${cond ? `<div class="pop-cond">Now ${cond} ${miniBars(c)}</div>` : ''}
      ${tideTimes(conditions[c.id]) ? `<div class="pop-sum">Tide: ${esc(tideTimes(conditions[c.id]))}</div>` : ''}
      ${sum ? `<div class="pop-sum">${esc(sum)}</div>` : ''}
      <div class="pop-actions">
        <button class="pop-btn" type="button" data-open="${esc(c.id)}">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>Watch live
        </button>
        ${goButton(c)}
      </div>`;
  };

  // Pin ↔ card: hovering a card lifts its pin; tapping a pin finds its card.
  function hotPin(id, on) {
    const el = markers[id] && markers[id].getElement && markers[id].getElement();
    if (el) el.classList.toggle('hot', on);
  }
  function findCard(id) {
    if (effectiveView() !== 'split') return;
    const el = grid.querySelector(`.cam[data-id="${CSS.escape(id)}"]`);
    if (!el || el.hidden) return;
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 1600);
  }

  function initMap() {
    map = L.map('map', { zoomControl: true, scrollWheelZoom: true });
    // Plain OpenStreetMap streets by default — clean and keyless. Satellite
    // (Esri imagery) is there as an option for reading the actual beach.
    const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19,
      className: 'osm-tiles',
    });
    const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Imagery &copy; <a href="https://www.esri.com/">Esri</a>, Maxar, Earthstar Geographics, GIS User Community',
      maxZoom: 19,
    });
    let base = 'osm';
    try { base = localStorage.getItem('surf-base') || 'osm'; } catch {}
    (base === 'sat' ? sat : osm).addTo(map);
    L.control.layers({ 'Streets': osm, 'Satellite': sat }, null, { position: 'topright', collapsed: false }).addTo(map);
    map.on('baselayerchange', (e) => { try { localStorage.setItem('surf-base', e.layer === sat ? 'sat' : 'osm'); } catch {} });

    for (const c of CAMS) {
      markers[c.id] = L.marker([c.lat, c.lng], { icon: pinIcon(c), title: c.name, keyboard: true })
        .bindTooltip(c.name, { direction: 'top' })
        .bindPopup(() => popupHtml(c), { closeButton: false, maxWidth: 340 })
        .on('click', () => findCard(c.id));
    }
    map.getContainer().addEventListener('click', (e) => {
      const b = e.target.closest('[data-open]');
      if (b) { map.closePopup(); open(b.dataset.open); }
    });
    syncMarkers(true);
  }

  // Show only the markers that pass the current filter; optionally refit.
  function syncMarkers(fit) {
    const shown = [];
    for (const c of CAMS) {
      const m = markers[c.id];
      if (matches(c)) { if (!map.hasLayer(m)) m.addTo(map); shown.push([c.lat, c.lng]); }
      else if (map.hasLayer(m)) map.removeLayer(m);
    }
    if (fit && shown.length) {
      if (shown.length === 1) map.setView(shown[0], 14);
      else map.fitBounds(shown, { padding: [40, 40], maxZoom: 14 });
    }
  }

  function refreshPins() {
    if (!map) return;
    for (const c of CAMS) markers[c.id].setIcon(pinIcon(c));
  }

  async function showMap() {
    try {
      await loadScript(LIBS.leaflet);
    } catch {
      $('map-hint').textContent = 'Couldn’t load the map.';
      return;
    }
    if (!map) initMap();
    // The pane has just been shown or resized; let layout settle first.
    requestAnimationFrame(() => { map.invalidateSize(); syncMarkers(true); });
  }

  function setView(v) {
    view = v;
    const ev = effectiveView();
    layout.dataset.view = ev;
    for (const b of document.querySelectorAll('.seg button')) b.setAttribute('aria-pressed', b.dataset.view === view);
    try { localStorage.setItem('surf-view', v); } catch {}
    applyFilter();
    if (ev !== 'grid') showMap();
  }

  /* ---------- Viewer ---------- */

  function frameMsg(text) {
    frame.insertAdjacentHTML('beforeend', `<div class="frame-msg">${esc(text)}</div>`);
  }

  const iframeHtml = (url, c) =>
    `<iframe src="${esc(url)}" title="${esc(c.name)} live webcam" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;

  function stopPlayback() {
    if (hls) { try { hls.destroy(); } catch {} hls = null; }
    if (player) { try { player.destroy(); } catch {} player = null; }
    frame.innerHTML = '';
  }

  // A dead or blocked stream falls back to the cam's page when it has one.
  function streamFailed(c, text) {
    stopPlayback();
    if (!c.fallback) { frame.className = 'frame video'; return frameMsg(text); }
    frame.className = 'frame page';
    frame.innerHTML = iframeHtml(c.fallback, c);
  }

  async function playHls(c) {
    const video = document.createElement('video');
    video.muted = true;
    video.autoplay = true;
    video.playsInline = true;
    video.setAttribute('playsinline', '');
    if (c.poster) video.poster = c.poster;
    video.setAttribute('aria-label', `${c.name} live webcam`);
    frame.appendChild(video);
    const gone = () => !frame.contains(video); // viewer closed while a lib loaded

    try {
      const libs = [loadScript(LIBS.plyr)];
      if (!nativeHls) libs.push(loadScript(LIBS.hls));
      await Promise.all(libs);
      if (gone()) return;

      if (nativeHls) {
        video.src = c.embed;
        video.addEventListener('error', () => streamFailed(c, 'Stream unavailable right now.'), { once: true });
      } else {
        if (!window.Hls.isSupported()) return streamFailed(c, 'This browser can’t play live streams.');
        hls = new Hls({ liveDurationInfinity: true, enableWorker: true });
        hls.on(Hls.Events.ERROR, (_, data) => {
          if (!data.fatal) return;
          if (data.type === Hls.ErrorTypes.MEDIA_ERROR) return hls.recoverMediaError();
          streamFailed(c, 'Stream unavailable right now.');
        });
        hls.loadSource(c.embed);
        hls.attachMedia(video);
      }

      player = new Plyr(video, {
        // Cams have no audio, so no mute / volume controls to confuse things.
        controls: ['play-large', 'play', 'pip', 'airplay', 'fullscreen'],
        autoplay: true,
        muted: true,
        clickToPlay: true,
        hideControls: true,
        ratio: '16:9',
        storage: { enabled: false },
        fullscreen: { enabled: true, fallback: true, iosNative: true },
      });
    } catch {
      if (!gone()) streamFailed(c, 'Couldn’t load the video player.');
    }
  }

  function renderScore(c) {
    const r = scoreOf(c);
    const el = $('v-score');
    if (!r) { el.hidden = true; el.innerHTML = ''; return; }
    el.hidden = false;
    el.innerHTML = `
      <div class="score-total">
        <span class="k">Score now</span>
        ${badge(c, true)}
        ${r.cap ? `<span class="score-cap">${esc(r.cap)}</span>` : ''}
      </div>
      <div class="factors">
        ${r.factors.map((f) => {
          const share = f.mult != null ? f.mult : f.pts / f.max;
          const pts = f.mult != null ? `×${f.mult.toFixed(2).replace(/0$/, '')}` : `${fmt(Math.round(f.pts * 2) / 2)}/${f.max}`;
          return `
          <div class="factor lvl-${r.level}">
            <span class="k">${f.label}</span>
            <span class="f-bar"><i style="width:${share * 100}%"></i></span>
            <span class="f-pts">${pts}</span>
            <span class="f-detail"><b>${esc(f.now)}</b> · likes ${esc(f.likes)}</span>
          </div>`; }).join('')}
      </div>`;
  }

  function renderNow(c) {
    const cnd = conditions[c.id], k = cnd && cnd.now;
    const el = $('v-now');
    if (!k) { el.hidden = true; el.innerHTML = ''; return; }
    const stat = (kk, v, s) => `<div><span class="k">${kk}</span><span class="v">${v}${s ? ` <small>${s}</small>` : ''}</span></div>`;
    const items = [];
    if (k.sst != null) items.push(stat('Water', `${Math.round(k.sst)}°C`, suit(k.sst)));
    if (k.air != null) items.push(stat('Air', `${Math.round(k.air)}°C`));
    if (k.tn != null) items.push(stat('Tide', `${tideWord(k.tn)}${k.tdir ? ', ' + k.tdir : ''}`, tideTimes(cnd)));
    if (cnd.sun && cnd.sun.rise) items.push(stat('Light', `${cnd.sun.rise}–${cnd.sun.set}`, 'sunrise to sunset'));
    if (k.wg != null) items.push(stat('Gusts', `${Math.round(k.wg)} km/h`));
    el.hidden = !items.length;
    el.innerHTML = `<span class="k">Right now</span><div class="now-row">${items.join('')}</div>`;
  }

  function renderToday(c) {
    const bars = dayBars(c);
    const el = $('v-today');
    if (!bars) { el.hidden = true; el.innerHTML = ''; return; }
    el.hidden = false;
    el.innerHTML = `
      <div class="today-head"><span class="k">Today</span>${goButton(c)}</div>
      <div class="today-bars">
        ${bars.map((b) => `
          <div class="tbar ${b.level == null ? 'lvl-x' : 'lvl-' + b.level}${b.past ? ' past' : ''}${b.now ? ' now' : ''}" title="${b.from}:00–${b.to}:00">
            <b>${b.score == null ? '–' : fmt(b.score)}</b>
            <span class="col"><i style="height:${b.score == null ? 3 : Math.max(4, b.score * 10)}%"></i></span>
            <span>${b.label}</span>
          </div>`).join('')}
      </div>
      <p class="today-sum">${esc(daySummary(c))}</p>`;
  }

  function renderLocal(c) {
    const b = c.best;
    const item = (k, v) => `<span>${k} <b>${v}</b></span>`;
    $('v-local').innerHTML = `
      <div class="today-head"><span class="k">Local knowledge</span>${conditions[c.id] ? '' : goButton(c)}</div>
      <div class="local-row">
        ${item('Swell', windowText(b.swell))}
        ${item('Size', `${b.size[0]}–${b.size[1]} m`)}
        ${item('Period', `${b.period} s+`)}
        ${item('Wind', windowText(b.wind))}
        ${item('Tide', esc(b.tide.text))}
      </div>
      <p class="local-notes">${esc(b.notes)}</p>
      <div class="tags">${(c.tags || []).map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</div>`;
  }

  function open(id, push = true) {
    const c = byId(id);
    if (!c) return;
    lastFocus = document.activeElement;
    $('v-name').textContent = c.name;
    $('v-where').textContent = `${c.zone && c.zone !== c.town ? c.zone + ' · ' : ''}${c.town} · ${c.area}`;
    $('v-open').href = c.link;
    $('v-foot').innerHTML = `Stream by ${esc(c.source)} · <a href="${esc(c.link)}" target="_blank" rel="noopener noreferrer">open original</a>`;
    renderScore(c);
    renderNow(c);
    renderToday(c);
    renderLocal(c);
    clearTimeout(hideTimer);
    stopPlayback();
    // Don't stream the same cam twice: the tile rests while the viewer plays.
    for (const t of Object.values(tiles)) t.hold = false;
    if (tiles[c.id]) tiles[c.id].hold = true;
    syncTiles();
    frame.className = 'frame ' + (c.type === 'page' ? 'page' : 'video');
    if (c.type === 'hls') playHls(c);
    else frame.innerHTML = iframeHtml(c.embed, c);
    viewer.hidden = false;
    viewer.querySelector('.sheet').scrollTop = 0;
    requestAnimationFrame(() => viewer.classList.add('open'));
    document.body.classList.add('locked');
    $('v-close').focus();
    if (push) history.pushState(null, '', '#' + c.id);
  }

  function close(push = true) {
    if (viewer.hidden) return;
    viewer.classList.remove('open');
    document.body.classList.remove('locked');
    stopPlayback();
    for (const t of Object.values(tiles)) t.hold = false;
    syncTiles();
    hideTimer = setTimeout(() => { viewer.hidden = true; }, 250);
    if (push && location.hash) history.pushState(null, '', location.pathname + location.search);
    if (lastFocus) lastFocus.focus();
  }

  /* ---------- Wiring ---------- */

  grid.addEventListener('click', (e) => {
    const card = e.target.closest('.cam');
    if (card) open(card.dataset.id);
  });
  grid.addEventListener('mouseover', (e) => { const card = e.target.closest('.cam'); if (card) hotPin(card.dataset.id, true); });
  grid.addEventListener('mouseout',  (e) => { const card = e.target.closest('.cam'); if (card) hotPin(card.dataset.id, false); });
  $('best').addEventListener('click', (e) => {
    const b = e.target.closest('[data-open]');
    if (b) open(b.dataset.open);
  });
  // Any Directions button, anywhere (viewer panels, map popups).
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-go]');
    if (b) { e.preventDefault(); openGo(byId(b.dataset.go)); }
  });
  go.addEventListener('click', (e) => { if (e.target === go || e.target.closest('.go-opt') || e.target.closest('#go-cancel')) closeGo(); });
  chips.addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    area = chip.dataset.area;
    for (const b of chips.children) b.setAttribute('aria-pressed', b === chip);
    applyFilter();
  });
  q.addEventListener('input', applyFilter);
  document.querySelector('.seg').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-view]');
    if (b) setView(b.dataset.view);
  });
  wide.addEventListener('change', () => setView(view));
  const saver = $('saver');
  function setSaver(on) {
    dataSaver = on;
    saver.setAttribute('aria-checked', on);
    try { localStorage.setItem('surf-saver', on ? '1' : '0'); } catch {}
    syncTiles();
  }
  saver.addEventListener('click', () => setSaver(!dataSaver));
  saver.setAttribute('aria-checked', dataSaver);
  $('v-close').addEventListener('click', () => close());
  viewer.addEventListener('click', (e) => { if (e.target === viewer) close(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if (!go.hidden) closeGo(); else close(); }
    else if (e.key === '/' && document.activeElement !== q && viewer.hidden) { e.preventDefault(); q.focus(); }
  });
  window.addEventListener('popstate', () => {
    const id = location.hash.slice(1);
    id ? open(id, false) : close(false);
  });

  // The sticky map sits just under the sticky controls, whatever their height.
  const controls = $('controls');
  new ResizeObserver(() => {
    document.documentElement.style.setProperty('--controls-h', controls.offsetHeight + 'px');
    if (map) map.invalidateSize();
  }).observe(controls);

  renderChips();
  renderGrid();
  let savedView = '';
  try { savedView = localStorage.getItem('surf-view') || ''; } catch {}
  setView(['grid', 'split', 'map'].includes(savedView) ? savedView : (wide.matches ? 'split' : 'grid'));
  if (location.hash) open(location.hash.slice(1), false);

  // Tiles start streaming as soon as hls.js is in (Safari needs nothing).
  (nativeHls ? Promise.resolve() : loadScript(LIBS.hls)).then(setupTiles, setupTiles);

  // Conditions arrive after first paint; patch what depends on them.
  loadConditions().then(() => {
    patchConditions();
    refreshPins();
    if (!viewer.hidden && location.hash) {
      const c = byId(location.hash.slice(1));
      if (c) { renderScore(c); renderNow(c); renderToday(c); renderLocal(c); }
    }
  });
</script>
</body>
</html>
