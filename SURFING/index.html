<!DOCTYPE html>
<html lang="en" data-theme="charcoal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>allfield · surf cams</title>
<meta name="description" content="Live surf webcams, scored out of 10 against what each spot likes.">
<link rel="icon" type="image/jpeg" href="../assets/favicon.jpg">
<meta name="theme-color" content="#101820">
<link rel="preload" href="../assets/fonts/anek-kannada-latin.woff2" as="font" type="font/woff2" crossorigin>
<script>
  // Stamp the theme before first paint, same as the home page, so light-mode
  // visitors don't see the charcoal ground flash.
  document.documentElement.setAttribute('data-theme',
    matchMedia('(prefers-color-scheme: dark)').matches ? 'charcoal' : 'light');
</script>
<!-- Player + map styles. hls.js loads at once (the tiles need it); Plyr and
     Leaflet are fetched the first time a cam is opened or the map is shown. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  /* Anek Kannada, self-hosted — latin + latin-ext only, shared with the home page. */
  @font-face {
    font-family: 'Anek Kannada';
    font-style: normal;
    font-weight: 400 700;
    font-stretch: 125%;
    font-display: swap;
    src: url('../assets/fonts/anek-kannada-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: 'Anek Kannada';
    font-style: normal;
    font-weight: 400 700;
    font-stretch: 125%;
    font-display: swap;
    src: url('../assets/fonts/anek-kannada-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Palette mirrors style.css — "low light" Pantone scheme. */
  :root {
    --accent:  #ff8200;
    --sea:     #15616d;
    --live:    #e5484d;
    /* Score colours: flat-or-dark / poor / fair / good / epic */
    --lvl-0:   #5c6166;
    --lvl-1:   #8b2f45;
    --lvl-2:   #e3a23a;
    --lvl-3:   #9eb05c;
    --lvl-4:   #ff8200;
    --radius-sm: 4px;
    --radius:    10px;
    --radius-lg: 14px;
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    --controls-h: 150px; /* measured at runtime */
  }
  [data-theme="charcoal"] {
    --bg:       #101820;
    --bg-2:     #373a36;
    --bg-3:     #1a232c;
    --fg:       #d6d2c4;
    --fg-muted: #968c83;
    --accent-ink: var(--accent);
    --border:   rgba(214, 210, 196, 0.12);
    --border-2: rgba(214, 210, 196, 0.22);
    --border-3: rgba(214, 210, 196, 0.38);
    --shade:    rgba(5, 9, 13, 0.82);
  }
  [data-theme="light"] {
    --accent:   #ff6900;
    --lvl-4:    #ff6900;
    --bg:       #d7d2cb;
    --bg-2:     #bfb8af;
    --bg-3:     #eae6e0;
    --fg:       #101820;
    --fg-muted: #6e6259;
    --accent-ink: color-mix(in srgb, var(--accent) 58%, var(--fg));
    --border:   rgba(16, 24, 32, 0.12);
    --border-2: rgba(16, 24, 32, 0.22);
    --border-3: rgba(16, 24, 32, 0.40);
    --shade:    rgba(16, 24, 32, 0.72);
  }

  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Anek Kannada', system-ui, sans-serif;
    font-stretch: 125%;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    letter-spacing: -0.005em;
  }
  body.locked { overflow: hidden; }

  .page {
    max-width: 1800px;
    margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 64px max(16px, env(safe-area-inset-left));
  }

  /* ---------- Header ---------- */
  .top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }
  .back {
    color: var(--fg-muted);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 0.04em;
  }
  .back:hover, .back:focus-visible { color: var(--accent-ink); }
  h1 {
    font-size: clamp(34px, 7vw, 52px);
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.03em;
  }
  h1 span { color: var(--accent-ink); }
  .lede {
    color: var(--fg-muted);
    font-size: 15px;
    margin-top: 6px;
  }

  /* "Best right now" — the three top-scoring cams, one tap away. */
  .best {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 14px;
  }
  .best[hidden] { display: none; }
  .best-label {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-muted);
    margin-right: 4px;
  }
  .best-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font: inherit;
    font-size: 14px;
    color: var(--fg);
    background: var(--bg-3);
    border: 1px solid var(--border-2);
    border-radius: 999px;
    padding: 4px 12px 4px 4px;
    cursor: pointer;
    transition: border-color .2s var(--ease), transform .2s var(--ease);
  }
  .best-chip:hover, .best-chip:focus-visible { border-color: var(--accent); transform: translateY(-1px); outline: none; }
  /* Today's tide, coast-wide, right by the title. */
  .tide-now {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 14px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .tide-now[hidden] { display: none; }
  .tide-now .k { font-weight: 400; }
  .tide-now span + span::before { content: "·"; color: var(--fg-muted); margin-right: 10px; font-weight: 400; }
  .tide-now .k + span::before { content: none; }
  /* Wide: title left, tide + best-right-now fill the right of the header. */
  @media (min-width: 1100px) {
    .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
    .aside { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
    .tide-now { margin-top: 0; justify-content: flex-end; }
    .best { margin-top: 0; justify-content: flex-end; }
  }

  /* ---------- Search + filters (sticky) ---------- */
  /* Compact: two short rows on phones, one row on wide screens. */
  .controls {
    position: sticky;
    top: 0;
    z-index: 5;
    margin: 12px -16px 14px;
    padding: 8px 16px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .r2 { margin-top: 6px; }
  .search { position: relative; flex: 1; min-width: 0; }
  .search svg {
    position: absolute;
    left: 11px;
    top: 50%;
    width: 15px;
    height: 15px;
    transform: translateY(-50%);
    color: var(--fg-muted);
    pointer-events: none;
  }
  .search input {
    width: 100%;
    font: inherit;
    font-size: 14px;
    color: var(--fg);
    background: var(--bg-3);
    border: 1px solid var(--border-2);
    border-radius: 8px;
    padding: 7px 10px 5px 32px;
    outline: none;
    transition: border-color .2s var(--ease);
  }
  .search input::placeholder { color: var(--fg-muted); }
  .search input:focus { border-color: var(--accent); }

  .seg {
    flex: none;
    display: inline-flex;
    border: 1px solid var(--border-2);
    border-radius: 8px;
    padding: 2px;
    background: var(--bg-3);
  }
  .seg button {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font: inherit;
    font-size: 12px;
    letter-spacing: 0.03em;
    color: var(--fg-muted);
    background: transparent;
    border: 0;
    border-radius: 6px;
    padding: 5px 9px 3px;
    cursor: pointer;
    transition: color .2s var(--ease), background .2s var(--ease);
  }
  .seg button[aria-pressed="true"] {
    color: #101820;
    background: var(--accent);
  }
  .seg svg { width: 13px; height: 13px; }
  .seg.sm button { padding: 4px 8px 2px; font-size: 11px; min-width: 30px; justify-content: center; }

  .chips {
    flex: 1;
    min-width: 0;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    font: inherit;
    font-size: 12px;
    letter-spacing: 0.03em;
    color: var(--fg-muted);
    background: transparent;
    border: 1px solid var(--border-2);
    border-radius: 999px;
    padding: 4px 10px 2px;
    cursor: pointer;
    transition: color .2s var(--ease), border-color .2s var(--ease), background .2s var(--ease);
  }
  .chip:hover { color: var(--fg); border-color: var(--border-3); }
  .chip[aria-pressed="true"] {
    color: var(--fg);
    background: var(--bg-2);
    border-color: var(--border-3);
  }
  /* Data saver: tiles stay on their snapshot; only the cam you open streams. */
  .switch {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: inherit;
    font-size: 11px;
    letter-spacing: 0.03em;
    color: var(--fg-muted);
    background: transparent;
    border: 0;
    padding: 2px 0;
    cursor: pointer;
    white-space: nowrap;
  }
  .switch i {
    position: relative;
    width: 26px;
    height: 16px;
    border-radius: 999px;
    background: var(--bg-2);
    border: 1px solid var(--border-2);
    transition: background .2s var(--ease);
  }
  .switch i::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--fg-muted);
    transition: transform .2s var(--ease), background .2s var(--ease);
  }
  .switch[aria-checked="true"] { color: var(--fg); }
  .switch[aria-checked="true"] i { background: var(--accent); border-color: var(--accent); }
  .switch[aria-checked="true"] i::after { background: #101820; transform: translateX(10px); }

  /* Wide: search · areas · view · saver on one line */
  @media (min-width: 1100px) {
    .controls { display: flex; align-items: center; gap: 10px; }
    .row { display: contents; }
    .search { flex: 0 1 340px; order: 1; }
    .chips { order: 2; }
    .seg { order: 3; }
    .r2 > .nav { order: 4; }
    .seg.sm { order: 5; }
    .switch { order: 6; }
  }
  /* Phones: 16px input stops iOS zooming on focus */
  @media (max-width: 640px) {
    .search input { font-size: 16px; padding: 8px 10px 6px 32px; }
  }

  /* ---------- Score badge (shared by tiles, pins, popups, viewer) ---------- */
  .lvl-0 { --pin: var(--lvl-0); --ink: #fff; }
  .lvl-1 { --pin: var(--lvl-1); --ink: #fff; }
  .lvl-2 { --pin: var(--lvl-2); --ink: #101820; }
  .lvl-3 { --pin: var(--lvl-3); --ink: #101820; }
  .lvl-4 { --pin: var(--lvl-4); --ink: #101820; }
  .lvl-x { --pin: var(--bg-2); --ink: var(--fg-muted); }
  .score {
    display: inline-flex;
    align-items: baseline;
    gap: 5px;
    color: var(--ink);
    background: var(--pin);
    border-radius: 8px;
    padding: 4px 8px 2px;
    white-space: nowrap;
    line-height: 1;
  }
  .score b { font-size: 15px; font-weight: 700; }
  .score small { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  .score.lg b { font-size: 26px; }
  .score.lg small { font-size: 12px; }

  /* Four-bar "today" strip — mini on tiles, full-size in the viewer. */
  .mini {
    display: inline-flex;
    gap: 2px;
    align-items: flex-end;
    height: 14px;
    flex: none;
  }
  .mini i {
    display: block;
    width: 5px;
    min-height: 2px;
    border-radius: 1px;
    background: var(--pin, var(--bg-2));
  }
  .mini i.past { opacity: .35; }
  .mini i.now { outline: 1px solid #fff; outline-offset: 1px; }

  /* ---------- Layout: cams + map ---------- */
  .layout {
    display: grid;
    gap: 16px;
    align-items: start;
  }
  .layout[data-view="split"] { grid-template-columns: minmax(0, 1fr) minmax(340px, 38%); }
  .layout[data-view="grid"] .map-pane { display: none; }
  .layout[data-view="map"] .list { display: none; }
  .map-pane {
    position: sticky;
    top: calc(var(--controls-h) + 12px);
  }
  #map {
    height: calc(100vh - var(--controls-h) - 44px);
    min-height: 380px;
    border: 1px solid var(--border-2);
    border-radius: var(--radius-lg);
    background: var(--bg-3);
    overflow: hidden;
    z-index: 0;
  }
  .layout[data-view="map"] .map-pane { position: static; }
  .layout[data-view="map"] #map { height: clamp(420px, 72vh, 860px); }
  @media (max-width: 999px) {
    .layout[data-view="split"] { grid-template-columns: 1fr; }
    .layout[data-view="split"] .map-pane { display: none; }
    #seg-split { display: none; }
  }

  /* ---------- Areas and tiles ---------- */
  .area { margin-bottom: 24px; }
  .area[hidden] { display: none; }
  .area-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .area-head h2 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .area-head h2 small {
    font-size: 13px;
    font-weight: 400;
    color: var(--fg-muted);
    margin-left: 8px;
    letter-spacing: 0;
  }
  .area-sum {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 2px 14px;
    color: var(--fg-muted);
    font-size: 13px;
    text-align: right;
  }
  .area-sum b { color: var(--fg); font-weight: 600; }
  .tide-sum { color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
  /* Tiles are the preview; everything else sits on top of the picture.
     Beside the map they stay modest; in Cams mode they fill the width. */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 12px;
  }
  .layout[data-view="grid"] .cards {
    grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
    gap: 14px;
  }
  /* One area picked (or a search): let its few cams spread to fill the room.
     Four become a 2×2 of big previews, two sit side by side, one is capped. */
  .layout.filtered .cards { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
  .layout[data-view="grid"].filtered .cards { grid-template-columns: repeat(auto-fit, minmax(min(100%, 620px), 1fr)); gap: 16px; }
  .layout.filtered .area[data-count="1"] .cards { grid-template-columns: minmax(0, 1100px); justify-content: center; }
  @media (max-width: 640px) {
    .cards, .layout[data-view="grid"] .cards, .layout.filtered .cards { grid-template-columns: 1fr; gap: 12px; }
  }

  .cam {
    position: relative;
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    font: inherit;
    color: #fff;
    background:
      radial-gradient(120% 90% at 20% 110%, color-mix(in srgb, var(--sea) 70%, transparent), transparent 60%),
      linear-gradient(160deg, var(--bg-2), var(--bg));
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    cursor: pointer;
    transition: transform .25s var(--ease), border-color .25s var(--ease), box-shadow .25s var(--ease);
  }
  .cam:hover, .cam:focus-visible {
    transform: translateY(-2px);
    border-color: var(--border-3);
    outline: none;
  }
  .cam:focus-visible { border-color: var(--accent); }
  .cam.flash { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }

  /* Snapshot underneath, live video on top once it's actually playing. */
  .cam img, .cam video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity .4s var(--ease);
  }
  .cam img.ready, .cam video.ready { opacity: 1; }
  .cam .score {
    position: absolute;
    z-index: 2;
    right: 8px;
    top: 8px;
    padding: 3px 6px 2px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }
  .cam .score b { font-size: 12px; }
  .cam .score small { font-size: 9px; }
  .live {
    position: absolute;
    z-index: 2;
    left: 8px;
    top: 8px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #fff;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    padding: 3px 7px 2px;
    border-radius: 999px;
  }
  .live i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--fg-muted);
  }
  /* The dot only goes red once the tile is really streaming. */
  .cam.streaming .live i { background: var(--live); animation: pulse 2s infinite; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(229, 72, 77, .6); }
    70%  { box-shadow: 0 0 0 6px rgba(229, 72, 77, 0); }
    100% { box-shadow: 0 0 0 0 rgba(229, 72, 77, 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .live i, .pin.lvl-4::after { animation: none; }
    .cam, .cam img, .cam video { transition: none; }
  }

  /* Small text overlay along the bottom of the picture */
  /* Kept to a thin strip so the picture stays the point. */
  .overlay {
    position: absolute;
    z-index: 1;
    left: 0; right: 0; bottom: 0;
    padding: 14px 8px 6px;
    text-align: left;
    background: linear-gradient(to top, rgba(0,0,0,0.72), rgba(0,0,0,0));
  }
  .overlay .name {
    font-size: 12px;
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
  .overlay .sub {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 6px;
    margin-top: 1px;
  }
  .overlay .cond-line {
    flex: 1;
    font-size: 10px;
    letter-spacing: 0.02em;
    color: rgba(255,255,255,0.75);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .overlay .cond-line b { color: #fff; font-weight: 600; }
  .overlay .sub .mini-slot { flex: none; }
  .overlay .mini { height: 18px; gap: 3px; }
  .overlay .mini i { width: 7px; border-radius: 2px; }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  .tag {
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--fg-muted);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 3px 7px 1px;
  }

  .empty {
    display: none;
    text-align: center;
    color: var(--fg-muted);
    padding: 60px 16px;
  }
  .empty.show { display: block; }

  /* ---------- Map ---------- */
  .legend {
    position: absolute;
    z-index: 1;
    left: 12px;
    bottom: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--fg);
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 7px 10px 5px;
    pointer-events: none;
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 9px; height: 9px; border-radius: 50%; background: var(--pin); }
  .map-hint {
    color: var(--fg-muted);
    font-size: 12px;
    margin-top: 8px;
    letter-spacing: 0.02em;
  }
  .map-hint a { color: var(--accent-ink); white-space: nowrap; }

  /* OSM's street tiles are light; in the charcoal theme we invert them.
     Satellite imagery is left alone. */
  [data-theme="charcoal"] .osm-tiles {
    filter: invert(1) hue-rotate(180deg) brightness(0.82) contrast(0.9) saturate(0.55);
  }

  /* Pins: a divIcon carrying the score, coloured by level. */
  .pin-wrap { background: none; border: 0; }
  .pin {
    position: relative;
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
    padding-top: 1px;
    color: var(--ink);
    background: var(--pin);
    border: 2px solid #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.45);
    transition: transform .2s var(--ease);
  }
  .pin.lvl-x { border-style: dashed; border-color: var(--fg-muted); }
  .pin.lvl-4::after {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    animation: pulse-pin 2s infinite;
  }
  @keyframes pulse-pin {
    0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--lvl-4) 60%, transparent); }
    70%  { box-shadow: 0 0 0 10px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  .leaflet-marker-icon:hover .pin, .leaflet-marker-icon.hot .pin { transform: scale(1.18); }
  .leaflet-marker-icon.hot { z-index: 1000 !important; }

  /* Animated particle field (wind / swell), drawn between tiles and pins */
  .particles { pointer-events: none; mix-blend-mode: screen; }
  [data-theme="light"] .particles { mix-blend-mode: multiply; opacity: 0.85; }

  /* Data tag beside each pin: name, then swell · wind. Shown from zoom 11. */
  .tag {
    position: absolute;
    left: 34px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 4px 8px 3px;
    border-radius: 8px;
    border-left: 3px solid var(--pin);
    background: rgba(8, 14, 20, 0.8);
    color: #fff;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    pointer-events: none;
  }
  .tag b { font-size: 11px; font-weight: 600; line-height: 1.1; }
  .tag i { font-style: normal; font-size: 10px; line-height: 1.1; color: rgba(255,255,255,0.82); letter-spacing: 0.02em; }
  .tag i em { font-style: normal; color: #fff; font-weight: 600; }
  .leaflet-container:not(.labels) .tag { display: none; }
  .leaflet-marker-icon.hot { z-index: 1000 !important; }

  /* Leaflet chrome in our palette */
  .leaflet-container { font-family: inherit; background: var(--bg-3); }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
    background: var(--bg-3);
    color: var(--fg);
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .leaflet-popup-content-wrapper { border-radius: var(--radius); border: 1px solid var(--border-2); }
  .leaflet-popup-content { margin: 12px 14px; font-size: 14px; line-height: 1.35; }
  .leaflet-bar a {
    background: var(--bg-3);
    color: var(--fg);
    border-bottom-color: var(--border-2);
  }
  .leaflet-bar a:hover { background: var(--bg-2); color: var(--fg); }
  .leaflet-control-layers {
    background: var(--bg-3);
    color: var(--fg);
    border: 1px solid var(--border-2);
    border-radius: var(--radius);
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
  }
  .leaflet-control-layers-expanded { padding: 6px 10px 4px; font-size: 12px; letter-spacing: 0.03em; }
  .leaflet-control-layers label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .leaflet-control-layers input { accent-color: var(--accent); }
  .leaflet-control-attribution {
    background: color-mix(in srgb, var(--bg) 80%, transparent);
    color: var(--fg-muted);
    font-size: 10px;
  }
  .leaflet-control-attribution a { color: var(--fg); }
  .leaflet-tooltip {
    background: var(--bg-3);
    color: var(--fg);
    border: 1px solid var(--border-2);
    border-radius: var(--radius-sm);
    font-size: 12px;
    padding: 3px 7px 1px;
  }
  .leaflet-tooltip-top::before { border-top-color: var(--border-2); }

  .pop-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .pop-name { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .pop-where { color: var(--fg-muted); font-size: 13px; }
  .pop-cond { margin-top: 8px; font-size: 13px; color: var(--fg-muted); }
  .pop-cond b { color: var(--fg); font-weight: 600; }
  .pop-cond .mini i.now { outline-color: var(--fg); }
  .pop-sum { margin-top: 4px; font-size: 12px; color: var(--fg-muted); }
  .pop-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pop-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #101820;
    background: var(--accent);
    border: 0;
    border-radius: 999px;
    padding: 8px 14px 6px;
    cursor: pointer;
  }
  .pop-btn svg { width: 12px; height: 12px; }

  /* Secondary pill button (Directions) */
  .nav {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: inherit;
    font-size: 13px;
    letter-spacing: 0.03em;
    color: var(--fg);
    text-decoration: none;
    background: transparent;
    border: 1px solid var(--border-2);
    border-radius: 999px;
    padding: 8px 13px 6px;
    cursor: pointer;
    transition: border-color .2s var(--ease), color .2s var(--ease);
  }
  .nav:hover, .nav:focus-visible { border-color: var(--accent); color: var(--accent-ink); outline: none; }
  .nav svg { width: 13px; height: 13px; }
  .r2 > .nav { font-size: 12px; padding: 5px 11px 3px; }

  /* "Open in…" chooser for directions */
  .go {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: grid;
    place-items: end center;
    padding: 16px;
    background: var(--shade);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s var(--ease);
  }
  .go.open { opacity: 1; pointer-events: auto; }
  .go-card {
    width: min(420px, 100%);
    background: var(--bg);
    border: 1px solid var(--border-2);
    border-radius: var(--radius-lg);
    padding: 16px 16px calc(14px + env(safe-area-inset-bottom));
    transform: translateY(16px);
    transition: transform .25s var(--ease);
  }
  .go.open .go-card { transform: none; }
  .go-title { font-size: 16px; font-weight: 600; }
  .go-sub { color: var(--fg-muted); font-size: 13px; margin-top: 2px; }
  .go-list { display: grid; gap: 8px; margin-top: 14px; }
  .go-opt {
    display: flex;
    align-items: center;
    gap: 12px;
    font: inherit;
    font-size: 15px;
    color: var(--fg);
    text-decoration: none;
    background: var(--bg-3);
    border: 1px solid var(--border-2);
    border-radius: var(--radius);
    padding: 12px 14px 10px;
    transition: border-color .2s var(--ease);
  }
  .go-opt:hover, .go-opt:focus-visible { border-color: var(--accent); outline: none; }
  .go-opt i {
    width: 10px; height: 10px; border-radius: 50%; flex: none;
  }
  .go-opt small { margin-left: auto; color: var(--fg-muted); font-size: 12px; }
  .go-cancel {
    width: 100%;
    margin-top: 10px;
    font: inherit;
    font-size: 14px;
    color: var(--fg-muted);
    background: transparent;
    border: 0;
    padding: 10px;
    cursor: pointer;
  }
  .go-cancel:hover { color: var(--fg); }
  @media (min-width: 641px) { .go { place-items: center; } }

  /* ---------- Viewer ---------- */
  .viewer {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--shade);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s var(--ease);
  }
  .viewer.open { opacity: 1; pointer-events: auto; }
  .sheet {
    width: min(1100px, 100%);
    max-height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    border: 1px solid var(--border-2);
    border-radius: var(--radius-lg);
    overflow: hidden auto;
    transform: translateY(12px);
    transition: transform .3s var(--ease);
  }
  .viewer.open .sheet { transform: none; }
  /* The header (and its close button) stays put while the sheet scrolls. */
  .sheet-head {
    position: sticky;
    top: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 12px 12px 18px;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .sheet-title { flex: 1; min-width: 0; }
  .sheet-title .name {
    font-size: 19px;
    font-weight: 600;
    line-height: 1.15;
    letter-spacing: -0.015em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sheet-title .where { font-size: 14px; color: var(--fg-muted); margin-top: 2px; }
  .icon-btn {
    flex: none;
    display: inline-grid;
    place-items: center;
    width: 40px;
    height: 40px;
    color: var(--fg);
    background: var(--bg-3);
    border: 1px solid var(--border-2);
    border-radius: 50%;
    cursor: pointer;
    text-decoration: none;
    transition: border-color .2s var(--ease), color .2s var(--ease);
  }
  .icon-btn:hover, .icon-btn:focus-visible { border-color: var(--accent); color: var(--accent-ink); outline: none; }
  #v-close { background: var(--accent); color: #101820; border-color: var(--accent); }
  #v-close:hover, #v-close:focus-visible { color: #101820; filter: brightness(1.08); }

  .frame {
    position: relative;
    flex: none;
    background: #000;
  }
  .frame.video { aspect-ratio: 16 / 9; }
  .frame.page  { height: min(70vh, 900px); }
  .frame iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
  .frame-msg {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    text-align: center;
    color: #d6d2c4;
    font-size: 15px;
  }
  /* Plyr in our palette. Plyr is given ratio 16:9 so it fills .frame.video exactly. */
  .plyr {
    --plyr-color-main: var(--accent);
    --plyr-video-background: #000;
    --plyr-font-family: inherit;
    --plyr-control-radius: 6px;
  }

  .panel { padding: 14px 18px; border-top: 1px solid var(--border); }
  .panel[hidden] { display: none; }
  .k {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-muted);
  }

  /* Score breakdown: one row per factor */
  .scorecard {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 14px 20px;
    align-items: start;
  }
  .score-total { display: flex; flex-direction: column; gap: 6px; }
  .score-cap { font-size: 12px; color: var(--fg-muted); max-width: 150px; }
  .score-cap.note { color: var(--lvl-2); }
  .src-row { display: flex; flex-wrap: wrap; gap: 3px 12px; margin-top: 6px; font-size: 12px; color: var(--fg-muted); }
  .src-row b { color: var(--fg); font-weight: 600; }
  .src-k { flex: 0 0 56px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
  .src-sum { color: var(--fg); }
  .src-row small { font-size: 10px; color: var(--fg-muted); }
  .src-out { opacity: 0.55; text-decoration: line-through; text-decoration-color: var(--fg-muted); }
  .src-out small { text-decoration: none; }
  .src-conf { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--pin); }
  .src-note { margin-top: 8px; font-size: 11px; color: var(--fg-muted); line-height: 1.4; }
  .factors { display: grid; gap: 8px; }
  .factor {
    display: grid;
    grid-template-columns: 76px 1fr 44px;
    gap: 4px 10px;
    align-items: center;
  }
  .factor .k { padding-top: 2px; }
  .f-bar {
    height: 6px;
    border-radius: 3px;
    background: var(--bg-2);
    overflow: hidden;
  }
  .f-bar i { display: block; height: 100%; background: var(--pin, var(--accent)); border-radius: 3px; }
  .f-pts { font-size: 13px; font-weight: 600; text-align: right; white-space: nowrap; }
  .f-detail {
    grid-column: 2 / -1;
    font-size: 12px;
    color: var(--fg-muted);
    line-height: 1.3;
  }
  .f-detail b { color: var(--fg); font-weight: 600; }

  /* Today: four bars, dawn → evening */
  .today-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .today-bars {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 10px;
  }
  .tbar {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .tbar .col {
    position: relative;
    width: 100%;
    height: 64px;
    border-radius: 6px;
    background: var(--bg-3);
    overflow: hidden;
  }
  .tbar .col i {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: var(--pin, var(--bg-2));
    border-radius: 6px 6px 0 0;
    min-height: 3px;
  }
  .tbar b { font-size: 14px; }
  .tbar span { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-muted); white-space: nowrap; }
  .tbar.past { opacity: .45; }
  .tbar.now .col { outline: 2px solid var(--fg); outline-offset: 1px; }
  .today-sum { margin-top: 12px; font-size: 14px; line-height: 1.45; }

  /* "Right now": water, air, light, tide, suit */
  .now-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px 16px;
    margin-top: 8px;
  }
  .now-row .v { display: block; font-size: 16px; font-weight: 600; margin-top: 2px; white-space: nowrap; }
  .now-row .v small { font-size: 12px; font-weight: 400; color: var(--fg-muted); }

  .local-row {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    margin-top: 6px;
    font-size: 14px;
    color: var(--fg-muted);
  }
  .local-row b { color: var(--fg); font-weight: 600; }
  .local-notes {
    margin-top: 8px;
    font-size: 14px;
    line-height: 1.45;
  }
  .panel .tags { margin-top: 10px; }

  .sheet-foot {
    padding: 10px 18px 12px;
    color: var(--fg-muted);
    font-size: 13px;
    letter-spacing: 0.02em;
  }
  .sheet-foot a { color: var(--accent-ink); }

  /* Phones: the viewer becomes a full-screen sheet */
  @media (max-width: 640px) {
    .viewer { padding: 0; place-items: stretch; }
    .sheet {
      width: 100%;
      height: 100%;
      border-radius: 0;
      border: 0;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .sheet-head { padding-top: max(12px, env(safe-area-inset-top)); }
    .frame.page { flex: 1; height: auto; min-height: 60vh; }
    .scorecard { grid-template-columns: 1fr; }
    .seg button span { display: none; }
    .seg button { padding: 8px 10px 6px; }
    .tbar span { font-size: 10px; }
  }
</style>
</head>
<body>

<main class="page">
  <header>
    <div class="top">
      <a class="back" href="../">← allfield</a>
    </div>
    <div class="head">
      <h1>surf cams<span>.</span></h1>
      <div class="aside">
        <div class="tide-now" id="tide-now" hidden></div>
        <div class="best" id="best" hidden></div>
      </div>
    </div>
  </header>

  <div class="controls" id="controls">
    <div class="row">
      <label class="search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="Search spots, towns, areas…" autocomplete="off" aria-label="Search cams">
      </label>
      <div class="seg" role="group" aria-label="View">
        <button type="button" id="seg-grid" data-view="grid" aria-pressed="false" title="Cams only">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span>Cams</span>
        </button>
        <button type="button" id="seg-split" data-view="split" aria-pressed="false" title="Cams beside the map">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>
          <span>Split</span>
        </button>
        <button type="button" id="seg-map" data-view="map" aria-pressed="false" title="Map only">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>
          <span>Map</span>
        </button>
      </div>
    </div>
    <div class="row r2">
      <div class="chips" id="chips" role="group" aria-label="Filter by area"></div>
      <a class="nav" href="week.html" title="Seven-day outlook for every spot">7-day</a>
      <div class="seg sm" id="units" role="group" aria-label="Height units">
        <button type="button" data-units="m" aria-pressed="true">m</button>
        <button type="button" data-units="ft" aria-pressed="false">ft</button>
      </div>
      <button class="switch" id="saver" type="button" role="switch" aria-checked="false" title="Don’t auto-play the tiles; only stream the cam you open">
        <i aria-hidden="true"></i>Data saver
      </button>
    </div>
  </div>

  <div class="layout" id="layout" data-view="split">
    <div class="list" id="grid"></div>
    <aside class="map-pane" id="map-wrap">
      <div style="position: relative">
        <div id="map" role="region" aria-label="Map of surf cams"></div>
        <div class="legend" aria-hidden="true">
          <span class="lvl-0"><i></i>Flat</span>
          <span class="lvl-1"><i></i>Poor</span>
          <span class="lvl-2"><i></i>Fair</span>
          <span class="lvl-3"><i></i>Good</span>
          <span class="lvl-4"><i></i>Epic</span>
        </div>
      </div>
      <p class="map-hint" id="map-hint">Pins show each spot’s score; arrows show wind and swell. Tap a pin for details, directions and the cam. <a id="windy" href="https://www.windy.com/-Wind-wind?38.70,-9.40,9" target="_blank" rel="noopener noreferrer">Open this view in Windy ↗</a></p>
    </aside>
  </div>
  <p class="empty" id="empty">No cams match that. Try another spot or clear the filter.</p>
</main>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="v-name" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-title">
        <div class="name" id="v-name"></div>
        <div class="where" id="v-where"></div>
      </div>
      <a class="icon-btn" id="v-open" target="_blank" rel="noopener noreferrer" aria-label="Open on source site" title="Open on source site">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
      </a>
      <button class="icon-btn" id="v-close" type="button" aria-label="Close" title="Close (Esc)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="frame" id="v-frame"></div>
    <div class="panel scorecard" id="v-score" hidden></div>
    <div class="panel" id="v-src" hidden></div>
    <div class="panel" id="v-now" hidden></div>
    <div class="panel" id="v-today" hidden></div>
    <div class="panel" id="v-local"></div>
    <div class="sheet-foot" id="v-foot"></div>
  </div>
</div>

<!-- Directions: one button everywhere, then pick the app -->
<div class="go" id="go" role="dialog" aria-modal="true" aria-labelledby="go-title" hidden>
  <div class="go-card">
    <div class="go-title" id="go-title">Directions</div>
    <div class="go-sub" id="go-sub"></div>
    <div class="go-list" id="go-list"></div>
    <button class="go-cancel" id="go-cancel" type="button">Cancel</button>
  </div>
</div>

<script src="spots.js"></script>
<script src="score.js"></script>
<script>
  const LIBS = {
    plyr:    'https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.min.js',
    hls:     'https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js',
    leaflet: 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js',
  };
  const COND_TTL = 30 * 60 * 1000; // re-fetch conditions after 30 minutes
  const COND_VER = 5;              // bump when the cached shape changes
  // Tiles keep a short buffer and start on the lowest rendition — they're
  // small, and ten of them at once adds up.
  const TILE_HLS = {
    liveDurationInfinity: true, enableWorker: true, capLevelToPlayerSize: true,
    startLevel: 0, maxBufferLength: 8, maxMaxBufferLength: 16, backBufferLength: 0, liveSyncDurationCount: 3,
  };
  // How many tiles may stream at once; the rest sit on their snapshot until
  // one scrolls away.
  const MAX_TILES = matchMedia('(max-width: 640px)').matches ? 6 : 12;
  const wide = matchMedia('(min-width: 1000px)');

  const $ = (id) => document.getElementById(id);
  const grid = $('grid'), chips = $('chips'), q = $('q'), empty = $('empty');
  const layout = $('layout'), viewer = $('viewer'), frame = $('v-frame'), go = $('go');

  let area = 'All';
  let view = 'split';
  // Data saver: on by default if the browser says so, else remembered.
  let dataSaver = !!(navigator.connection && navigator.connection.saveData);
  try { const s = localStorage.getItem('surf-saver'); if (s !== null) dataSaver = s === '1'; } catch {}
  let lastFocus = null;
  let hls = null, player = null;
  let hideTimer = 0, goTimer = 0;
  let conditions = {};   // cam id -> { now: {...}, hours: [{...}], t }
  let condNote = '';
  let map = null, windLayer = null, swellLayer = null, windField = null, swellField = null;
  let fieldGrid = null;  // coarse wind/swell samples along the coast, for the particle field
  const markers = {};
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const tiles = {};      // cam id -> { video, hls, visible, active, hold, dead }
  const nativeHls = !!document.createElement('video').canPlayType('application/vnd.apple.mpegurl');

  const haystack = (c) => norm([c.name, c.town, c.area, c.zone, c.country, c.source, ...(c.tags || [])].join(' '));
  const matches = (c) => {
    const terms = norm(q.value.trim()).split(/\s+/).filter(Boolean);
    const hay = haystack(c);
    return (area === 'All' || c.area === area) && terms.every((t) => hay.includes(t));
  };
  const byId = (id) => CAMS.find((x) => x.id === id);
  const cards = () => [...grid.querySelectorAll('.cam')];
  // 'split' only exists on wide screens; narrower ones fall back to the grid.
  const effectiveView = () => (view === 'split' && !wide.matches ? 'grid' : view);

  // Scripts are fetched once, the first time they're needed.
  const loaded = {};
  const loadScript = (url) => loaded[url] || (loaded[url] = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = url;
    s.onload = resolve;
    s.onerror = () => { delete loaded[url]; reject(new Error('Failed to load ' + url)); };
    document.head.appendChild(s);
  }));

  // Bust snapshot caches once a minute so thumbnails stay roughly current
  // without hammering the cam hosts.
  const stamp = Math.floor(Date.now() / 60000);
  const thumbUrl = (u) => u + (u.includes('?') ? '&' : '?') + 't=' + stamp;

  const scoreOf = (c) => score(c, conditions[c.id] && conditions[c.id].now);
  const badge = (c, lg) => {
    const r = scoreOf(c);
    return r
      ? `<span class="score lvl-${r.level}${lg ? ' lg' : ''}"><b>${fmt(r.total)}</b><small>${r.label}</small></span>`
      : `<span class="score lvl-x${lg ? ' lg' : ''}"><b>–</b><small>no data</small></span>`;
  };
  const condText = (c) => {
    const k = conditions[c.id] && conditions[c.id].now, r = scoreOf(c);
    if (!r) return '';
    return `<b>${hgt(k.h)}</b> · <b>${Math.round(k.p)} s</b> · <b>${kts(k.ws)} kts</b> ${r.wind}`;
  };

  /* ---------- Today: four bars + a summary ---------- */


  // Average score per block of the day, daylight hours only.
  function dayBars(c) {
    const hs = conditions[c.id] && conditions[c.id].hours;
    if (!hs || !hs.length) return null;
    const nowH = new Date().getHours();
    return BUCKETS.map((b) => {
      const rows = hs.filter((k) => k.day !== 0 && hourOf(k.t) >= b.from && hourOf(k.t) < b.to);
      const totals = rows.map((k) => score(c, k)).filter(Boolean).map((r) => r.total);
      const avg = totals.length ? Math.round((totals.reduce((a, x) => a + x, 0) / totals.length) * 2) / 2 : null;
      return { ...b, score: avg, level: avg == null ? null : levelOf(avg), past: nowH >= b.to, now: nowH >= b.from && nowH < b.to };
    });
  }

  const miniBars = (c) => {
    const bars = dayBars(c);
    if (!bars) return '';
    return `<span class="mini" aria-hidden="true" title="Today, dawn to evening">${bars.map((b) =>
      `<i class="${b.level == null ? 'lvl-x' : 'lvl-' + b.level}${b.past ? ' past' : ''}${b.now ? ' now' : ''}" style="height:${b.score == null ? 2 : Math.max(2, b.score * 10)}%"></i>`
    ).join('')}</span>`;
  };

  // A sentence or two on how the day goes: size trend, wind, best window.
  function daySummary(c) {
    const hs = conditions[c.id] && conditions[c.id].hours;
    if (!hs) return '';
    const day = hs.filter((k) => k.day !== 0 && hourOf(k.t) >= 6 && hourOf(k.t) < 19);
    if (day.length < 2) return 'No daylight hours left to call.';
    const first = day[0], last = day[day.length - 1];
    const dh = last.h - first.h;
    const sizeTxt = Math.abs(dh) < 0.25
      ? `Holding around ${hgt((first.h + last.h) / 2)} at ${Math.round((first.p + last.p) / 2)} s`
      : dh > 0 ? `Building from ${hgt(first.h)} to ${hgt(last.h)}` : `Easing from ${hgt(first.h)} to ${hgt(last.h)}`;
    const rels = day.map((k) => windRel(c, k));
    const half = Math.floor(rels.length / 2);
    const mode = (arr) => arr.sort((a, b) => arr.filter((v) => v === a).length - arr.filter((v) => v === b).length).pop();
    const am = mode(rels.slice(0, half)), pm = mode(rels.slice(half));
    const speeds = day.map((k) => k.ws);
    const windTxt = am === pm
      ? `${am} wind all day, ${kts(Math.min(...speeds))}–${kts(Math.max(...speeds))} kts`
      : `${am} early, turning ${pm} later and up to ${kts(Math.max(...speeds))} kts`;
    const bars = (dayBars(c) || []).filter((b) => b.score != null);
    const best = bars.slice().sort((a, b) => b.score - a.score)[0];
    const bestTxt = best ? (best.past ? `Best was ${best.label.toLowerCase()} (${fmt(best.score)}).` : `Best window: ${best.label.toLowerCase()} (${fmt(best.score)}).`) : '';
    return `${sizeTxt}; ${windTxt}. ${bestTxt}`.trim();
  }

  // Tide times barely differ along this coast, so one averaged set serves
  // everyone; an area only gets its own line if it strays by 20+ minutes.
  function coastTides() {
    const lists = CAMS.map((c) => conditions[c.id] && conditions[c.id].tides).filter((l) => l && l.length);
    if (!lists.length) return null;
    const tpl = lists.slice().sort((a, b) => b.length - a.length)[0];
    return tpl.map((e) => {
      const ms = lists.map((l) => {
        const m = l.filter((x) => x.kind === e.kind).sort((a, b) => Math.abs(a.mins - e.mins) - Math.abs(b.mins - e.mins))[0];
        return m && Math.abs(m.mins - e.mins) < 90 ? m.mins : null;
      }).filter((v) => v != null);
      const avg = Math.round(ms.reduce((a, x) => a + x, 0) / ms.length);
      return { kind: e.kind, mins: avg, t: fmtMins(avg) };
    });
  }
  const areaTides = (a) => { const c = CAMS.find((x) => x.area === a && conditions[x.id] && conditions[x.id].tides && conditions[x.id].tides.length); return c ? conditions[c.id].tides : null; };
  const tidesDiffer = (ev, coast) => !!(ev && coast) && ev.some((e) => {
    const m = coast.filter((x) => x.kind === e.kind).sort((a, b) => Math.abs(a.mins - e.mins) - Math.abs(b.mins - e.mins))[0];
    return m && Math.abs(m.mins - e.mins) >= 20;
  });
  // The tide line a spot should show: the coast-wide one unless its area strays.
  const tidesFor = (c) => { const ev = areaTides(c.area), coast = coastTides(); return tidesDiffer(ev, coast) ? ev : (coast || ev); };

  // Measured wind from IPMA's station network (open data, hourly, about an
  // hour behind): each cam gets its nearest station within 50 km.
  async function loadObs() {
    const base = 'https://api.ipma.pt/open-data/observation/meteorology/stations/';
    const [stations, observations] = await Promise.all([
      fetch(base + 'stations.json').then((r) => r.json()),
      fetch(base + 'observations.json').then((r) => r.json()),
    ]);
    const hoursDesc = Object.keys(observations).sort().reverse().slice(0, 3);
    const km = (a, b, c, d) => { const R = 6371, t = (x) => x * Math.PI / 180; const x = Math.sin(t(c - a) / 2) ** 2 + Math.cos(t(a)) * Math.cos(t(c)) * Math.sin(t(d - b) / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); };
    const out = {};
    for (const c of CAMS) {
      let best = null;
      for (const s of stations) {
        const id = String(s.properties.idEstacao), [lon, lat] = s.geometry.coordinates;
        const d = km(c.lat, c.lng, lat, lon);
        if (d > 50 || (best && d >= best.km)) continue;
        for (const h of hoursDesc) {
          const o = observations[h] && observations[h][id];
          if (!o || o.intensidadeVentoKM == null || o.intensidadeVentoKM < 0) continue;
          best = { station: s.properties.localEstacao.replace(/\s*\(.*\)$/, ''), km: Math.round(d), day: h.slice(0, 10), t: h.slice(11, 16), ageH: +((Date.now() - new Date(h)) / 3.6e6).toFixed(1), ws: o.intensidadeVentoKM, wd: IPMA_DIR[o.idDireccVento] ?? null, temp: o.temperatura >= -50 ? o.temperatura : null };
          break;
        }
      }
      if (best) out[c.id] = best;
    }
    return out;
  }

  async function loadConditions() {
    const ids = CAMS.map((c) => c.id).join();
    const today = new Date().toDateString();
    try {
      const cached = JSON.parse(localStorage.getItem('surf-cond') || 'null');
      if (cached && cached.v === COND_VER && cached.ids === ids && cached.day === today && Date.now() - cached.t < COND_TTL) {
        conditions = cached.data;
        condNote = cached.note;
        return;
      }
    } catch {}

    const pts = CAMS.map(offshore);
    const lat = pts.map((p) => p[0]).join(','), lng = pts.map((p) => p[1]).join(',');
    // Every model's hourly series for today, blended per hour below.
    const marineUrl = `https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lng}&hourly=${MARINE.join()}&models=${modelIds(MARINE_MODELS)}&forecast_days=1&timezone=auto`;
    const windUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&hourly=${WIND.join()}&models=${modelIds(WIND_MODELS)}&daily=sunrise,sunset&forecast_days=1&timezone=auto`;

    try {
      const [marine, wind, obs] = await Promise.all([
        fetch(marineUrl).then((r) => r.json()),
        fetch(windUrl).then((r) => r.json()),
        loadObs().catch(() => ({})),
      ]);
      if (marine.error || wind.error) throw new Error(marine.reason || wind.reason);
      const M = asList(marine), W = asList(wind);
      const next = {};
      let when = '';
      const nowMs = Date.now();
      // Teach the wind models from any station hour we haven't scored before.
      let seen = [];
      try { seen = JSON.parse(localStorage.getItem('surf-skill-seen') || '[]'); } catch {}
      let learned = false;
      const marineW = MARINE_MODELS.map((mod) => mod.w);
      CAMS.forEach((c, i) => {
        const m = M[i], w = W[i];
        if (!m || !w || !m.hourly || !w.hourly) return;
        const ob = obs[c.id] || null;
        // A model's miss against this cam's station, if the hour lines up
        // and we haven't counted this reading already.
        // One lesson per station per hour (several cams share a station), and
        // direction only counts once there's enough wind to have one.
        if (ob) {
          const stamp = `${ob.station}|${ob.day}T${ob.t}`;
          const j = w.hourly.time.findIndex((t) => t.slice(0, 10) === ob.day && hourOf(t) === parseInt(ob.t, 10));
          if (j >= 0 && !seen.includes(stamp)) {
            WIND_MODELS.forEach((mod) => {
              const r = modelRow(w.hourly, j, WIND, mod);
              if (r.wind_speed_10m == null) return;
              const dirErr = ob.wd != null && ob.ws >= 8 && r.wind_direction_10m != null ? angleDiff(r.wind_direction_10m, ob.wd) : null;
              learn(mod.key, dirErr, Math.abs(r.wind_speed_10m - ob.ws));
            });
            seen.push(stamp); learned = true;
          }
        }
        const windW = WIND_MODELS.map(modelWeight);
        const hours = [], srcAt = [];
        const n = Math.min(m.hourly.time.length, w.hourly.time.length);
        for (let j = 0; j < n; j++) {
          const mRows = MARINE_MODELS.map((mod) => modelRow(m.hourly, j, MARINE, mod));
          const wRows = WIND_MODELS.map((mod) => modelRow(w.hourly, j, WIND, mod));
          const k = toK(blend(mRows, MARINE, marineW), blend(wRows, WIND, windW));
          if (!k) continue;
          k.model = { ws: k.ws, wd: k.wd };
          // A fresh station reading leans on the hours around it.
          if (ob) {
            const away = (new Date(m.hourly.time[j]) - new Date(`${ob.day}T${ob.t}`)) / 3.6e6;
            if (away >= -0.5 && away <= 2.5) applyObs(k, ob, obsWeight(ob, Math.max(0, away)));
          }
          hours.push({ t: m.hourly.time[j], ...k });
          srcAt.push({ mRows, wRows, windW });
        }
        if (!hours.length) return;
        hours.forEach((k, j) => addTide(hours, k, j));
        // "Now" is the hourly row nearest the clock, with the per-model
        // values behind it kept for the Sources panel.
        let near = 0, nearD = Infinity;
        hours.forEach((k, j) => { const d = Math.abs(new Date(k.t) - nowMs); if (d < nearD) { nearD = d; near = j; } });
        const now = { ...hours[near] };
        const { mRows, wRows } = srcAt[near];
        const windSrc = wRows.map((r, x) => ({ name: WIND_MODELS[x].name, w: +srcAt[near].windW[x].toFixed(2), n: (skill[WIND_MODELS[x].key] || {}).n || 0, ws: r.wind_speed_10m, wd: r.wind_direction_10m })).filter((r) => r.ws != null);
        const swellSrc = mRows.map((r, x) => ({ name: MARINE_MODELS[x].name, w: MARINE_MODELS[x].w, h: r.swell_wave_height ?? r.wave_height, p: r.swell_wave_period ?? r.wave_period, d: r.swell_wave_direction ?? r.wave_direction })).filter((r) => r.h != null && r.h > 0.05);
        // Flag the ones the blend set aside, so the Sources panel can say so.
        const wdOut = outliers(windSrc.map((r) => r.wd), true), wsOut = outliers(windSrc.map((r) => r.ws), false);
        windSrc.forEach((r, x) => { r.out = wdOut.has(x) || wsOut.has(x); });
        const hOut = outliers(swellSrc.map((r) => r.h), false), dOut = outliers(swellSrc.map((r) => r.d).filter((v) => v != null), true);
        swellSrc.forEach((r, x) => { r.out = hOut.has(x) || dOut.has(x); });
        const hs = swellSrc.map((r) => r.h), wss = windSrc.map((r) => r.ws);
        now.src = {
          wind: windSrc, swell: swellSrc,
          windSpread: dirSpread(windSrc.map((r) => r.wd).filter((v) => v != null)),
          wsSpread: wss.length ? Math.max(...wss) - Math.min(...wss) : 0,
          hMin: hs.length ? Math.min(...hs) : null, hMax: hs.length ? Math.max(...hs) : null, hSpread: hs.length ? Math.max(...hs) - Math.min(...hs) : 0,
        };
        if (ob) now.obs = ob;
        now.conf = confidence(now.src, ob, now);
        const sun = w.daily && w.daily.sunrise ? { rise: (w.daily.sunrise[0] || '').slice(11, 16), set: (w.daily.sunset[0] || '').slice(11, 16) } : null;
        next[c.id] = { now, hours, sun, tides: tideEvents(hours), t: now.t };
        when = when || (now.t || '').slice(11, 16);
      });
      if (learned) { saveSkill(); try { localStorage.setItem('surf-skill-seen', JSON.stringify(seen.slice(-200))); } catch {} }
      conditions = next;
      condNote = when ? `Scores from Open-Meteo swell, wind and tide at ${when} local, judged against each spot’s usual best.` : 'Conditions unavailable right now';
      try { localStorage.setItem('surf-cond', JSON.stringify({ v: COND_VER, ids, day: today, t: Date.now(), data: conditions, note: condNote })); } catch {}
    } catch (e) {
      conditions = {};
      condNote = 'Conditions unavailable right now';
    }
  }

  /* ---------- Directions: one button, then choose the app ---------- */

  const PIN_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-5.3-6-10a6 6 0 0 1 12 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg>';
  const goButton = (c) => `<button class="nav" type="button" data-go="${esc(c.id)}">${PIN_SVG}Directions</button>`;

  function openGo(c) {
    const ll = `${c.lat},${c.lng}`;
    clearTimeout(goTimer);
    $('go-sub').textContent = `${c.name} · ${c.town}`;
    $('go-list').innerHTML = [
      ['Google Maps', `https://www.google.com/maps/dir/?api=1&destination=${ll}`, '#4285f4'],
      ['Apple Maps', `https://maps.apple.com/?daddr=${ll}&dirflg=d`, '#8e8e93'],
      ['Waze', `https://waze.com/ul?ll=${ll}&navigate=yes`, '#33ccff'],
    ].map(([name, url, dot]) =>
      `<a class="go-opt" href="${url}" target="_blank" rel="noopener noreferrer"><i style="background:${dot}"></i>${name}<small>Open</small></a>`
    ).join('');
    go.hidden = false;
    requestAnimationFrame(() => go.classList.add('open'));
    $('go-list').querySelector('a').focus();
  }
  function closeGo() {
    if (go.hidden) return;
    go.classList.remove('open');
    goTimer = setTimeout(() => { go.hidden = true; }, 200);
  }

  /* ---------- Grid, grouped by area ---------- */


  function renderChips() {
    chips.innerHTML = ['All', ...AREAS].map((r) =>
      `<button class="chip" type="button" data-area="${esc(r)}" aria-pressed="${r === area}">${esc(r)}</button>`
    ).join('');
  }

  // The tile is the preview; name, place and conditions overlay the bottom.
  const cardHtml = (c) => `
    <button class="cam" type="button" data-id="${esc(c.id)}" aria-label="Watch ${esc(c.name)}, ${esc(c.town)}">
      ${c.thumb ? `<img src="${esc(thumbUrl(c.thumb))}" alt="" loading="lazy" decoding="async" onload="this.classList.add('ready')" onerror="this.remove()">` : ''}
      ${c.type === 'hls' ? `<video muted playsinline preload="none"${c.poster ? ` poster="${esc(c.poster)}"` : ''} aria-hidden="true"></video>` : ''}
      <span class="live"><i></i>Live</span>
      <span class="score-slot">${badge(c)}</span>
      <div class="overlay">
        <div class="name">${esc(c.name)}</div>
        <div class="sub">
          <span class="cond-line">${condText(c)}</span>
          <span class="mini-slot">${miniBars(c)}</span>
        </div>
      </div>
    </button>`;

  // Built once; conditions are patched in later so the tiles keep streaming.
  function renderGrid() {
    grid.innerHTML = AREAS.map((a) => {
      const list = CAMS.filter((c) => c.area === a);
      return `
      <section class="area" data-area="${esc(a)}">
        <div class="area-head">
          <h2>${esc(a)}<small>${list.length} cam${list.length === 1 ? '' : 's'}</small></h2>
          <div class="area-sum"></div>
        </div>
        <div class="cards">${list.map(cardHtml).join('')}</div>
      </section>`;
    }).join('');
  }

  function patchConditions() {
    for (const el of cards()) {
      const c = byId(el.dataset.id);
      el.querySelector('.score-slot').innerHTML = badge(c);
      el.querySelector('.cond-line').innerHTML = condText(c);
      el.querySelector('.mini-slot').innerHTML = miniBars(c);
    }
    const coast = coastTides();
    for (const sec of grid.querySelectorAll('.area')) {
      const best = CAMS.filter((c) => c.area === sec.dataset.area)
        .map((c) => ({ c, r: scoreOf(c) })).filter((x) => x.r)
        .sort((x, y) => y.r.total - x.r.total)[0];
      // Only areas whose tide strays from the coast-wide line get their own.
      const ev = areaTides(sec.dataset.area);
      const tide = tidesDiffer(ev, coast) ? tideTimes(ev) : '';
      sec.querySelector('.area-sum').innerHTML =
        (tide ? `<span class="tide-sum">Tide here: ${esc(tide)}</span>` : '') +
        (best ? `<span>Best now: <b>${esc(best.c.name)}</b> · ${fmt(best.r.total)}/10</span>` : '');
    }
    // One coast-wide tide line in the header, averaged across every cam.
    const tideEl = $('tide-now');
    if (coast) {
      const nowMins = new Date().getHours() * 60 + new Date().getMinutes();
      const ahead = coast.filter((e) => e.mins >= nowMins);
      const list = ahead.length ? ahead : coast;
      tideEl.hidden = false;
      tideEl.innerHTML = `<span class="k">${ahead.length ? 'Tide' : 'Tide today'}</span>` + list.map((e) => `<span>${e.kind} ${e.t}</span>`).join('');
    } else {
      tideEl.hidden = true;
    }
    const top = CAMS.map((c) => ({ c, r: scoreOf(c) })).filter((x) => x.r && x.r.total > 0)
      .sort((x, y) => y.r.total - x.r.total).slice(0, 3);
    const bestEl = $('best');
    bestEl.hidden = !top.length;
    bestEl.innerHTML = top.length
      ? `<span class="best-label">Best right now</span>` + top.map(({ c }) =>
          `<button class="best-chip" type="button" data-open="${esc(c.id)}">${badge(c)}<span>${esc(c.name)}</span></button>`).join('')
      : '';
  }

  function applyFilter() {
    let shown = 0;
    for (const sec of grid.querySelectorAll('.area')) {
      let n = 0;
      for (const el of sec.querySelectorAll('.cam')) {
        const ok = matches(byId(el.dataset.id));
        el.hidden = !ok;
        if (ok) n++;
      }
      sec.hidden = n === 0;
      sec.dataset.count = n;
      shown += n;
    }
    layout.classList.toggle('filtered', area !== 'All' || !!q.value.trim());
    empty.classList.toggle('show', shown === 0 && effectiveView() !== 'map');
    if (map) syncMarkers(true);
    syncTiles();
  }

  /* ---------- Live tiles ---------- */

  // Every HLS card streams while it's on screen (muted, lowest rendition).
  // Off-screen, hidden-tab, data-saver and over-budget tiles fall back to
  // their snapshot.
  function startTile(c) {
    const t = tiles[c.id];
    if (!t || t.active || t.dead) return;
    const video = t.video;
    t.active = true;
    video.muted = true;
    const card = video.closest('.cam');
    const onPlaying = () => { video.classList.add('ready'); card.classList.add('streaming'); };
    video.addEventListener('playing', onPlaying);
    t.cleanup = () => video.removeEventListener('playing', onPlaying);
    const fail = () => { stopTile(c.id); t.dead = true; };

    if (nativeHls) {
      video.addEventListener('error', fail, { once: true });
      video.src = c.embed;
      video.play().catch(() => {});
      return;
    }
    if (!window.Hls || !Hls.isSupported()) { t.active = false; return; }
    t.hls = new Hls(TILE_HLS);
    t.hls.on(Hls.Events.ERROR, (_, data) => {
      if (!data.fatal) return;
      if (data.type === Hls.ErrorTypes.MEDIA_ERROR && t.hls) return t.hls.recoverMediaError();
      fail();
    });
    t.hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
    t.hls.loadSource(c.embed);
    t.hls.attachMedia(video);
  }

  function stopTile(id) {
    const t = tiles[id];
    if (!t || !t.active) return;
    if (t.hls) { try { t.hls.destroy(); } catch {} t.hls = null; }
    if (t.cleanup) { t.cleanup(); t.cleanup = null; }
    t.video.pause();
    t.video.removeAttribute('src');
    t.video.load();
    t.video.classList.remove('ready');
    t.video.closest('.cam').classList.remove('streaming');
    t.active = false;
  }

  // Reconcile every tile with what should be playing right now.
  function syncTiles() {
    let budget = MAX_TILES;
    const listShown = effectiveView() !== 'map';
    for (const c of CAMS) {
      const t = tiles[c.id];
      if (!t) continue;
      const want = !dataSaver && listShown && t.visible && !t.hold && !document.hidden && matches(c) && budget > 0;
      if (want) { budget--; startTile(c); } else stopTile(c.id);
    }
  }

  function setupTiles() {
    const io = new IntersectionObserver((entries) => {
      for (const e of entries) {
        const t = tiles[e.target.dataset.id];
        if (t) t.visible = e.isIntersecting;
      }
      syncTiles();
    }, { rootMargin: '200px 0px' });
    for (const el of cards()) {
      const video = el.querySelector('video');
      if (!video) continue;
      tiles[el.dataset.id] = { video, hls: null, visible: false, active: false, hold: false, dead: false };
      io.observe(el);
    }
    document.addEventListener('visibilitychange', syncTiles);
  }

  /* ---------- Map ---------- */

  const REL_SHORT = { offshore: 'off', onshore: 'on', 'cross-shore': 'cross' };
  const pinIcon = (c) => {
    const r = scoreOf(c), k = conditions[c.id] && conditions[c.id].now;
    const lvl = r ? 'lvl-' + r.level : 'lvl-x';
    const data = k
      ? `<em>${hgt(k.h)}</em> ${Math.round(k.p)} s${k.d != null ? ' ' + dirName(k.d) : ''} · <em>${kts(k.ws)} kts</em> ${dirName(k.wd)}${r ? ' ' + REL_SHORT[r.wind] : ''}`
      : 'no data yet';
    return L.divIcon({
      className: 'pin-wrap',
      html: `<span class="pin ${lvl}">${r ? fmt(r.total) : '·'}</span><span class="tag ${lvl}"><b>${esc(c.name)}</b><i>${data}</i></span>`,
      iconSize: [30, 30],
      iconAnchor: [15, 15],
      popupAnchor: [0, -16],
    });
  };

  const popupHtml = (c) => {
    const cond = condText(c);
    const sum = daySummary(c);
    return `
      <div class="pop-head">
        <div>
          <div class="pop-name">${esc(c.name)}</div>
          <div class="pop-where">${esc(c.zone || c.town)} · ${esc(c.area)}</div>
        </div>
        ${badge(c)}
      </div>
      ${cond ? `<div class="pop-cond">Now ${cond} ${miniBars(c)}</div>` : ''}
      ${tideTimes(tidesFor(c)) ? `<div class="pop-sum">Tide: ${esc(tideTimes(tidesFor(c)))}</div>` : ''}
      ${sum ? `<div class="pop-sum">${esc(sum)}</div>` : ''}
      <div class="pop-actions">
        <button class="pop-btn" type="button" data-open="${esc(c.id)}">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>Watch live
        </button>
        ${goButton(c)}
      </div>`;
  };

  // Pin ↔ card: hovering a card lifts its pin; tapping a pin finds its card.
  function hotPin(id, on) {
    const el = markers[id] && markers[id].getElement && markers[id].getElement();
    if (el) el.classList.toggle('hot', on);
  }
  function findCard(id) {
    if (effectiveView() !== 'split') return;
    const el = grid.querySelector(`.cam[data-id="${CSS.escape(id)}"]`);
    if (!el || el.hidden) return;
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 1600);
  }

  function initMap() {
    map = L.map('map', { zoomControl: true, scrollWheelZoom: true });
    // Esri satellite by default — the imagery reads the beaches best — with
    // plain OpenStreetMap streets as the alternative. Both keyless.
    const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19,
      className: 'osm-tiles',
    });
    const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Imagery &copy; <a href="https://www.esri.com/">Esri</a>, Maxar, Earthstar Geographics, GIS User Community',
      maxZoom: 19,
    });
    let base = 'sat';
    try { base = localStorage.getItem('surf-base2') || 'sat'; } catch {}
    (base === 'osm' ? osm : sat).addTo(map);
    // Wind and swell overlays: animated particles plus labelled arrows, from
    // the same Open-Meteo data as the scores. Reduced-motion gets arrows only.
    windLayer = L.layerGroup();
    swellLayer = L.layerGroup();
    if (!reducedMotion) {
      const PL = makeParticleLayer();
      const phone = matchMedia('(max-width: 640px)').matches;
      windField = new PL({ max: phone ? 450 : 1400, density: 1800, life: 90, fade: 0.9, width: 1.3, min: 0.5,
        speed: (ws) => 0.25 + ws * 0.045, color: windColor });
      swellField = new PL({ max: phone ? 250 : 700, density: 3600, life: 160, fade: 0.95, width: 1.8, min: 0.15,
        speed: (h) => 0.25 + h * 0.3, color: swellColor });
      loadFieldGrid().then(updateFields);
    }
    let overlays = { wind: true, swell: true };
    try { overlays = { ...overlays, ...JSON.parse(localStorage.getItem('surf-overlays2') || '{}') }; } catch {}
    if (overlays.wind) windLayer.addTo(map);
    if (overlays.swell) swellLayer.addTo(map);
    L.control.layers({ 'Satellite': sat, 'Streets': osm }, { 'Wind': windLayer, 'Swell': swellLayer }, { position: 'topright', collapsed: false }).addTo(map);
    map.on('baselayerchange', (e) => { try { localStorage.setItem('surf-base2', e.layer === sat ? 'sat' : 'osm'); } catch {} });
    const saveOverlays = () => { try { localStorage.setItem('surf-overlays2', JSON.stringify({ wind: map.hasLayer(windLayer), swell: map.hasLayer(swellLayer) })); } catch {} };
    map.on('overlayadd overlayremove', saveOverlays);
    // "Open in Windy" follows the map.
    const windy = $('windy');
    const syncWindy = () => { const c = map.getCenter(); windy.href = `https://www.windy.com/-Wind-wind?${c.lat.toFixed(3)},${c.lng.toFixed(3)},${Math.max(5, Math.min(11, map.getZoom()))}`; };
    map.on('moveend', syncWindy);
    // Pin tags only once there's room for them.
    const labels = () => map.getContainer().classList.toggle('labels', map.getZoom() >= 11);
    map.on('zoomend', labels);
    labels();
    buildArrows();

    for (const c of CAMS) {
      markers[c.id] = L.marker([c.lat, c.lng], { icon: pinIcon(c), title: c.name, keyboard: true })
        .bindPopup(() => popupHtml(c), { closeButton: false, maxWidth: 340 })
        .on('click', () => findCard(c.id));
    }
    map.getContainer().addEventListener('click', (e) => {
      const b = e.target.closest('[data-open]');
      if (b) { map.closePopup(); open(b.dataset.open); }
    });
    syncMarkers(true);
  }


  // Show only the markers that pass the current filter; optionally refit.
  function syncMarkers(fit) {
    const shown = [], home = [];
    for (const c of CAMS) {
      const m = markers[c.id];
      if (matches(c)) {
        if (!map.hasLayer(m)) m.addTo(map);
        shown.push([c.lat, c.lng]);
        if (HOME_AREAS.includes(c.area)) home.push([c.lat, c.lng]);
      } else if (map.hasLayer(m)) map.removeLayer(m);
    }
    if (fit && shown.length) {
      const unfiltered = area === 'All' && !q.value.trim();
      const target = unfiltered && home.length ? home : shown;
      if (target.length === 1) map.setView(target[0], 14);
      else map.fitBounds(target, { padding: [40, 40], maxZoom: 14 });
    }
  }

  function refreshPins() {
    if (!map) return;
    for (const c of CAMS) markers[c.id].setIcon(pinIcon(c));
    buildArrows();
  }

  /* ---------- Animated particle field ----------
     A canvas in Leaflet's overlay pane. Each particle reads the local vector
     (inverse-distance blend of the sample points), steps along it, and
     leaves a fading trail — the Windy look, from our own data. */
  // Defined lazily, once Leaflet is loaded.
  let ParticleLayerClass = null;
  function makeParticleLayer() {
    if (ParticleLayerClass) return ParticleLayerClass;
    ParticleLayerClass = L.Layer.extend({
      initialize(opts) { L.setOptions(this, opts); this.samples = []; this._pts = []; this._parts = []; this._raf = 0; },
      onAdd(map) {
        this._map = map;
        this._canvas = L.DomUtil.create('canvas', 'particles leaflet-zoom-hide');
        map.getPanes().overlayPane.appendChild(this._canvas);
        map.on('moveend zoomend resize', this._reset, this);
        this._reset();
        this._start();
      },
      onRemove(map) {
        this._stop();
        map.off('moveend zoomend resize', this._reset, this);
        L.DomUtil.remove(this._canvas);
      },
      setSamples(samples) { this.samples = samples; if (this._map) this._reset(); },
      _reset() {
        const map = this._map, size = map.getSize();
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        this._canvas.width = size.x * dpr; this._canvas.height = size.y * dpr;
        this._canvas.style.width = size.x + 'px'; this._canvas.style.height = size.y + 'px';
        L.DomUtil.setPosition(this._canvas, map.containerPointToLayerPoint([0, 0]));
        this._ctx = this._canvas.getContext('2d');
        this._ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        this._ctx.clearRect(0, 0, size.x, size.y);
        this._w = size.x; this._h = size.y;
        // Project samples to screen space; store velocity as screen-space u,v.
        this._pts = this.samples.map((s) => {
          const p = map.latLngToContainerPoint([s.lat, s.lng]);
          const to = (s.toward) * Math.PI / 180;
          return { x: p.x, y: p.y, u: Math.sin(to) * s.mag, v: -Math.cos(to) * s.mag, mag: s.mag };
        });
        const n = this._pts.length ? Math.min(this.options.max, Math.floor((size.x * size.y) / this.options.density)) : 0;
        this._parts = Array.from({ length: n }, () => this._spawn());
      },
      _spawn() { return { x: Math.random() * this._w, y: Math.random() * this._h, age: Math.floor(Math.random() * this.options.life) }; },
      // Inverse-distance-weighted blend of the sample vectors at (x, y).
      _vel(x, y) {
        let su = 0, sv = 0, sm = 0, sw = 0;
        for (const p of this._pts) {
          const dx = x - p.x, dy = y - p.y;
          const d2 = dx * dx + dy * dy + 400;
          const w = 1 / (d2 * d2);
          su += p.u * w; sv += p.v * w; sm += p.mag * w; sw += w;
        }
        return sw ? { u: su / sw, v: sv / sw, mag: sm / sw } : { u: 0, v: 0, mag: 0 };
      },
      _start() { if (!this._raf) this._raf = requestAnimationFrame(() => this._frame()); },
      _stop() { if (this._raf) cancelAnimationFrame(this._raf); this._raf = 0; },
      _frame() {
        this._raf = 0;
        if (!this._map) return;
        if (document.hidden || !this._pts.length) { this._raf = requestAnimationFrame(() => this._frame()); return; }
        const ctx = this._ctx, o = this.options;
        // Fade what's there, then draw each particle's next step.
        ctx.globalCompositeOperation = 'destination-in';
        ctx.fillStyle = `rgba(0,0,0,${o.fade})`;
        ctx.fillRect(0, 0, this._w, this._h);
        ctx.globalCompositeOperation = 'source-over';
        ctx.lineWidth = o.width;
        ctx.lineCap = 'round';
        for (const p of this._parts) {
          const v = this._vel(p.x, p.y);
          const speed = o.speed(v.mag);
          const len = Math.hypot(v.u, v.v) || 1;
          const nx = p.x + (v.u / len) * speed, ny = p.y + (v.v / len) * speed;
          ctx.strokeStyle = o.color(v.mag);
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(nx, ny); ctx.stroke();
          p.x = nx; p.y = ny; p.age++;
          if (p.age > o.life || nx < 0 || ny < 0 || nx > this._w || ny > this._h || v.mag < o.min) Object.assign(p, this._spawn(), { age: 0 });
        }
        this._raf = requestAnimationFrame(() => this._frame());
      },
    });
    return ParticleLayerClass;
  }

  // Wind: strength palette (light → gale), brisk short trails.
  const windColor = (ws) => (ws < 12 ? 'rgba(158,176,92,0.85)' : ws < 25 ? 'rgba(227,162,58,0.9)' : ws < 40 ? 'rgba(255,130,0,0.95)' : 'rgba(229,72,77,1)');
  // Swell: sea blue, slow long streaks, brighter the bigger it is.
  const swellColor = (h) => `rgba(79,195,220,${Math.min(0.95, 0.35 + h * 0.2)})`;

  // Coarse sample grid along the coast so particles flow between the spots.
  // Wind comes back everywhere; swell only over sea cells (land is null).
  const GRID = [];
  for (let lat = 36.9; lat <= 40.0; lat += 0.3) for (const lng of [-10.3, -9.95, -9.6, -9.25, -8.9]) GRID.push([+lat.toFixed(2), lng]);
  async function loadFieldGrid() {
    const key = 'surf-field', today = new Date().toDateString();
    try {
      const c = JSON.parse(localStorage.getItem(key) || 'null');
      if (c && c.day === today && Date.now() - c.t < COND_TTL) { fieldGrid = c.data; return; }
    } catch {}
    const lat = GRID.map((p) => p[0]).join(','), lng = GRID.map((p) => p[1]).join(',');
    try {
      const [w, m] = await Promise.all([
        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=wind_speed_10m,wind_direction_10m`).then((r) => r.json()),
        fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lng}&current=swell_wave_height,swell_wave_direction,wave_height,wave_direction`).then((r) => r.json()),
      ]);
      const W = asList(w), M = asList(m);
      fieldGrid = GRID.map((p, i) => {
        const wc = W[i] && W[i].current, mc = M[i] && M[i].current;
        return {
          lat: p[0], lng: p[1],
          ws: wc ? wc.wind_speed_10m : null, wd: wc ? wc.wind_direction_10m : null,
          h: mc ? (mc.swell_wave_height ?? mc.wave_height) : null, d: mc ? (mc.swell_wave_direction ?? mc.wave_direction) : null,
        };
      });
      try { localStorage.setItem(key, JSON.stringify({ day: today, t: Date.now(), data: fieldGrid })); } catch {}
    } catch { fieldGrid = []; }
  }
  // Feed both particle layers from the grid plus the per-spot readings.
  function updateFields() {
    if (!windField) return;
    const wind = [], swell = [];
    for (const g of fieldGrid || []) {
      if (g.ws != null && g.wd != null) wind.push({ lat: g.lat, lng: g.lng, toward: g.wd + 180, mag: g.ws });
      if (g.h != null && g.d != null) swell.push({ lat: g.lat, lng: g.lng, toward: g.d + 180, mag: g.h });
    }
    for (const c of CAMS) {
      const k = conditions[c.id] && conditions[c.id].now;
      if (!k) continue;
      const [la, lo] = seaward(c, 4);
      wind.push({ lat: la, lng: lo, toward: k.wd + 180, mag: k.ws });
      if (k.d != null) swell.push({ lat: la, lng: lo, toward: k.d + 180, mag: k.h });
    }
    windField.setSamples(wind);
    swellField.setSamples(swell);
  }

  // The Wind / Swell overlays are the animated particle fields; the numbers
  // live on the pin tags.
  function buildArrows() {
    if (!windLayer) return;
    windLayer.clearLayers();
    swellLayer.clearLayers();
    if (windField) { windLayer.addLayer(windField); swellLayer.addLayer(swellField); }
    updateFields();
  }

  async function showMap() {
    try {
      await loadScript(LIBS.leaflet);
    } catch {
      $('map-hint').textContent = 'Couldn’t load the map.';
      return;
    }
    if (!map) initMap();
    // The pane has just been shown or resized; let layout settle first.
    requestAnimationFrame(() => { map.invalidateSize(); syncMarkers(true); });
  }

  function setView(v) {
    view = v;
    const ev = effectiveView();
    layout.dataset.view = ev;
    for (const b of document.querySelectorAll('.seg button')) b.setAttribute('aria-pressed', b.dataset.view === view);
    try { localStorage.setItem('surf-view', v); } catch {}
    applyFilter();
    if (ev !== 'grid') showMap();
  }

  /* ---------- Viewer ---------- */

  function frameMsg(text) {
    frame.insertAdjacentHTML('beforeend', `<div class="frame-msg">${esc(text)}</div>`);
  }

  const iframeHtml = (url, c) =>
    `<iframe src="${esc(url)}" title="${esc(c.name)} live webcam" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;

  function stopPlayback() {
    if (hls) { try { hls.destroy(); } catch {} hls = null; }
    if (player) { try { player.destroy(); } catch {} player = null; }
    frame.innerHTML = '';
  }

  // A dead or blocked stream falls back to the cam's page when it has one.
