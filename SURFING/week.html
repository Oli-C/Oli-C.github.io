<!DOCTYPE html>
<html lang="en" data-theme="charcoal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>allfield · 7-day surf outlook</title>
<meta name="description" content="Seven-day surf outlook for each cam spot, scored against what the spot likes.">
<link rel="icon" type="image/jpeg" href="../assets/favicon.jpg">
<meta name="theme-color" content="#101820">
<link rel="preload" href="../assets/fonts/anek-kannada-latin.woff2" as="font" type="font/woff2" crossorigin>
<script>
  document.documentElement.setAttribute('data-theme',
    matchMedia('(prefers-color-scheme: dark)').matches ? 'charcoal' : 'light');
</script>
<!-- The toolbar, shared by every surfing page. -->
<link rel="stylesheet" href="toolbar.css">
<link rel="stylesheet" href="account.css">
<style>
  @font-face {
    font-family: 'Anek Kannada';
    font-style: normal;
    font-weight: 400 700;
    font-stretch: 125%;
    font-display: swap;
    /* The font's own metrics leave room for Kannada below the line, so
       Latin caps and digits rode ~0.15em high in every box. Same total
       height, baseline moved so they sit centred. */
    ascent-override: 117%;
    descent-override: 51%;
    src: url('../assets/fonts/anek-kannada-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: 'Anek Kannada';
    font-style: normal;
    font-weight: 400 700;
    font-stretch: 125%;
    font-display: swap;
    /* The font's own metrics leave room for Kannada below the line, so
       Latin caps and digits rode ~0.15em high in every box. Same total
       height, baseline moved so they sit centred. */
    ascent-override: 117%;
    descent-override: 51%;
    src: url('../assets/fonts/anek-kannada-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent: #ff8200;
    --lvl-0: #5c6166; --lvl-1: #8b2f45; --lvl-2: #e3a23a; --lvl-3: #9eb05c; --lvl-4: #ff8200;
    --radius: 10px; --radius-lg: 14px;
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  [data-theme="charcoal"] {
    --bg: #101820; --bg-2: #373a36; --bg-3: #1a232c;
    --fg: #d6d2c4; --fg-muted: #968c83; --accent-ink: var(--accent);
    --border: rgba(214, 210, 196, 0.12); --border-2: rgba(214, 210, 196, 0.22); --border-3: rgba(214, 210, 196, 0.38);
  }
  [data-theme="light"] {
    --accent: #ff6900; --lvl-4: #ff6900;
    --bg: #d7d2cb; --bg-2: #bfb8af; --bg-3: #eae6e0;
    --fg: #101820; --fg-muted: #6e6259; --accent-ink: color-mix(in srgb, var(--accent) 58%, var(--fg));
    --border: rgba(16, 24, 32, 0.12); --border-2: rgba(16, 24, 32, 0.22); --border-3: rgba(16, 24, 32, 0.40);
  }

  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Anek Kannada', system-ui, sans-serif;
    font-stretch: 125%;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    letter-spacing: -0.005em;
  }
  .page {
    max-width: 1800px;   /* same as the cams page, so the toolbar lines up */
    margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 64px max(16px, env(safe-area-inset-left));
  }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  /* The toolbar is toolbar.css, shared with the cams page. */
  .page { padding-top: 0; }
  .status { color: var(--fg-muted); font-size: 12px; line-height: 1.5; margin: 18px 0 0; max-width: 1100px; }

  /* Score colours (same as the cams page): grey flat, red poor, amber fair,
     green good, orange epic. --ink is the text that reads on each. */
  .lvl-0 { --pin: var(--lvl-0); --ink: #fff; }
  .lvl-1 { --pin: var(--lvl-1); --ink: #fff; }
  .lvl-2 { --pin: var(--lvl-2); --ink: #101820; }
  .lvl-3 { --pin: var(--lvl-3); --ink: #101820; }
  .lvl-4 { --pin: var(--lvl-4); --ink: #101820; }
  .lvl-x { --pin: var(--bg-2); --ink: var(--fg-muted); }

  /* Best bets: the week's standouts in one line. */
  .bets { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 0 0 14px; font-size: 13px; color: var(--fg-muted); }
  .bets .k { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  .bet {
    display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: 13px; color: var(--fg); cursor: pointer;
    background: var(--bg-3); border: 1px solid var(--border-2); border-radius: 999px; padding: 4px 10px 4px 4px;
  }
  .bet:hover { border-color: var(--accent); }
  .bet b { display: inline-grid; place-items: center; min-width: 30px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--pin); color: var(--ink); font-size: 12px; }
  .bet small { color: var(--fg-muted); font-size: 12px; }

  /* Tools: Mine / All, edit, legend. */
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 0 12px; }
  .tools .seg { order: 0; }   /* toolbar.css moves the bar's .seg; not this one */
  .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-left: auto; font-size: 11px; color: var(--fg-muted); }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--pin); }
  .legend .unsure i { background: var(--lvl-3); filter: saturate(0.3); }
  .btn {
    font: inherit; font-size: 12px; color: var(--fg); cursor: pointer;
    background: var(--bg-3); border: 1px solid var(--border-2); border-radius: 999px; padding: 4px 11px;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.on { background: var(--accent); border-color: var(--accent); color: #101820; font-weight: 600; }

  /* A section: My spots, or an area. */
  .sec { max-width: 1100px; margin: 0 0 22px; }
  .sec[hidden] { display: none; }
  .sec-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 6px; }
  .sec-head h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
  .sec-head .acct-host { flex-basis: 100%; }
  .sec-head .acct-line { margin-top: 0; }

  /* The heat-map: a row per spot, a tile per day. */
  .grid { display: grid; grid-template-columns: minmax(88px, 190px) repeat(7, minmax(0, 1fr)); gap: 4px; align-items: stretch; }
  .gh { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-muted); text-align: center; padding: 2px 0 3px; line-height: 1.15; }
  .gh b { display: block; font-size: 12px; letter-spacing: 0; text-transform: none; color: var(--fg); font-weight: 600; }
  .gh.today b { color: var(--accent-ink); }
  .nm { display: flex; flex-direction: column; justify-content: center; min-width: 0; color: var(--fg); text-decoration: none; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.15; padding-right: 4px; }
  .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nm small { font-size: 11px; font-weight: 400; color: var(--fg-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nm:hover span { color: var(--accent-ink); }
  .tile {
    position: relative; display: grid; place-items: center; min-height: 46px; padding: 3px 0 9px;
    font: inherit; color: var(--ink); background: var(--pin); border: 0; border-radius: 8px; cursor: pointer;
    /* Less certain days (far off, models disagreeing) go greyer. */
    filter: saturate(calc(0.3 + 0.7 * var(--conf, 1)));
    transition: transform .15s var(--ease), box-shadow .15s var(--ease);
  }
  .tile b { font-size: 15px; font-weight: 700; line-height: 1; }
  .tile em { display: none; font-style: normal; font-size: 9px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; opacity: .85; }
  .tile:hover { transform: translateY(-1px); }
  .tile[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fg); }
  /* When in the day: dawn, morning, afternoon, evening, as little bars. */
  .parts { position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%); display: flex; gap: 2px; align-items: flex-end; height: 7px; }
  .parts i { width: 4px; min-height: 1px; border-radius: 1px; background: var(--ink); opacity: .55; }
  .tile.lvl-x .parts { display: none; }
  @media (min-width: 900px) {
    .tile { min-height: 54px; }
    .tile b { font-size: 17px; }
    .tile em { display: block; }
    .grid { gap: 5px; }
  }

  /* The opened day: the essentials in a line of chips, coloured by how
     they help (green), are so-so (amber) or hurt (red). */
  .dt { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 0 10px; }
  .dt .when { width: 100%; font-size: 12px; color: var(--fg-muted); }
  .dt .when b { color: var(--fg); font-weight: 600; }
  .chip2 { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg); background: var(--bg-3); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; }
  .chip2 small { color: var(--fg-muted); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; }
  .chip2::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--border-3)); flex: none; }
  .chip2.good { --dot: var(--lvl-3); }
  .chip2.ok { --dot: var(--lvl-2); }
  .chip2.bad { --dot: #e0605a; }
  .chip2.lvl-0, .chip2.lvl-1, .chip2.lvl-2, .chip2.lvl-3, .chip2.lvl-4 { --dot: var(--pin); }
  .dt a { font-size: 13px; color: var(--accent-ink); text-decoration: none; margin-left: 4px; }
  .dt a:hover { text-decoration: underline; }

  /* Editing my spots */
  .edit { max-width: 640px; }
  .edit ol { list-style: none; display: grid; gap: 4px; margin: 0 0 14px; }
  .edit li { display: flex; align-items: center; gap: 6px; background: var(--bg-3); border: 1px solid var(--border); border-radius: 10px; padding: 6px 6px 6px 12px; }
  .edit li .n { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; }
  .edit li .n small { display: block; font-size: 11px; font-weight: 400; color: var(--fg-muted); }
  .ib { flex: none; width: 34px; height: 34px; display: inline-grid; place-items: center; font: inherit; font-size: 15px; color: var(--fg); background: var(--bg); border: 1px solid var(--border-2); border-radius: 8px; cursor: pointer; }
  .ib:hover:not([disabled]) { border-color: var(--accent); color: var(--accent-ink); }
  .ib[disabled] { opacity: .35; cursor: default; }
  .edit h3 { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-muted); margin: 10px 0 6px; }
  .adds { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .add { font: inherit; font-size: 13px; color: var(--fg); background: transparent; border: 1px dashed var(--border-3); border-radius: 999px; padding: 4px 11px; cursor: pointer; }
  .add:hover { border-style: solid; border-color: var(--accent); }
  .hint { font-size: 13px; color: var(--fg-muted); background: var(--bg-3); border: 1px dashed var(--border-2); border-radius: 10px; padding: 10px 12px; margin: 0 0 14px; max-width: 1100px; }
  .hint b { color: var(--fg); }
  .empty { display: none; text-align: center; color: var(--fg-muted); padding: 60px 16px; }
  .empty.show { display: block; }

  @media (max-width: 520px) {
    .grid { grid-template-columns: minmax(78px, 30%) repeat(7, minmax(0, 1fr)); gap: 3px; }
    .nm { font-size: 13px; }
    .tile { min-height: 42px; border-radius: 7px; }
    .tile b { font-size: 13px; }
    .gh { font-size: 9px; }
    .gh b { font-size: 11px; }
    .legend { margin-left: 0; }
    /* Best bets: one row to swipe rather than a stack. */
    .bets { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-right: -16px; padding-right: 16px; }
    .bets::-webkit-scrollbar { display: none; }
    .bet { flex: none; }
    .bets .k { flex: none; }
  }
</style>
</head>
<body>
<main class="page">
  <h1 class="sr-only">7-day surf outlook</h1>

  <!-- The toolbar: same markup as the cams page, styled by toolbar.css.
       7-day is lit; Cams / Split / Map open the cams page on that view. -->
  <div class="controls" id="controls">
    <div class="row r1">
      <a class="brand" href="../" title="Back to allfield"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>surf cams<span>.</span></a>
      <label class="search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" enterkeyhint="search" placeholder="Search spots, towns, areas…" autocomplete="off" aria-label="Search spots">
      </label>
      <nav class="seg" id="view-seg" aria-label="View">
        <a href="./?view=grid" title="Cams only">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span>Cams</span>
        </a>
        <a id="seg-split" href="./?view=split" title="Cams beside the map">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>
          <span>Split</span>
        </a>
        <a href="./?view=map" title="Map only">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>
          <span>Map</span>
        </a>
        <a id="seg-week" href="week.html" aria-current="page" title="Seven-day outlook">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          <span>7-day</span>
        </a>
      </nav>
      <button class="more-btn" id="more-btn" type="button" aria-expanded="false" aria-controls="more" aria-label="More options" title="More options">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
    </div>
    <div class="row r2">
      <div class="chips" id="chips" role="group" aria-label="Filter by area"></div>
      <!-- Inline on wider screens; a drop-down from the ⋯ button on phones. -->
      <div class="more" id="more">
        <div class="seg sm" id="units" role="group" aria-label="Height units">
          <button type="button" data-units="m" aria-pressed="true">m</button>
          <button type="button" data-units="ft" aria-pressed="false">ft</button>
        </div>
      </div>
    </div>
    <div class="m-info" id="m-info"></div>
  </div>

  <div class="bets" id="bets"></div>
  <div class="tools" id="tools"></div>
  <div id="list"></div>
  <p class="empty" id="empty">No spots match that filter.</p>
  <p class="status" id="status">Loading forecast…</p>
</main>

<script src="spots.js"></script>
<script src="geo.js"></script>
<script src="score.js"></script>
<script src="toolbar.js"></script>
<script src="account.js"></script>
<script>
  /* Seven days for every spot, as a heat-map: a row per spot, a tile per
     day coloured by its score (the daylight average, same engine as the
     live page), with four little bars for dawn / morning / afternoon /
     evening so you can see when in the day it's on. Greyer tiles are less
     certain. Tap a tile for that day in one line.

     "My spots" (account.js: starred in a spot's viewer, ordered here; kept
     on the account when signed in) come first; Mine / All picks whether
     the rest of the coast shows too. The forecast is the worker's hourly
     build, or the same blend done here if that's unavailable. */
  const DAYS = 7;
  const TTL = 60 * 60 * 1000;   // an hour; forecasts don't change faster than that
  const VER = 5;

  const $ = (id) => document.getElementById(id);
  const list = $('list'), chips = $('chips'), empty = $('empty'), status = $('status'), bets = $('bets'), tools = $('tools');

  const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
  units = store.get('surf-units') === 'ft' ? 'ft' : 'm';
  let area = 'All';
  let scope = store.get('surf-week-scope') === 'all' ? 'all' : 'mine';
  let sel = null;       // the opened tile: { id, i }
  let editing = false;
  let data = {};        // cam id -> { days: [{ date, hours:[k], tides:[], sun, conf }] }

  const byId = (id) => CAMS.find((x) => x.id === id);
  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  /* ---------- Fetch ---------- */
  async function load() {
    await loadSharedSkill();
    const ids = CAMS.map((c) => c.id).join(), today = new Date().toDateString();
    const skillStamp = sharedSkill && sharedSkill.updated || '';
    try {
      const c = JSON.parse(store.get('surf-week') || 'null');
      if (c && c.v === VER && c.ids === ids && c.day === today && c.skill === skillStamp && Date.now() - c.t < TTL) { data = c.data; return; }
    } catch {}
    const keep = (d) => { data = d; store.set('surf-week', JSON.stringify({ v: VER, ids, day: today, skill: skillStamp, t: Date.now(), data })); };
    // First choice: the worker's hourly build, already blended for every
    // spot and day; fall back to fetching and blending here.
    try {
      const r = await fetch(SURF_WORKER + '/forecast');
      if (!r.ok) throw new Error('worker said ' + r.status);
      const fc = await r.json();
      if (fc.v !== 1 || Date.now() - Date.parse(fc.built) > 3 * 3600e3) throw new Error('stale or unknown forecast');
      const next = {};
      for (const c of CAMS) {
        const s = fc.spots[c.id];
        if (!s) throw new Error('spot missing: ' + c.id);
        const from = new Date(Date.now() + s.offset * 1000).toISOString().slice(0, 10);
        next[c.id] = { days: s.days.filter((d) => d.date >= from).slice(0, DAYS).map((d) => ({ date: d.date, hours: d.hours, tides: d.tides, sun: d.sun, conf: d.conf })) };
      }
      return keep(next);
    } catch (e) { console.info('surf: worker forecast unavailable, fetching directly —', e.message); }
    const pts = CAMS.map(offshore);
    const lat = pts.map((p) => p[0]).join(','), lng = pts.map((p) => p[1]).join(',');
    // Same multi-model blend as the live page and the worker.
    const [marine, wind] = await Promise.all([
      fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lng}&hourly=${MARINE.join()}&models=${modelIds(MARINE_MODELS)}&forecast_days=${DAYS}&timezone=auto`).then((r) => r.json()),
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&hourly=${WIND.join()}&models=${modelIds(WIND_MODELS)}&daily=sunrise,sunset&forecast_days=${DAYS}&timezone=auto`).then((r) => r.json()),
    ]);
    if (marine.error || wind.error) throw new Error(marine.reason || wind.reason);
    const M = asList(marine), W = asList(wind);
    // Weights by days ahead: models are trusted by their record that far out.
    const windWL = leadWeights(WIND_MODELS, modelWeight), marineWL = leadWeights(MARINE_MODELS, waveWeight);
    const next = {};
    CAMS.forEach((c, i) => {
      const m = M[i], w = W[i];
      if (!m || !w || !m.hourly || !w.hourly) return;
      const n = Math.min(m.hourly.time.length, w.hourly.time.length);
      const byDate = {};
      const offset = w.utc_offset_seconds || 0;
      for (let j = 0; j < n; j++) {
        const t = m.hourly.time[j], date = t.slice(0, 10), lead = leadOf(t, offset);
        const bh = blendHour(m.hourly, w.hourly, j, windWL[lead], marineWL[lead]);
        if (!bh) continue;
        (byDate[date] = byDate[date] || []).push({ t, ...bh.k });
      }
      const days = Object.keys(byDate).sort().map((date, di) => {
        const hours = byDate[date];
        hours.forEach((k, j) => addTide(hours, k, j));   // tide relative to that day's range
        return { date, hours, tides: tideEvents(hours), sun: sunOf(w, di), conf: dayConfidence(hours, di) };
      });
      next[c.id] = { days };
    });
    keep(next);
  }

  /* ---------- Per-day digest ---------- */
  const avg = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
  const half = (x) => Math.round(x * 2) / 2;
  const mode = (arr) => arr.slice().sort((a, b) => arr.filter((v) => v === a).length - arr.filter((v) => v === b).length).pop();

  // Score every daylight hour: the headline is the daylight average (one good
  // hour doesn't make a good day); the blocks say when in the day.
  const digests = new Map();
  function digest(c, day) {
    if (!day) return null;
    const daylight = day.hours.filter((k) => !isDark(c, k) && hourOf(k.t) >= 5 && hourOf(k.t) < 22);
    const scored = daylight.map((k) => ({ k, r: score(c, k) })).filter((x) => x.r);
    if (!scored.length) return null;
    const blocks = BUCKETS.map((b) => {
      const s = avg(scored.filter((x) => hourOf(x.k.t) >= b.from && hourOf(x.k.t) < b.to).map((x) => x.r.total));
      return { ...b, score: s == null ? null : half(s), level: s == null ? null : levelOf(half(s)) };
    });
    const best = blocks.filter((b) => b.score != null).sort((a, b) => b.score - a.score)[0];
    // Face height at the beach, not offshore swell, so it reads like the apps.
    const fr = scored.map((x) => faceRange(c, x.k));
    const ws = scored.map((x) => x.k.ws);
    const surfs = scored.filter((x) => x.r.surface).map((x) => x.r.surface.i);
    const top = half(avg(scored.map((x) => x.r.total)));
    return {
      top, level: levelOf(top), label: LEVELS[levelOf(top)], best, blocks,
      hMin: Math.min(...fr.map((f) => f[0])), hMax: Math.max(...fr.map((f) => f[1])), p: Math.round(avg(scored.map((x) => x.k.p))),
      dir: mode(scored.map((x) => dirName(x.k.d))), wsMin: kts(Math.min(...ws)), wsMax: kts(Math.max(...ws)), rel: mode(scored.map((x) => x.r.wind)),
      surf: surfs.length ? { most: mode(surfs), best: Math.min(...surfs) } : null,
      tides: day.tides, sun: day.sun, conf: day.conf,
    };
  }
  const digestOf = (c, i) => {
    const key = `${c.id}|${i}|${units}`;
    if (!digests.has(key)) digests.set(key, data[c.id] && data[c.id].days[i] ? digest(c, data[c.id].days[i]) : null);
    return digests.get(key);
  };
  const dates = () => { const any = Object.values(data)[0]; return any ? any.days.map((d) => d.date) : []; };
  const dayName = (iso, i, long) => (i === 0 ? 'Today' : i === 1 && long ? 'Tomorrow' : (long ? ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'] : DOW)[new Date(iso + 'T12:00').getDay()]);

  /* ---------- Render ---------- */
  const q = $('q');
  const matches = (c) => spotMatches(c, q.value, area);   // toolbar.js

  // Best bets: the strongest windows of the week among the spots on show.
  function renderBets(spots) {
    const ds = dates(), cands = [];
    for (const c of spots) ds.forEach((iso, i) => { const d = digestOf(c, i); if (d && d.best) cands.push({ c, i, iso, d, s: d.best.score }); });
    cands.sort((a, b) => b.s - a.s || a.i - b.i);
    const good = cands.filter((x) => x.s > 3.5).slice(0, 3);
    if (!cands.length) { bets.innerHTML = ''; return; }
    const pick = good.length ? good : cands.slice(0, 1);
    bets.innerHTML = `<span class="k">${good.length ? 'Best bets' : 'Quiet week'}</span>` + pick.map((x) =>
      `<button class="bet lvl-${levelOf(x.s)}" type="button" data-id="${esc(x.c.id)}" data-i="${x.i}"><b>${fmt(x.s)}</b>${esc(x.c.name)} <small>${dayName(x.iso, x.i, true)} ${x.d.best.label.toLowerCase()}</small></button>`).join('')
      + (good.length ? '' : '<span>nothing better than this on show</span>');
  }

  function renderTools(hasFavs) {
    tools.innerHTML = `
      ${hasFavs ? `<div class="seg sm" role="group" aria-label="Spots to show">
        <button type="button" data-scope="mine" aria-pressed="${scope === 'mine'}">My spots</button>
        <button type="button" data-scope="all" aria-pressed="${scope === 'all'}">All</button>
      </div>` : ''}
      <button class="btn${editing ? ' on' : ''}" type="button" data-edit>${editing ? 'Done' : hasFavs ? 'Edit my spots' : '★ Pick my spots'}</button>
      <div class="legend" aria-hidden="true">
        ${LEVELS.map((l, i) => `<span class="lvl-${i}"><i></i>${l}</span>`).join('')}
        <span class="unsure"><i></i>greyer = less sure</span>
      </div>`;
  }

  const ARROW = (d) => `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
  function editHtml(favs) {
    const others = CAMS.filter((c) => !favs.includes(c.id) && matches(c));
    return `<section class="sec edit">
      <div class="sec-head"><h2>My spots</h2><div class="acct-host"></div></div>
      ${favs.length ? `<ol>${favs.map((id, n) => { const c = byId(id); return `<li>
        <span class="n">${esc(c.name)}<small>${esc(c.zone || c.town)} · ${esc(c.area)}</small></span>
        <button class="ib" type="button" data-up="${esc(id)}" aria-label="Move ${esc(c.name)} up"${n === 0 ? ' disabled' : ''}>${ARROW('M12 19V5M5 12l7-7 7 7')}</button>
        <button class="ib" type="button" data-down="${esc(id)}" aria-label="Move ${esc(c.name)} down"${n === favs.length - 1 ? ' disabled' : ''}>${ARROW('M12 5v14M5 12l7 7 7-7')}</button>
        <button class="ib" type="button" data-rm="${esc(id)}" aria-label="Remove ${esc(c.name)}">✕</button>
      </li>`; }).join('')}</ol>` : '<p class="hint">No spots yet. Add some below: they’ll lead this page, in your order.</p>'}
      <h3>Add spots</h3>
      ${AREAS.map((a) => { const l = others.filter((c) => c.area === a); return l.length ? `<div class="adds">${l.map((c) => `<button class="add" type="button" data-add="${esc(c.id)}">+ ${esc(c.name)}</button>`).join('')}</div>` : ''; }).join('')}
    </section>`;
  }

  function gridHtml(spots) {
    const ds = dates();
    const head = `<div></div>` + ds.map((iso, i) => `<div class="gh${i === 0 ? ' today' : ''}">${dayName(iso, i)}<b>${new Date(iso + 'T12:00').getDate()}</b></div>`).join('');
    return `<div class="grid">${head}${spots.map((c) => {
      const tiles = ds.map((iso, i) => {
        const d = digestOf(c, i), on = sel && sel.id === c.id && sel.i === i;
        const parts = d ? `<span class="parts" aria-hidden="true">${d.blocks.map((b) => `<i style="height:${b.score == null ? 1 : Math.max(1, b.score * 10)}%"></i>`).join('')}</span>` : '';
        return `<button class="tile lvl-${d ? d.level : 'x'}" type="button" data-id="${esc(c.id)}" data-i="${i}" aria-pressed="${on}"
          aria-label="${esc(c.name)}, ${dayName(iso, i, true)}: ${d ? `${fmt(d.top)} ${d.label}` : 'no forecast'}" style="--conf:${d && d.conf != null ? d.conf : 1}">
          <span><b>${d ? fmt(d.top) : '–'}</b><em>${d ? d.label : ''}</em></span>${parts}</button>`;
      }).join('');
      return `<a class="nm" href="./#${esc(c.id)}" title="Open ${esc(c.name)}"><span>${esc(c.name)}</span><small>${esc(c.zone && c.zone !== c.name ? c.zone : c.town)}</small></a>${tiles}${sel && sel.id === c.id ? detailHtml(c, sel.i) : ''}`;
    }).join('')}</div>`;
  }

  // One day at one spot, in a line: when it's best, size, wind, surface,
  // tide, light and how sure we are, each marked good / so-so / bad.
  function detailHtml(c, i) {
    const d = digestOf(c, i), iso = dates()[i];
    if (!d) return `<div class="dt"><span class="when">${dayName(iso, i, true)}: no forecast.</span></div>`;
    const size = Math.abs(d.hMax - d.hMin) < 0.25 ? hgt((d.hMin + d.hMax) / 2) : rng(d.hMin.toFixed(1), d.hMax.toFixed(1));
    const [lo, hi] = c.best.size;
    const sizeCls = d.hMax < lo * 0.6 || d.hMin > hi * 1.6 ? 'bad' : d.hMax < lo || d.hMin > hi ? 'ok' : 'good';
    const wind = d.wsMin === d.wsMax ? `${d.wsMin} kts` : `${d.wsMin}–${d.wsMax} kts`;
    const windCls = d.wsMax <= 6 || d.rel === 'offshore' ? 'good' : d.rel === 'cross-shore' && d.wsMax <= 14 ? 'ok' : d.wsMax <= 8 ? 'ok' : 'bad';
    const surfCls = !d.surf ? '' : d.surf.most <= 1 ? 'good' : d.surf.most === 2 ? 'ok' : 'bad';
    const confCls = d.conf == null ? '' : d.conf >= 0.75 ? 'good' : d.conf >= 0.45 ? 'ok' : 'bad';
    const tide = d.tides && d.tides.length ? d.tides.map((e) => `${e.kind === 'High' ? 'High' : 'Low'} ${fmtMins(e.mins)}`).join(' · ') : '';
    const best = d.best;
    return `<div class="dt">
      <span class="when"><b>${esc(c.name)}, ${dayName(iso, i, true)}</b> · ${fmt(d.top)} ${d.label} over the day${best ? `, best ${best.label.toLowerCase()} ${String(best.from).padStart(2, '0')}–${String(best.to).padStart(2, '0')} (${fmt(best.score)})` : ''}</span>
      <span class="chip2 ${sizeCls}"><small>Waves</small>${size} · ${d.p} s ${esc(d.dir)}</span>
      <span class="chip2 ${windCls}"><small>Wind</small>${wind} ${esc(d.rel.replace('-shore', ''))}</span>
      ${d.surf ? `<span class="chip2 ${surfCls}"><small>Surface</small>${SURFACES[d.surf.most]}${d.surf.best < d.surf.most ? `, ${SURFACES[d.surf.best].toLowerCase()} at best` : ''}</span>` : ''}
      ${tide ? `<span class="chip2"><small>Tide</small>${tide}</span>` : ''}
      ${d.sun ? `<span class="chip2"><small>Light</small>${d.sun.rise}–${d.sun.set}</span>` : ''}
      ${d.conf != null ? `<span class="chip2 ${confCls}"><small>Forecast</small>${confWord(d.conf)} confidence</span>` : ''}
      <a href="./#${esc(c.id)}">Open spot →</a>
    </div>`;
  }

  function renderList() {
    const favs = Account.favs.list(), shownFavs = favs.map(byId).filter((c) => c && matches(c));
    const rest = CAMS.filter((c) => !favs.includes(c.id) && matches(c));
    const showRest = !favs.length || scope === 'all';
    renderTools(favs.length > 0);
    if (editing) {
      list.innerHTML = editHtml(favs);
      bets.innerHTML = '';
      empty.classList.remove('show');
    } else {
      let html = '';
      if (shownFavs.length) html += `<section class="sec"><div class="sec-head"><h2>My spots</h2><div class="acct-host"></div></div>${gridHtml(shownFavs)}</section>`;
      else if (!favs.length) html += `<p class="hint"><b>Make this your list:</b> star the spots you surf (★ in a spot’s viewer, or “Pick my spots” here). They’ll lead this page in your order, and follow your account onto every device.</p>`;
      if (showRest) html += AREAS.map((a) => { const l = rest.filter((c) => c.area === a); return l.length ? `<section class="sec"><div class="sec-head"><h2>${esc(a)}</h2></div>${gridHtml(l)}</section>` : ''; }).join('');
      list.innerHTML = html;
      renderBets(showRest ? [...shownFavs, ...rest] : shownFavs);
      empty.classList.toggle('show', !shownFavs.length && !(showRest && rest.length) && !!(q.value.trim() || area !== 'All'));
    }
    const host = list.querySelector('.acct-host');
    if (host) Account.mount(host, { reason: 'to keep your spots on every device.', onChange: () => renderList() });
  }

  function renderChips() {
    chips.innerHTML = ['All', ...AREAS].map((a) => `<button class="chip" type="button" data-area="${esc(a)}" aria-pressed="${a === area}">${esc(a)}</button>`).join('');
  }

  function render() { renderChips(); renderList(); }

  /* ---------- Wiring ---------- */
  function openTile(id, i) {
    sel = sel && sel.id === id && sel.i === i ? null : { id, i };
    renderList();
    const t = list.querySelector(`.tile[data-id="${CSS.escape(id)}"][data-i="${i}"]`);
    if (t && sel) t.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  list.addEventListener('click', (e) => {
    const t = e.target.closest('.tile');
    if (t) return openTile(t.dataset.id, +t.dataset.i);
    const b = e.target.closest('[data-up], [data-down], [data-rm], [data-add]');
    if (!b) return;
    const l = Account.favs.list();
    if (b.dataset.add) l.push(b.dataset.add);
    else if (b.dataset.rm) l.splice(l.indexOf(b.dataset.rm), 1);
    else {
      const id = b.dataset.up || b.dataset.down, n = l.indexOf(id), m = n + (b.dataset.up ? -1 : 1);
      if (m < 0 || m >= l.length) return;
      [l[n], l[m]] = [l[m], l[n]];
    }
    Account.favs.save(l);
  });
  bets.addEventListener('click', (e) => { const b = e.target.closest('.bet'); if (b) openTile(b.dataset.id, +b.dataset.i); });
  tools.addEventListener('click', (e) => {
    const s = e.target.closest('[data-scope]');
    if (s) { scope = s.dataset.scope; store.set('surf-week-scope', scope); return renderList(); }
    if (e.target.closest('[data-edit]')) { editing = !editing; sel = null; renderList(); }
  });
  Account.favs.onChange(() => renderList());
  q.addEventListener('input', renderList);
  chips.addEventListener('click', (e) => { const b = e.target.closest('.chip'); if (b) { area = b.dataset.area; render(); } });
  $('units').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-units]');
    if (!b) return;
    units = b.dataset.units === 'ft' ? 'ft' : 'm';
    for (const x of $('units').querySelectorAll('button')) x.setAttribute('aria-pressed', x.dataset.units === units);
    store.set('surf-units', units);
    render();
  });
  for (const x of $('units').querySelectorAll('button')) x.setAttribute('aria-pressed', x.dataset.units === units);

  renderChips();
  Account.favs.sync();
  load().then(() => {
    const ds = dates();
    status.textContent = ds.length ? `Each tile is that day’s daylight average; the bars under the score are dawn, morning, afternoon and evening. Blended from ${WIND_MODELS.length} wind and ${MARINE_MODELS.filter((m) => !m.ocean).length} wave models, each weighted by how accurate it’s been that many days ahead.` : 'Forecast unavailable right now.';
    render();
  }).catch(() => { status.textContent = 'Forecast unavailable right now.'; });
</script>
</body>
</html>
