<!DOCTYPE html>
<html lang="en" data-theme="charcoal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>allfield · 7-day surf outlook</title>
<meta name="description" content="Seven-day surf outlook for each cam spot, scored against what the spot likes.">
<link rel="icon" type="image/jpeg" href="../assets/favicon.jpg">
<meta name="theme-color" content="#101820">
<link rel="preload" href="../assets/fonts/anek-kannada-latin.woff2" as="font" type="font/woff2" crossorigin>
<script>
  document.documentElement.setAttribute('data-theme',
    matchMedia('(prefers-color-scheme: dark)').matches ? 'charcoal' : 'light');
</script>
<!-- The toolbar, shared by every surfing page. -->
<link rel="stylesheet" href="toolbar.css">
<style>
  @font-face {
    font-family: 'Anek Kannada';
    font-style: normal;
    font-weight: 400 700;
    font-stretch: 125%;
    font-display: swap;
    /* The font's own metrics leave room for Kannada below the line, so
       Latin caps and digits rode ~0.15em high in every box. Same total
       height, baseline moved so they sit centred. */
    ascent-override: 117%;
    descent-override: 51%;
    src: url('../assets/fonts/anek-kannada-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: 'Anek Kannada';
    font-style: normal;
    font-weight: 400 700;
    font-stretch: 125%;
    font-display: swap;
    /* The font's own metrics leave room for Kannada below the line, so
       Latin caps and digits rode ~0.15em high in every box. Same total
       height, baseline moved so they sit centred. */
    ascent-override: 117%;
    descent-override: 51%;
    src: url('../assets/fonts/anek-kannada-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent: #ff8200;
    --lvl-0: #5c6166; --lvl-1: #8b2f45; --lvl-2: #e3a23a; --lvl-3: #9eb05c; --lvl-4: #ff8200;
    --radius: 10px; --radius-lg: 14px;
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  [data-theme="charcoal"] {
    --bg: #101820; --bg-2: #373a36; --bg-3: #1a232c;
    --fg: #d6d2c4; --fg-muted: #968c83; --accent-ink: var(--accent);
    --border: rgba(214, 210, 196, 0.12); --border-2: rgba(214, 210, 196, 0.22); --border-3: rgba(214, 210, 196, 0.38);
  }
  [data-theme="light"] {
    --accent: #ff6900; --lvl-4: #ff6900;
    --bg: #d7d2cb; --bg-2: #bfb8af; --bg-3: #eae6e0;
    --fg: #101820; --fg-muted: #6e6259; --accent-ink: color-mix(in srgb, var(--accent) 58%, var(--fg));
    --border: rgba(16, 24, 32, 0.12); --border-2: rgba(16, 24, 32, 0.22); --border-3: rgba(16, 24, 32, 0.40);
  }

  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Anek Kannada', system-ui, sans-serif;
    font-stretch: 125%;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    letter-spacing: -0.005em;
  }
  .page {
    max-width: 1800px;   /* same as the cams page, so the toolbar lines up */
    margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 64px max(16px, env(safe-area-inset-left));
  }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  /* The toolbar is toolbar.css, shared with the cams page. */
  .page { padding-top: 0; }
  .status { color: var(--fg-muted); font-size: 12px; margin: -4px 0 14px; }

  /* Day picker: part of the sticky bar, under the areas. */
  .days { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-top: 8px; }
  @media (min-width: 1100px) { .days { order: 9; flex: 1 0 100%; margin-top: 0; } }
  .days::-webkit-scrollbar { display: none; }
  .day {
    flex: 1 0 auto; min-width: 64px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font: inherit; color: var(--fg-muted);
    background: var(--bg-3); border: 1px solid var(--border-2); border-radius: var(--radius);
    padding: 5.5px 8px 5.5px; cursor: pointer;
    transition: border-color .2s var(--ease), background .2s var(--ease), color .2s var(--ease);
  }
  .day small { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
  .day b { font-size: 14px; font-weight: 600; color: var(--fg); }
  .day .score { margin-top: 3px; }
  .day[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--bg-3)); color: var(--fg); }
  /* Far-off or disputed days fade; --conf is set per element */
  .day .score, .cell .score, .cell .bar { opacity: var(--conf, 1); }
  .day .conf { font-size: 9px; color: var(--fg-muted); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 2px; }
  .confn { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--pin); }
  /* Score badge */
  .lvl-0 { --pin: var(--lvl-0); --ink: #fff; }
  .lvl-1 { --pin: var(--lvl-1); --ink: #fff; }
  .lvl-2 { --pin: var(--lvl-2); --ink: #101820; }
  .lvl-3 { --pin: var(--lvl-3); --ink: #101820; }
  .lvl-4 { --pin: var(--lvl-4); --ink: #101820; }
  .lvl-x { --pin: var(--bg-2); --ink: var(--fg-muted); }
  .score {
    display: inline-flex; align-items: baseline; gap: 4px; color: var(--ink); background: var(--pin);
    border-radius: 7px; padding: 2.5px 7px 2.5px; white-space: nowrap; line-height: 1;
  }
  .score b { font-size: 14px; font-weight: 700; }
  .score small { font-size: 9px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }

  /* Areas and spot rows */
  .area { margin-bottom: 24px; }
  .area[hidden] { display: none; }
  .area-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }
  .area-head h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
  .area-head .sum { color: var(--fg-muted); font-size: 13px; text-align: right; }
  .area-head .sum b { color: var(--fg); font-weight: 600; }

  .spot {
    display: grid;
    grid-template-columns: minmax(140px, 220px) 1fr;
    gap: 6px 14px;
    align-items: center;
    padding: 10px 12px;
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    margin-bottom: 8px;
  }
  .spot[hidden] { display: none; }
  .spot-name { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .spot-name a { color: inherit; text-decoration: none; }
  .spot-name a:hover { color: var(--accent-ink); }
  .spot-zone { color: var(--fg-muted); font-size: 12px; margin-top: 1px; }
  .week {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
  }
  .cell {
    position: relative;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font: inherit; color: var(--fg-muted);
    background: transparent; border: 1px solid transparent; border-radius: 8px;
    padding: 5.5px 2px 5.5px; cursor: pointer;
    transition: border-color .2s var(--ease), background .2s var(--ease);
  }
  .cell small { font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; }
  .cell .bar { width: 60%; height: 5px; border-radius: 3px; background: var(--bg-2); overflow: hidden; }
  .cell .bar i { display: block; height: 100%; background: var(--pin, var(--bg-2)); }
  .cell:hover { border-color: var(--border-2); }
  .cell[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .detail {
    grid-column: 1 / -1;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px;
    font-size: 13px; color: var(--fg-muted);
    padding-top: 6px; border-top: 1px solid var(--border);
  }
  .detail b { color: var(--fg); font-weight: 600; }
  .detail .win { display: inline-flex; align-items: center; gap: 6px; }
  .bars { display: inline-flex; gap: 3px; align-items: flex-end; height: 18px; }
  .bars i { display: block; width: 7px; min-height: 2px; border-radius: 2px; background: var(--pin, var(--bg-2)); }
  .empty { display: none; text-align: center; color: var(--fg-muted); padding: 60px 16px; }
  .empty.show { display: block; }

  @media (max-width: 760px) {
    .spot { grid-template-columns: 1fr; }
    .spot-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .cell { padding: 5px 0 4px; }
    .cell .score { padding: 1.5px 5px 1.5px; } .cell .score b { font-size: 12px; } .cell .score small { display: none; }
    .day { min-width: 56px; }
  }
</style>
</head>
<body>
<main class="page">
  <h1 class="sr-only">7-day surf outlook</h1>

  <!-- The toolbar: same markup as the cams page, styled by toolbar.css.
       7-day is lit; Cams / Split / Map open the cams page on that view. -->
  <div class="controls" id="controls">
    <div class="row r1">

    <div class="row r2">

      <!-- Inline on wider screens; a drop-down from the ⋯ button on phones. -->

<script src="spots.js"></script>
<script src="geo.js"></script>
<script src="score.js"></script>
<script src="toolbar.js"></script>
<script>
  /* Seven days for every spot. For each day we score every daylight hour
     against the spot (same engine as the live page), then take the best
     three-hour window as the day's headline and keep the four dawn→evening
     blocks for the strip. Open-Meteo gives us 7 days of hourly marine and
     wind in two calls. */
  const DAYS = 7;
  const TTL = 60 * 60 * 1000;   // an hour; forecasts don't change faster than that
  const VER = 5;

  const $ = (id) => document.getElementById(id);
  const list = $('list'), daysEl = $('days'), chips = $('chips'), empty = $('empty'), status = $('status');

  try { units = localStorage.getItem('surf-units') === 'ft' ? 'ft' : 'm'; } catch {}
  let area = 'All';
  let dayIdx = 0;
  let data = {};      // cam id -> { days: [{ date, hours:[k], tides:[], sun }], }

  const byId = (id) => CAMS.find((x) => x.id === id);
  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const dayLabel = (iso, i) => {
    const d = new Date(iso + 'T12:00');
    return { small: i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : DOW[d.getDay()], big: `${d.getDate()}/${d.getMonth() + 1}` };
  };

  /* ---------- Fetch ---------- */
  async function load() {
    await loadSharedSkill();
    const ids = CAMS.map((c) => c.id).join(), today = new Date().toDateString();
    const skillStamp = sharedSkill && sharedSkill.updated || '';
    try {
      const c = JSON.parse(localStorage.getItem('surf-week') || 'null');
      if (c && c.v === VER && c.ids === ids && c.day === today && c.skill === skillStamp && Date.now() - c.t < TTL) { data = c.data; return; }
    } catch {}
    const keep = (d) => { data = d; try { localStorage.setItem('surf-week', JSON.stringify({ v: VER, ids, day: today, skill: skillStamp, t: Date.now(), data })); } catch {} };
    // First choice: the worker's hourly build, already blended for every
    // spot and day; fall back to fetching and blending here.
    try {
      const r = await fetch(SURF_WORKER + '/forecast');
      if (!r.ok) throw new Error('worker said ' + r.status);
      const fc = await r.json();
      if (fc.v !== 1 || Date.now() - Date.parse(fc.built) > 3 * 3600e3) throw new Error('stale or unknown forecast');
      const next = {};
      for (const c of CAMS) {
        const s = fc.spots[c.id];
        if (!s) throw new Error('spot missing: ' + c.id);
        const from = new Date(Date.now() + s.offset * 1000).toISOString().slice(0, 10);
        next[c.id] = { days: s.days.filter((d) => d.date >= from).slice(0, DAYS).map((d) => ({ date: d.date, hours: d.hours, tides: d.tides, sun: d.sun, conf: d.conf })) };
      }
      return keep(next);
    } catch (e) { console.info('surf: worker forecast unavailable, fetching directly —', e.message); }
    const pts = CAMS.map(offshore);
    const lat = pts.map((p) => p[0]).join(','), lng = pts.map((p) => p[1]).join(',');
    // Same multi-model blend as the live page: every wind and wave model's
    // hourly series, outliers set aside, weighted (wind weights include what
    // the live page has learned from the stations on this device).
    const [marine, wind] = await Promise.all([
      fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lng}&hourly=${MARINE.join()}&models=${modelIds(MARINE_MODELS)}&forecast_days=${DAYS}&timezone=auto`).then((r) => r.json()),
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&hourly=${WIND.join()}&models=${modelIds(WIND_MODELS)}&daily=sunrise,sunset&forecast_days=${DAYS}&timezone=auto`).then((r) => r.json()),
    ]);
    if (marine.error || wind.error) throw new Error(marine.reason || wind.reason);
    const M = asList(marine), W = asList(wind);
    // Weights by days ahead: models are trusted by their record that far out.
    const windWL = leadWeights(WIND_MODELS, modelWeight), marineWL = leadWeights(MARINE_MODELS, waveWeight);
    const next = {};
    CAMS.forEach((c, i) => {
      const m = M[i], w = W[i];
      if (!m || !w || !m.hourly || !w.hourly) return;
      const n = Math.min(m.hourly.time.length, w.hourly.time.length);
      const byDate = {};
      const offset = w.utc_offset_seconds || 0;
      for (let j = 0; j < n; j++) {
        const t = m.hourly.time[j], date = t.slice(0, 10), lead = leadOf(t, offset);
        const bh = blendHour(m.hourly, w.hourly, j, windWL[lead], marineWL[lead]);
        if (!bh) continue;
        (byDate[date] = byDate[date] || []).push({ t, ...bh.k });
      }
      const days = Object.keys(byDate).sort().map((date, di) => {
        const hours = byDate[date];
        hours.forEach((k, j) => addTide(hours, k, j));   // tide relative to that day's range
        const sun = sunOf(w, di);
        return { date, hours, tides: tideEvents(hours), sun, conf: dayConfidence(hours, di) };
      });
      next[c.id] = { days };
    });
    data = next;
    try { localStorage.setItem('surf-week', JSON.stringify({ v: VER, ids, day: today, skill: skillStamp, t: Date.now(), data })); } catch {}
  }

  /* ---------- Per-day digest ---------- */
  const avg = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
  const half = (x) => Math.round(x * 2) / 2;

  // Score every daylight hour; headline = best dawn→evening block.
  function digest(c, day) {
    if (!day) return null;
    const daylight = day.hours.filter((k) => k.day !== 0 && hourOf(k.t) >= 6 && hourOf(k.t) < 20);
    const scored = daylight.map((k) => ({ k, r: score(c, k) })).filter((x) => x.r);
    if (!scored.length) return null;
    const blocks = BUCKETS.map((b) => {
      const rows = scored.filter((x) => hourOf(x.k.t) >= b.from && hourOf(x.k.t) < b.to);
      const s = avg(rows.map((x) => x.r.total));
      return { ...b, score: s == null ? null : half(s), level: s == null ? null : levelOf(half(s)) };
    });
    const best = blocks.filter((b) => b.score != null).sort((a, b) => b.score - a.score)[0];
    // Face height at the beach, not offshore swell, so it reads like the apps.
    const fr = scored.map((x) => faceRange(c, x.k));
    const hs = [Math.min(...fr.map((f) => f[0])), Math.max(...fr.map((f) => f[1]))], ps = scored.map((x) => x.k.p), ws = scored.map((x) => x.k.ws);
    // Dominant wind relation and swell direction across the day
    const mode = (arr) => arr.slice().sort((a, b) => arr.filter((v) => v === a).length - arr.filter((v) => v === b).length).pop();
    const rel = mode(scored.map((x) => x.r.wind));
    const dir = mode(scored.map((x) => dirName(x.k.d)));
    // How clean it'll mostly be over the daylight hours, and the cleanest it gets.
    const surfs = scored.filter((x) => x.r.surface).map((x) => x.r.surface.i);
    const surf = surfs.length ? { most: mode(surfs), best: Math.min(...surfs) } : null;
    // Headline = the daylight average, not the peak block; the best window
    // is named in the detail. Averaging keeps a day with one good hour honest.
    const top = half(avg(scored.map((x) => x.r.total)));
    return {
      top, level: levelOf(top), label: LEVELS[levelOf(top)], best, blocks,
      hMin: Math.min(...hs), hMax: Math.max(...hs), p: Math.round(avg(ps)), dir,
      wsMin: kts(Math.min(...ws)), wsMax: kts(Math.max(...ws)), rel, surf,
      tides: day.tides, sun: day.sun, conf: day.conf,
    };
  }
  const digestOf = (c, i) => (data[c.id] && data[c.id].days[i] ? digest(c, data[c.id].days[i]) : null);

  const badge = (d) => (d
    ? `<span class="score lvl-${d.level}"><b>${fmt(d.top)}</b><small>${d.label}</small></span>`
    : `<span class="score lvl-x"><b>–</b><small>n/a</small></span>`);
  const bars = (d) => (d ? `<span class="bars" aria-hidden="true">${d.blocks.map((b) => `<i class="${b.level == null ? 'lvl-x' : 'lvl-' + b.level}" style="height:${b.score == null ? 2 : Math.max(2, b.score * 10)}%"></i>`).join('')}</span>` : '');

  /* ---------- Render ---------- */
  const dates = () => { const any = Object.values(data)[0]; return any ? any.days.map((d) => d.date) : []; };
  const q = $('q');
  const matches = (c) => spotMatches(c, q.value, area);   // toolbar.js

  function renderDays() {
    const ds = dates();
    // Coast-wide headline per day: the best spot's score
    daysEl.innerHTML = ds.map((iso, i) => {
      const l = dayLabel(iso, i);
      const ds = CAMS.map((c) => digestOf(c, i)).filter(Boolean);
      const best = ds.slice().sort((a, b) => b.top - a.top)[0];
      const conf = ds.length ? ds.reduce((a, d) => a + (d.conf == null ? 0.5 : d.conf), 0) / ds.length : null;
      return `<button class="day" type="button" data-i="${i}" aria-pressed="${i === dayIdx}" style="--conf:${conf == null ? 1 : 0.55 + 0.45 * conf}"><small>${l.small}</small><b>${l.big}</b>${badge(best)}<small class="conf">${conf == null ? '' : confWord(conf)}</small></button>`;
    }).join('');
  }

  function renderChips() {
    chips.innerHTML = ['All', ...AREAS].map((a) => `<button class="chip" type="button" data-area="${esc(a)}" aria-pressed="${a === area}">${esc(a)}</button>`).join('');
  }

  function detailHtml(c, d) {
    if (!d) return `<div class="detail">No forecast for this day.</div>`;
    const tide = d.tides && d.tides.length ? d.tides.map((e) => `${e.kind} ${fmtMins(e.mins)}`).join(' · ') : '';
    const size = Math.abs(d.hMax - d.hMin) < 0.25 ? hgt((d.hMin + d.hMax) / 2) : `${hgt(d.hMin)}–${hgt(d.hMax)}`;
    const wind = d.wsMin === d.wsMax ? `${d.wsMin} kts` : `${d.wsMin}–${d.wsMax} kts`;
    return `<div class="detail">
      <span class="win">${bars(d)}${d.best ? `Best <b>${d.best.label.toLowerCase()}</b> (${fmt(d.best.score)})` : ''}</span>
      <span>Swell <b>${size}</b> at <b>${d.p} s</b> from <b>${d.dir}</b></span>
      <span>Wind <b>${wind}</b> ${d.rel}</span>
      ${d.surf ? `<span>Surface <b>mostly ${SURFACES[d.surf.most].toLowerCase()}</b>${d.surf.best < d.surf.most ? `, ${SURFACES[d.surf.best].toLowerCase()} at best` : ''}</span>` : ''}
      ${tide ? `<span>Tide <b>${tide}</b></span>` : ''}
      ${d.sun ? `<span>Light <b>${d.sun.rise}–${d.sun.set}</b></span>` : ''}
      ${d.conf != null ? `<span class="confn lvl-${d.conf >= 0.75 ? 3 : d.conf >= 0.45 ? 2 : 1}">${confWord(d.conf)} confidence</span>` : ''}
    </div>`;
  }

  function renderList() {
    const ds = dates();
    let shown = 0;
    list.innerHTML = AREAS.map((a) => {
      const cams = CAMS.filter((c) => c.area === a && matches(c));
      if (!cams.length) return '';
      shown += cams.length;
      const bestToday = cams.map((c) => ({ c, d: digestOf(c, dayIdx) })).filter((x) => x.d).sort((x, y) => y.d.top - x.d.top)[0];
      return `<section class="area">
        <div class="area-head"><h2>${esc(a)}</h2><div class="sum">${bestToday ? `Best: <b>${esc(bestToday.c.name)}</b> · ${fmt(bestToday.d.top)}/10` : ''}</div></div>
        ${cams.map((c) => {
          const cells = ds.map((iso, i) => {
            const d = digestOf(c, i), l = dayLabel(iso, i);
            return `<button class="cell ${d ? 'lvl-' + d.level : 'lvl-x'}" type="button" data-i="${i}" aria-pressed="${i === dayIdx}" title="${l.small} ${l.big}${d && d.conf != null ? ` · ${confWord(d.conf)} confidence` : ''}" style="--conf:${d && d.conf != null ? 0.55 + 0.45 * d.conf : 1}">
              <small>${i === 0 ? 'Today' : DOW[new Date(iso + 'T12:00').getDay()]}</small>${badge(d)}<span class="bar"><i style="width:${d ? d.top * 10 : 0}%"></i></span>
            </button>`;
          }).join('');
          return `<article class="spot" data-id="${esc(c.id)}">
            <div class="spot-head"><div><div class="spot-name"><a href="./#${esc(c.id)}">${esc(c.name)}</a></div><div class="spot-zone">${esc(c.zone || c.town)}</div></div></div>
            <div class="week">${cells}</div>
            ${detailHtml(c, digestOf(c, dayIdx))}
          </article>`;
        }).join('')}
      </section>`;
    }).join('');
    empty.classList.toggle('show', shown === 0);
  }

  function render() { renderDays(); renderChips(); renderList(); }

  /* ---------- Wiring ---------- */
  daysEl.addEventListener('click', (e) => { const b = e.target.closest('.day'); if (b) { dayIdx = +b.dataset.i; render(); } });
  list.addEventListener('click', (e) => { const b = e.target.closest('.cell'); if (b) { dayIdx = +b.dataset.i; render(); } });
  q.addEventListener('input', renderList);
  chips.addEventListener('click', (e) => { const b = e.target.closest('.chip'); if (b) { area = b.dataset.area; render(); } });
  $('units').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-units]');
    if (!b) return;
    units = b.dataset.units === 'ft' ? 'ft' : 'm';
    for (const x of $('units').querySelectorAll('button')) x.setAttribute('aria-pressed', x.dataset.units === units);
    try { localStorage.setItem('surf-units', units); } catch {}
    render();
  });
  for (const x of $('units').querySelectorAll('button')) x.setAttribute('aria-pressed', x.dataset.units === units);

  renderChips();
  load().then(() => {
    const ds = dates();
    status.textContent = ds.length ? `${ds.length} days from ${dayLabel(ds[0], 0).big}, blended from ${WIND_MODELS.length} wind and ${MARINE_MODELS.length} wave models. Scores are each day's daylight average; faded days are less certain.` : 'Forecast unavailable right now.';
    render();
  }).catch(() => { status.textContent = 'Forecast unavailable right now.'; });
</script>
</body>
</html>
